<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingfisher River Run</title>
<style>
  :root{
    --sky-hi:#F2FBFD; --sky-lo:#CBEDF5;
    --water-1:#5BC6DE; --water-2:#2FA6C7; --water-3:#15789C;
    --azure:#23B5DE; --cobalt:#1266A8; --breast:#F08A33;
    --ink:#0F3A55; --card:#FFFFFF;
    --wood:#7A5535; --wood-d:#5E3F26;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden;
    font-family:'Trebuchet MS', Verdana, 'Segoe UI', sans-serif;
    background:var(--sky-lo);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  #scene{ position:fixed; inset:0; overflow:hidden; }
  #sky{ position:absolute; left:0; right:0; top:0; height:62%;
    background:linear-gradient(var(--sky-hi), var(--sky-lo)); }
  .cloud{ position:absolute; background:#fff; opacity:.85; border-radius:999px; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud::before{ width:55%; height:160%; left:12%; top:-70%; }
  .cloud::after{ width:45%; height:130%; right:14%; top:-45%; }
  #cloud1{ width:130px; height:34px; top:6%; left:-140px; animation:drift 90s linear infinite; }
  #cloud2{ width:90px; height:26px; top:15%; left:-100px; animation:drift 130s linear infinite; animation-delay:-60s; }
  @keyframes drift{ from{ transform:translateX(0);} to{ transform:translateX(120vw);} }

  #water{ position:absolute; left:0; right:0; top:62%; bottom:0;
    background:linear-gradient(var(--water-1) 0%, var(--water-2) 45%, var(--water-3) 100%); }
  .waveband{ position:absolute; left:0; width:200%; height:26px; opacity:.3; pointer-events:none; }
  .waveband svg{ display:block; width:100%; height:100%; }
  #wave1{ top:62%; margin-top:-8px; animation:waveslide 14s linear infinite; }
  #wave2{ top:74%; opacity:.13; animation:waveslide 22s linear infinite reverse; }
  @keyframes waveslide{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  .strip{ position:absolute; left:0; width:100%; overflow:visible; pointer-events:none; }
  .strip .tile{ position:absolute; top:0; width:900px; height:100%; }
  .strip .tile svg{ display:block; width:100%; height:100%; }
  #farTrees{ top:calc(62% - 110px); height:110px; opacity:.8; }
  #reeds{ bottom:0; height:120px; opacity:.9; z-index:22; }

  #bird{ position:absolute; z-index:30; width:min(20vw,104px); pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(10,40,60,.25)); }
  #bird svg{ display:block; width:100%; height:auto; overflow:visible; }

  .gate{ position:absolute; z-index:18; width:110px; top:8%; bottom:0; pointer-events:none; }
  .gate svg{ display:block; width:100%; height:100%; }
  .gate.opening{ transition:transform .6s ease-in, opacity .6s; transform:translateY(70px); opacity:0; }

  .wbub{ position:absolute; z-index:19; border-radius:50%;
    border:2px solid rgba(255,255,255,.85); background:rgba(255,255,255,.16);
    cursor:pointer; }

  .fish{ position:absolute; z-index:20; cursor:pointer; }
  .fish svg{ display:block; width:100%; height:auto; overflow:visible;
    filter:drop-shadow(0 5px 5px rgba(8,45,66,.30)); }
  .fish .num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:clamp(22px,5vw,34px); color:var(--ink);
    padding-bottom:6%; pointer-events:none; }
  .fish.wiggle{ animation:wiggle .45s ease; }
  @keyframes wiggle{
    0%,100%{ transform:translate(var(--tx),var(--ty)) rotate(0deg); }
    25%{ transform:translate(var(--tx),var(--ty)) rotate(-7deg); }
    50%{ transform:translate(var(--tx),var(--ty)) rotate(6deg); }
    75%{ transform:translate(var(--tx),var(--ty)) rotate(-4deg); }
  }
  .fish.hint svg{ animation:hintpulse 1.1s ease-in-out infinite; }
  @keyframes hintpulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 5px 5px rgba(8,45,66,.30)); }
    50%{ transform:scale(1.09); filter:drop-shadow(0 0 14px rgba(255,255,255,.9)); }
  }

  .ring{ position:absolute; z-index:25; border:4px solid rgba(255,255,255,.9);
    border-radius:50%; pointer-events:none; }
  .drop{ position:absolute; z-index:25; width:9px; height:9px; border-radius:50%;
    background:rgba(235,250,255,.95); pointer-events:none; }
  .minifish{ position:absolute; z-index:35; width:44px; pointer-events:none; }

  #ui{ position:absolute; inset:0; z-index:40; pointer-events:none; }
  .badge{ position:absolute; background:rgba(255,255,255,.92); color:var(--ink);
    border-radius:999px; padding:8px 16px; font-weight:900; font-size:17px;
    box-shadow:0 3px 8px rgba(10,50,70,.18); }
  #levelBadge{ top:12px; left:12px; }
  #scoreBadge{ top:12px; right:64px; }
  #soundBtn{ position:absolute; top:10px; right:12px; width:42px; height:42px;
    border:none; border-radius:50%; background:rgba(255,255,255,.92); font-size:20px;
    box-shadow:0 3px 8px rgba(10,50,70,.18); cursor:pointer; pointer-events:auto; }

  #hudNest{ position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:118px; pointer-events:none; filter:drop-shadow(0 2px 4px rgba(10,50,70,.25)); }
  #hudNest svg{ display:block; width:100%; height:auto; overflow:visible; }
  #problemCard{ position:absolute; top:60px; left:50%; transform:translateX(-50%);
    background:var(--card); color:var(--ink); border-radius:24px; padding:10px 30px;
    font-weight:900; font-size:clamp(32px,8vw,48px); letter-spacing:2px;
    box-shadow:0 6px 16px rgba(10,50,70,.22); white-space:nowrap; }
  #hintLine{ position:absolute; top:150px; left:50%; transform:translateX(-50%);
    color:#fff; font-weight:700; font-size:clamp(15px,4vw,19px);
    text-shadow:0 2px 4px rgba(10,50,70,.5); transition:opacity 1s; white-space:nowrap; }

  #problemCard{ transition:opacity .35s, transform .35s; }
  #problemCard.off{ opacity:0; transform:translate(-50%,-18px); }
  #bubble{ position:absolute; z-index:45; left:12px; top:calc(20vh + 52px);
    max-width:min(72vw,360px); background:rgba(255,255,255,.96); color:var(--ink);
    border-radius:18px; padding:10px 16px; font-weight:800;
    font-size:clamp(15px,4vw,19px); line-height:1.35;
    box-shadow:0 6px 16px rgba(10,50,70,.25); opacity:0; transform:translateY(6px);
    transition:opacity .3s, transform .3s; pointer-events:none; }
  #bubble.show{ opacity:1; transform:translateY(0); pointer-events:auto; cursor:pointer; }
  #bubble::after{ content:""; position:absolute; left:26px; top:-10px;
    border:10px solid transparent; border-bottom-color:rgba(255,255,255,.96);
    border-top:none; }
  #bubble.dots{ letter-spacing:4px; }

  #overlay{ position:absolute; inset:0; z-index:50; display:flex; align-items:center;
    justify-content:center; background:rgba(12,60,84,.45); backdrop-filter:blur(3px); }
  #overlay.hidden{ display:none; }
  #panel{ background:#fff; border-radius:28px; padding:28px 34px; max-width:min(86vw,420px);
    text-align:center; color:var(--ink); box-shadow:0 12px 40px rgba(5,35,55,.35); }
  #panel h1{ margin:6px 0 4px; font-size:clamp(28px,7vw,40px); letter-spacing:1px; }
  #panel p{ margin:8px 0 18px; font-size:clamp(16px,4.2vw,19px); font-weight:700; color:#2A5B77; }
  #panel .birdart{ width:120px; margin:0 auto; }
  #playBtn{ border:none; border-radius:999px; padding:14px 44px; font-size:22px;
    font-weight:900; font-family:inherit; color:#fff; cursor:pointer;
    background:linear-gradient(#F49A48,#E5751F); box-shadow:0 5px 0 #B85A12;
    letter-spacing:1px; }
  #playBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #B85A12; }

  @media (prefers-reduced-motion: reduce){
    .cloud,.waveband{ animation:none !important; }
    .fish.hint svg{ animation:none; outline:4px solid #fff; border-radius:20px; }
  }
</style>
</head>
<body>
<div id="scene">
  <div id="sky"></div>
  <div id="cloud1" class="cloud"></div>
  <div id="cloud2" class="cloud"></div>

  <div id="farTrees" class="strip">
    <div class="tile" style="left:0"></div>
    <div class="tile" style="left:900px"></div>
  </div>

  <div id="water"></div>
  <div id="wave1" class="waveband"><svg viewBox="0 0 1200 26" preserveAspectRatio="none">
    <path d="M0 14 Q50 2 100 14 T200 14 T300 14 T400 14 T500 14 T600 14 T700 14 T800 14 T900 14 T1000 14 T1100 14 T1200 14 V26 H0 Z" fill="#ffffff"/>
  </svg></div>
  <div id="wave2" class="waveband"><svg viewBox="0 0 1200 26" preserveAspectRatio="none">
    <path d="M0 14 Q60 4 120 14 T240 14 T360 14 T480 14 T600 14 T720 14 T840 14 T960 14 T1080 14 T1200 14 V26 H0 Z" fill="#ffffff"/>

  <div id="gateLayer"></div>

      <clipPath id="bodyClip"><ellipse cx="55" cy="62" rx="35" ry="27"/></clipPath>

    <rect x="26" y="60" width="76" height="42" fill="var(--breast)" clip-path="url(#bodyClip)" transform="rotate(10 60 74)"/>
    <path d="M36 48 Q60 38 79 51 Q72 78 46 77 Q34 64 36 48 Z" fill="var(--cobalt)"/>
    <circle cx="46" cy="55" r="2" fill="#8FDCF2"/><circle cx="58" cy="50" r="2" fill="#8FDCF2"/>
    <circle cx="54" cy="62" r="2" fill="#8FDCF2"/><circle cx="66" cy="58" r="2" fill="#8FDCF2"/>
    <circle cx="88" cy="38" r="21" fill="var(--azure)"/>
    <circle cx="82" cy="30" r="2" fill="#8FDCF2"/><circle cx="92" cy="26" r="2" fill="#8FDCF2"/>
    <ellipse cx="97" cy="45" rx="8" ry="5.5" fill="var(--breast)"/>

    <g id="caught" opacity="0">
      <ellipse cx="122" cy="52" rx="13" ry="6.5" fill="#C4D5DA" transform="rotate(70 122 52)"/>

  <div id="ui">
    <div id="levelBadge" class="badge">Level 1</div>

    <div id="hudNest"><svg viewBox="0 0 150 74">
      <path d="M20 46 Q75 70 130 46 Q126 72 75 74 Q24 72 20 46 Z" fill="#6E4C2B"/>
      <ellipse cx="75" cy="46" rx="57" ry="15" fill="#8A6238"/>
      <g id="chick0" transform="translate(42,26) scale(0.82)"></g>
      <g id="chick1" transform="translate(75,20) scale(0.82)"></g>
      <g id="chick2" transform="translate(108,26) scale(0.82)"></g>
    </svg></div>
    <div id="problemCard" class="off">3 &#215; 4</div>

  <div id="overlay">
    <div id="panel">
      <div class="birdart"><svg viewBox="0 0 134 120">
        <path d="M24 56 L3 42 L13 64 Z" fill="#1266A8"/>
        <ellipse cx="55" cy="62" rx="35" ry="27" fill="#23B5DE"/>
        <path d="M36 48 Q60 38 79 51 Q72 78 46 77 Q34 64 36 48 Z" fill="#1266A8"/>
        <circle cx="88" cy="38" r="21" fill="#23B5DE"/>
        <ellipse cx="97" cy="45" rx="8" ry="5.5" fill="#F08A33"/>
        <ellipse cx="82" cy="53" rx="9" ry="6" fill="#ffffff" transform="rotate(-14 82 53)"/>
        <path d="M105 33 L133 40 L105 47 Z" fill="#26343B"/>
        <circle cx="95" cy="34" r="3.4" fill="#17232B"/>
        <circle cx="96.2" cy="32.8" r="1.1" fill="#ffffff"/>
      </svg></div>
      <h1 id="panelTitle">Kingfisher River Run</h1>
      <p id="panelText">Hold anywhere to fly up, let go to glide down.<br>
      Reed walls block the river — tap the fish<br>with the right answer to fly past!</p>
      <button id="playBtn">Fly!</button>
    </div>

</div>

<script>
'use strict';

/* ================= model (pure, DOM-free) ================= */
var LEVELS = [
  { tables:[2,5,10],            maxFactor:5 },
  { tables:[2,3,4,5,10],        maxFactor:6 },
  { tables:[2,3,4,5,6,10],      maxFactor:8 },
  { tables:[2,3,4,5,6,7,8,9,10],maxFactor:9 }
];
var CATCHES_PER_LEVEL = 6;   /* 3 chicks, 2 fish each */

function randInt(lo, hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ================= adaptive coach: Leitner queue over fact atoms =================
   An atom is a (table, factor) fact family. The queue schedules atoms by
   problem count, not wall clock: misses return in 2-3 problems, fluent facts
   space out. Presentation form (mul vs div) is chosen at serve time; a fact's
   first exposure is always multiplication. All pure and DOM-free.          */
var COACH = {
  FAST_MS: 7000,                    /* first-tap correct under this = fluent */
  INTERVALS: [[2,3],[4,6],[8,11],[14,18]],  /* due gap (in problems) per box */
  MISS_RETURN: [2,3],               /* gap after a miss; box drops to 0 */
  WINDOW: 8, PASS: 6,               /* advance on >=6 of last 8 first-tap correct */
  INTRO_RUN: 4,                     /* blocked problems when a level adds tables */
  INVERSE_P: 0.35,                  /* chance a solved a x b is followed by ab / a */
  DIV_P: [0.3, 0.5, 0.5, 0.5],      /* division probability by box (unseen: never) */
  PRAISE_LOCAL_P: 0.35,             /* chance a catch gets an instant local quip, no API */
  PREHINT_MAX_BOX: 1                /* strategy whisper shown while a fact is in box 0-1 */
};

function atomKey(t, f){ return t + ':' + f; }
function levelSpec(lvl){ return LEVELS[Math.min(lvl, LEVELS.length - 1)]; }
function jitter(range){ return randInt(range[0], range[1]); }

function ensureAtoms(Q){
  var L = levelSpec(Q.level);
  for(var i=0;i<L.tables.length;i++){
    for(var f=1;f<=L.maxFactor;f++){
      var k = atomKey(L.tables[i], f);
      if(!Q.atoms[k]) Q.atoms[k] = { t: L.tables[i], f: f, box: 0, dueIn: 0, seen: false };
    }
  }
}
function initQueue(){
  var Q = { level: 0, atoms: {}, history: [], served: 0,
            introTables: [], introLeft: 0, pendingInverse: null };
  ensureAtoms(Q);
  return Q;
}
function poolFor(Q){
  var L = levelSpec(Q.level);
  var tables = (Q.introLeft > 0) ? Q.introTables : L.tables;
  var out = [];
  for(var i=0;i<tables.length;i++){
    for(var f=1;f<=L.maxFactor;f++) out.push(Q.atoms[atomKey(tables[i], f)]);
  }
  return out;
}
function tickDue(Q){
  for(var k in Q.atoms){ if(Q.atoms[k].seen) Q.atoms[k].dueIn--; }
}
function chooseAtom(Q){
  if(Q.pendingInverse){
    var inv = Q.pendingInverse;
    Q.pendingInverse = null;
    return { atom: inv, form: 'div', isInverse: true };
  }
  var pool = poolFor(Q);           /* pool BEFORE the decrement: the last
                                      blocked problem must still be restricted */
  if(Q.introLeft > 0) Q.introLeft--;
  var due = pool.filter(function(a){ return a.seen && a.dueIn <= 0; });
  var atom;
  if(due.length){
    var minBox = due[0].box;
    for(var i=1;i<due.length;i++) if(due[i].box < minBox) minBox = due[i].box;
    atom = pick(due.filter(function(a){ return a.box === minBox; }));
  } else {
    var unseen = pool.filter(function(a){ return !a.seen; });
    if(unseen.length){ atom = pick(unseen); }
    else {
      atom = pool[0];
      for(var j=1;j<pool.length;j++) if(pool[j].dueIn < atom.dueIn) atom = pool[j];
    }
  }
  var form = !atom.seen ? 'mul'
    : (Math.random() < COACH.DIV_P[atom.box] ? 'div' : 'mul');
  return { atom: atom, form: form, isInverse: false };
}
function problemFromSel(sel){
  var t = sel.atom.t, f = sel.atom.f;
  if(sel.form === 'div'){
    return { kind:'div', a: t*f, b: t, text: (t*f) + ' \u00F7 ' + t, answer: f,
             atom: sel.atom, form: 'div', isInverse: sel.isInverse };
  }
  var flip = Math.random() < 0.5;
  var a = flip ? f : t, b = flip ? t : f;
  return { kind:'mul', a: a, b: b, text: a + ' \u00D7 ' + b, answer: a*b,
           atom: sel.atom, form: 'mul', isInverse: sel.isInverse };
}
function recordOutcome(Q, prob, firstTap, ms){
  var a = prob.atom;
  a.seen = true;
  if(!firstTap){
    a.box = 0;
    a.dueIn = jitter(COACH.MISS_RETURN);
  } else if(ms <= COACH.FAST_MS){
    a.box = Math.min(COACH.INTERVALS.length - 1, a.box + 1);
    a.dueIn = jitter(COACH.INTERVALS[a.box]);
  } else {
    a.dueIn = jitter(COACH.INTERVALS[a.box]);   /* slow-correct: box holds, stays in circulation */
  }
  Q.history.push(firstTap ? 1 : 0);
  if(Q.history.length > COACH.WINDOW) Q.history.shift();
  Q.served++;
  Q.pendingInverse = (prob.form === 'mul' && firstTap && !prob.isInverse &&
                      a.f >= 2 && Math.random() < COACH.INVERSE_P) ? a : null;
}
function windowSum(Q){
  var s = 0;
  for(var i=0;i<Q.history.length;i++) s += Q.history[i];
  return s;
}
function maybeAdvance(Q){
  if(Q.history.length < COACH.WINDOW || windowSum(Q) < COACH.PASS) return false;
  var before = levelSpec(Q.level).tables;
  Q.level++;
  var after = levelSpec(Q.level).tables;
  Q.introTables = after.filter(function(t){ return before.indexOf(t) === -1; });
  Q.introLeft = Q.introTables.length ? COACH.INTRO_RUN : 0;
  Q.history = [];
  Q.pendingInverse = null;
  ensureAtoms(Q);
  return true;
}

var Q = initQueue();

function makeChoices(ans){
  var set = [ans];
  var cands = shuffle([ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, ans*2, Math.floor(ans/2)]);
  for(var i=0;i<cands.length && set.length<3;i++){
    var c = cands[i];
    if(c >= 1 && c <= 110 && set.indexOf(c) === -1) set.push(c);
  }
  var guard = 0;
  while(set.length < 3 && guard++ < 60){
    var d = ans + randInt(-3,3);
    if(d >= 1 && set.indexOf(d) === -1) set.push(d);
  }
  return shuffle(set);
}

/* ================= feedback (pure helpers) ================= */
function skipCount(step, times){
  var out = [];
  for(var i=1;i<=times;i++) out.push(step*i);
  return out.join(', ');
}
var PRAISE_QUIPS = [
  'Splash-tastic!', 'Fin-tastic catch!', 'Gulp \u2014 delicious maths!',
  'That fish never stood a chance!', 'The chicks say YUM!', 'Beak-utiful!',
  'O-FISH-ally brilliant!', 'Zoom \u2014 straight to the nest!',
  'Kip is very impressed!', 'Another whopper for the nest!'
];
var HINT_BIG = [
  'Whoa \u2014 too big! Smaller fish!',
  'That fish ate too much \u2014 go smaller!',
  'Too big! Shrink your pick!'
];
var HINT_SMALL = [
  'Too small \u2014 find a bigger fish!',
  'Nearly \u2014 think bigger!',
  'That one\u2019s a tiddler \u2014 go bigger!'
];
function localPraise(p){
  if(p.kind === 'mul' && Math.min(p.a, p.b) >= 2 && Math.min(p.a, p.b) <= 4 &&
     p.answer <= 24 && Math.random() < 0.4){
    return skipCount(Math.max(p.a, p.b), Math.min(p.a, p.b)) + ' \u2014 gobble!';
  }
  return pick(PRAISE_QUIPS);
}
function localHint(p, chosen){
  if(p.kind === 'mul' && (p.a === 1 || p.b === 1)){
    return 'Times 1 changes nothing \u2014 look again!';
  }
  return pick(chosen > p.answer ? HINT_BIG : HINT_SMALL);
}
function localPreHint(p){
  if(p.kind === 'div'){
    return pick([
      'How many ' + p.b + 's hide in ' + p.a + '?',
      'Share ' + p.a + ' into ' + p.b + 's!',
      'What times ' + p.b + ' makes ' + p.a + '?'
    ]);
  }
  var t = (p.a === 2 || p.a === 5 || p.a === 10) ? p.a : p.b;
  var f = (t === p.a) ? p.b : p.a;
  if(f === 1 || t === 1) return 'Times 1? Easy \u2014 nothing changes!';
  if(t === 10) return pick(['Tens always end in zero!', 'Count in tens \u2014 zoom!']);
  if(t === 5)  return pick(['Fives end in 5 or 0!', 'Count in fives!']);
  if(t === 2)  return pick(['Twos are doubles!', 'Double it up!']);
  if(f >= 3 && Math.random() < 0.5) return 'Count: ' + t + ', ' + (2*t) + '\u2026 keep going!';
  return 'Try counting in ' + t + 's!';
}
var recentLines = [];
var PRAISE_FLAVORS = [
  'Make a quick fish or water pun.',
  'Be dramatically over-the-top amazed.',
  'Pretend the caught fish is grumbling about it, funnily.',
  'Cheer like an excited sports commentator.',
  'Say it like a proud pirate.',
  'Invent a silly celebration word.',
  'Whisper it like a big secret.',
  'Make two words rhyme.'
];
var HINT_FLAVORS = [
  'Make it a playful clue, not a lesson.',
  'Blame a cheeky fish for hiding the answer.',
  'Give the clue like a treasure hunt.',
  'Sound like a fun big sibling.'
];
function feedbackPrompt(p, chosen){
  var core = 'You are Kip, a cheeky kingfisher in a maths game for a young child. ' +
    'Reply with ONE line of AT MOST 8 words, UK English, playful. ' +
    'No lists, no lessons, at most one emoji. ';
  var avoid = recentLines.length
    ? 'Never repeat these lines: ' + recentLines.join(' | ') + '. ' : '';
  var inv = p.isInverse ? 'They just solved the times version of this. ' : '';
  if(chosen === null){
    var teach = Math.random() < 0.34
      ? 'Sneak the counting trick into a couple of words. ' : '';
    return core + inv + 'They just got ' + p.text + ' = ' + p.answer + ' right. ' +
      pick(PRAISE_FLAVORS) + ' ' + teach + avoid + 'Reply with the line only.';
  }
  var dir = chosen > p.answer ? 'too big' : 'too small';
  return core + inv + 'The problem is ' + p.text + '. The correct answer is ' + p.answer +
    ' \u2014 you must NOT reveal it. They picked ' + chosen + ', which is ' + dir + '. ' +
    pick(HINT_FLAVORS) + ' Tell them ' + dir + ', or a quick counting trick. ' +
    avoid + 'Reply with the line only.';
}

/* ================= Sonnet feedback (claude.ai artifact API; falls back locally) ================= */
function sonnetFeedback(p, chosen){
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, 4000);
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: controller.signal,
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: feedbackPrompt(p, chosen) }]
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    clearTimeout(timer);
    var txt = (data.content || []).map(function(c){
      return c.type === 'text' ? c.text : '';
    }).join(' ').replace(/\s+/g, ' ').trim().replace(/^["']|["']$/g, '');
    if(!txt) throw new Error('empty feedback');
    return txt.length > 90 ? txt.slice(0, 87) + '\u2026' : txt;
  });
}

/* ================= audio ================= */
var audioCtx = null, muted = false;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, delay, type, vol){
  if(muted || !audioCtx) return;
  var t0 = audioCtx.currentTime + (delay || 0);
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxCorrect(){ tone(880, .12, 0, 'sine', .16); tone(1320, .16, .09, 'sine', .16); }
function sfxWrong(){ tone(200, .18, 0, 'triangle', .12); }
function sfxLevel(){ tone(660,.12,0); tone(880,.12,.11); tone(1100,.14,.22); tone(1320,.2,.33); }
function sfxSplash(){
  if(muted || !audioCtx) return;
  var t0 = audioCtx.currentTime;
  var len = Math.floor(audioCtx.sampleRate * 0.28);
  var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * (1 - i/len); }
  var src = audioCtx.createBufferSource(); src.buffer = buf;
  var f = audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 900;
  var g = audioCtx.createGain(); g.gain.value = 0.22;
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t0);
}

/* ================= flight physics (pure) ================= */
var FLIGHT = {
  RISE_ACC: -900, FALL_ACC: 620,
  MAX_RISE: -190, MAX_SINK: 210,
  SPEED: 150, SPEED_PER_LEVEL: 10, SPEED_MAX: 220
};
function stepFlight(y, vy, holding, dt, minY, maxY){
  var a = holding ? FLIGHT.RISE_ACC : FLIGHT.FALL_ACC;
  vy += a * dt;
  if(vy < FLIGHT.MAX_RISE) vy = FLIGHT.MAX_RISE;
  if(vy > FLIGHT.MAX_SINK) vy = FLIGHT.MAX_SINK;
  y += vy * dt;
  if(y < minY){ y = minY; vy = 0; }
  if(y > maxY){ y = maxY; vy = 0; }
  return { y: y, vy: vy };
}
function scrollSpeed(level){
  return Math.min(FLIGHT.SPEED_MAX, FLIGHT.SPEED + level * FLIGHT.SPEED_PER_LEVEL);
}

/* ================= coach bubble & speech ================= */
var FB = { seq: 0 };
var bubbleGen = 0;
var bubbleTimer = null, bubbleSafety = null, bubbleTapCb = null;
var currentUtterance = null;   /* held reference: stops GC from killing speech mid-utterance */

var kipVoice = null;
function pickVoice(){
  if(!window.speechSynthesis || !speechSynthesis.getVoices) return;
  var vs = speechSynthesis.getVoices() || [];
  for(var i=0;i<vs.length;i++){
    if(/en[-_]GB/i.test(vs[i].lang)){ kipVoice = vs[i]; return; }
  }
}
if(window.speechSynthesis){
  pickVoice();
  try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){}
}
function readTime(text){
  return Math.min(5000, Math.max(1800, 900 + 55 * text.length));
}
function rememberLine(text){
  if(recentLines.indexOf(text) === -1) recentLines.push(text);
  if(recentLines.length > 6) recentLines.shift();
}
function clearBubbleTimers(){
  if(bubbleTimer){ clearTimeout(bubbleTimer); bubbleTimer = null; }
  if(bubbleSafety){ clearTimeout(bubbleSafety); bubbleSafety = null; }
}
function speak(text, onDone){
  if(muted || !window.speechSynthesis) return null;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(
      text.replace(/\u00D7/g, ' times ').replace(/\u00F7/g, ' divided by '));
    u.lang = 'en-GB'; u.rate = 1.06; u.pitch = 1.45;
    if(kipVoice) u.voice = kipVoice;
    var fired = false;
    function settle(){ if(!fired){ fired = true; if(onDone) onDone(); } }
    u.onend = settle;
    u.onerror = settle;
    currentUtterance = u;
    speechSynthesis.speak(u);
    return u;
  }catch(e){ return null; }
}
function showThinking(){
  bubbleGen++;
  clearBubbleTimers();
  bubbleTapCb = null;
  bubbleEl.textContent = '\u2022 \u2022 \u2022';
  bubbleEl.classList.add('dots');
  bubbleEl.classList.add('show');
}
function showBubble(text, minHoldMs, onDone){
  bubbleGen++;
  var gen = bubbleGen;
  clearBubbleTimers();
  bubbleEl.textContent = text;
  bubbleEl.classList.remove('dots');
  bubbleEl.classList.add('show');
  rememberLine(text);
  bubbleTapCb = onDone || null;
  /* dismiss only when BOTH the minimum display time has passed AND speech
     has finished (end/error event); a safety timeout covers browsers that
     never fire the event. */
  var speechDone = false, holdDone = false;
  function maybeDismiss(){
    if(gen !== bubbleGen) return;   /* a newer bubble owns the stage */
    if(speechDone && holdDone) dismissBubble();
  }
  var u = speak(text, function(){ speechDone = true; maybeDismiss(); });
  if(!u) speechDone = true;
  bubbleTimer = setTimeout(function(){
    bubbleTimer = null;
    holdDone = true;
    maybeDismiss();
  }, minHoldMs);
  if(u){
    bubbleSafety = setTimeout(function(){
      bubbleSafety = null;
      speechDone = true;
      maybeDismiss();
    }, minHoldMs + 12000);
  }
}
function dismissBubble(){
  bubbleGen++;
  clearBubbleTimers();
  bubbleEl.classList.remove('show');
  if(window.speechSynthesis) speechSynthesis.cancel();
  var cb = bubbleTapCb; bubbleTapCb = null;
  if(cb) cb();
}
bubbleEl.addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  dismissBubble();
});

function spawnGateFish(choices, answer){
  clearFish();
  var w = Math.max(92, Math.min(132, vw() * 0.24));
  var gx = gateScreenX();
  var x = Math.max(birdX() + 40, gx - w - 34);
  var top = waterTop() + 14;
  var space = Math.min(w * 0.62 + 18, (vh() - top - w * 0.6 - 10) / 2);
  var order = shuffle([0, 1, 2]);
  for(var i=0;i<choices.length;i++){
    var el = document.createElement('div');
    el.className = 'fish';
    el.style.width = w + 'px';
    el.innerHTML = fishSVG(FISH_COLORS[i % FISH_COLORS.length]) +
      '<div class="num">' + choices[i] + '</div>';
    fishLayer.appendChild(el);
    var f = {
      el: el, svg: el.querySelector('svg'),
      value: choices[i], correct: choices[i] === answer,
      x: x + (i % 2) * 14,
      baseY: top + order[i] * space,
      bobPhase: Math.random() * 6.28,
      bobAmp: 4 + Math.random() * 4,
      w: w, alive: true
    };
    f.svg.style.transform = 'scaleX(1)';
    (function(ff){
      ff.el.addEventListener('pointerdown', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        onFishTap(ff);
      });
    })(f);
    S.fish.push(f);
  }
}

function positionFish(f, t){
  var y = f.baseY + Math.sin(t * 0.0016 + f.bobPhase) * f.bobAmp;
  f.el.style.setProperty('--tx', f.x + 'px');
  f.el.style.setProperty('--ty', y + 'px');
  f.el.style.transform = 'translate(' + f.x + 'px,' + y + 'px)';
  f.curY = y;
}

function flyBird(toX, toY, ms, tilt, done){
  if(RM){ birdEl.style.left = toX + 'px'; birdEl.style.top = toY + 'px'; if(done) done(); return; }
  var fromX = parseFloat(birdEl.style.left) || 0;
  var fromY = parseFloat(birdEl.style.top) || 0;
  var start = null;
  function step(t){
    if(!start) start = t;
    var k = Math.min(1, (t - start)/ms);
    var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;   /* easeInOutQuad */
    var arc = -Math.sin(Math.PI * e) * 40;
    birdEl.style.left = (fromX + (toX-fromX)*e) + 'px';
    birdEl.style.top  = (fromY + (toY-fromY)*e + arc) + 'px';
    birdEl.style.transform = 'rotate(' + (tilt * Math.sin(Math.PI * e)) + 'deg)';
    if(k < 1) requestAnimationFrame(step);
    else { birdEl.style.transform = 'rotate(0deg)'; if(done) done(); }
  }
  requestAnimationFrame(step);
}

function gateProblem(){
  tickDue(Q);
  S.problem = problemFromSel(chooseAtom(Q));
  S.wrongs = 0;
  problemCard.textContent = S.problem.text;
  problemCard.classList.remove('off');
  spawnGateFish(makeChoices(S.problem.answer), S.problem.answer);
  S.locked = false;
  S.shownAt = performance.now();
  if(S.problem.atom.box <= COACH.PREHINT_MAX_BOX){
    showWhisper(localPreHint(S.problem));
  }
}

function onFishTap(f){
  if(S.locked || !f.alive || !S.started) return;
  ensureAudio();
  if(f.correct){ catchSequence(f); }
  else { wrongTap(f); }
}

function wrongTap(f){
  sfxWrong();
  S.wrongs++;
  f.alive = false;
  f.el.classList.add('wiggle');
  var el = f.el;
  setTimeout(function(){
    el.animate(
      [ { transform: el.style.transform, opacity: 1 },
        { transform: el.style.transform + ' translate(-170px,60px) rotate(-24deg)', opacity: 0 } ],
      { duration: 550, easing: 'ease-in', fill: 'forwards' }
    ).onfinish = function(){ if(el.parentNode) el.parentNode.removeChild(el); };
  }, 320);
  if(S.wrongs >= 2){
    for(var i=0;i<S.fish.length;i++){
      if(S.fish[i].correct && S.fish[i].alive) S.fish[i].el.classList.add('hint');
    }
  }
  var prob = S.problem;
  var mySeq = ++FB.seq;
  if(S.wrongs === 1){
    var q = localHint(prob, f.value);      /* instant: direction is computable locally */
    showBubble(q, readTime(q));
  } else {
    showThinking();
    sonnetFeedback(prob, f.value).then(function(txt){
      if(FB.seq === mySeq) showBubble(txt, readTime(txt));
    }).catch(function(){
      if(FB.seq === mySeq){
        var t = localHint(prob, f.value);
        showBubble(t, readTime(t));
      }
    });
  }
}

function catchSequence(f){
  S.locked = true;
  f.alive = false;
  sfxCorrect();
  var prob = S.problem;
  recordOutcome(Q, prob, S.wrongs === 0, performance.now() - (S.shownAt || performance.now()));
  var mySeq = ++FB.seq;
  var praiseText = null, praiseSettled = false;
  if(Math.random() < COACH.PRAISE_LOCAL_P){
    praiseText = localPraise(prob);
    praiseSettled = true;
  } else {
    sonnetFeedback(prob, null)
      .then(function(txt){ praiseText = txt; praiseSettled = true; })
      .catch(function(){ praiseSettled = true; });
  }

  S.diving = true;
  var rect = f.el.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var bw = birdEl.offsetWidth || 100;
  var returnY = S.birdY;

  flyBird(cx - bw * 0.7, cy - bw * 0.55, 460, 34, function(){
    splashAt(cx, cy);
    f.el.remove();
    caughtG.setAttribute('opacity', '1');
    for(var i=0;i<S.fish.length;i++){
      var o = S.fish[i];
      if(o !== f && o.alive){
        o.alive = false;
        (function(el){
          el.animate([{opacity:1},{opacity:0}], {duration:400, easing:'ease-out', fill:'forwards'})
            .onfinish = function(){ el.remove(); };
        })(o.el);
      }
    }
    flyBird(birdX(), returnY, 440, -18, function(){
      caughtG.setAttribute('opacity', '0');
      S.diving = false;
      S.totalCaught++;
      S.levelCaught++;
      updateBadges();
      var beforeFed = Math.floor((S.levelCaught - 1) / 2);
      var afterFed = Math.floor(S.levelCaught / 2);
      flyMiniFishToNest(birdX() + bw * 0.8, returnY + 30, function(){
        if(afterFed > beforeFed) renderChicks();
        var proceed = function(){
          if(S.levelCaught >= CATCHES_PER_LEVEL){ nestStop(); }
          else { openGate(); }
        };
        var deliver = function(){
          if(FB.seq !== mySeq){ proceed(); return; }
          var txt = praiseText || localPraise(prob);
          showBubble(txt, readTime(txt), proceed);
        };
        if(praiseSettled){ deliver(); }
        else {
          showThinking();
          var waited = 0;
          var poll = setInterval(function(){
            waited += 120;
            if(praiseSettled || waited > 4300){ clearInterval(poll); deliver(); }
          }, 120);
        }
      });
    });
  });
}

function dismissGateVisual(){
  if(!W.gate) return;
  sfxGate();
  var el = W.gate.el;
  el.classList.add('opening');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 700);
  W.gate = null;
}

function openGate(){
  dismissGateVisual();
  clearFish();
  problemCard.classList.add('off');
  W.nextGateAt = W.scroll + randInt(1500, 2300);
  W.mode = 'fly';
}

function nestStop(){
  dismissGateVisual();
  clearFish();
  problemCard.classList.add('off');
  sfxLevel();
  S.levelCaught = 0;
  panelTitle.textContent = 'You reached the nest!';
  if(maybeAdvance(Q)){
    S.level = Q.level;
    panelText.innerHTML = 'All the chicks are fed! &#127881;<br>The river gets trickier from here\u2026';
  } else {
    panelText.innerHTML = 'Chicks fed! They\u2019re already hungry again \u2014<br>back down the river we go! &#128031;';
  }
  playBtn.textContent = 'Keep flying';
  W.mode = 'paused';
  overlay.classList.remove('hidden');
}

/* ================= main loop ================= */
var lastT = 0, lastBadgeSec = -1;
function tick(t){
  if(!lastT) lastT = t;
  var dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;

  if((W.mode === 'fly' || W.mode === 'atGate') && !S.diving){
    var st = stepFlight(S.birdY, S.vy, S.holding, dt, birdMinY(), birdMaxY());
    S.birdY = st.y; S.vy = st.vy;
    birdEl.style.left = birdX() + 'px';
    birdEl.style.top = S.birdY + 'px';
    birdEl.style.transform = RM ? 'rotate(0deg)'
      : 'rotate(' + Math.max(-16, Math.min(22, S.vy * 0.055)) + 'deg)';
  }

  if(W.mode === 'fly'){
    W.scroll += scrollSpeed(S.level) * dt;
    if(!W.gate && W.scroll + vw() > W.nextGateAt) spawnGate(W.nextGateAt);
    if(W.gate){
      var gx = gateScreenX();
      W.gate.el.style.left = gx + 'px';
      if(gx <= birdX() + (birdEl.offsetWidth || 100) + 150){
        W.mode = 'atGate';
        gateProblem();
      }
    }
    if(!RM && t - W.lastBubbleAt > 1500 + Math.random() * 1600){
      W.lastBubbleAt = t;
      if(W.bubbles.length < 5) spawnDecorBubble();
    }
  }

  if(W.gate) W.gate.el.style.left = gateScreenX() + 'px';

  for(var bi = W.bubbles.length - 1; bi >= 0; bi--){
    var b = W.bubbles[bi];
    var sx = b.worldX - W.scroll;
    if(sx < -60){ b.el.remove(); W.bubbles.splice(bi, 1); continue; }
    b.el.style.left = sx + 'px';
    b.el.style.top = (b.y + Math.sin(t * 0.002 + b.phase) * 6) + 'px';
  }

  var treeX = -((W.scroll * 0.35) % 900);
  farTrees.style.transform = 'translateX(' + treeX + 'px)';
  var reedX = -((W.scroll * 1.15) % 900);
  reedsStrip.style.transform = 'translateX(' + reedX + 'px)';

  if(W.mode === 'atGate'){
    for(var i=0;i<S.fish.length;i++){
      if(S.fish[i].alive) positionFish(S.fish[i], t);
    }
  }

  var sec = Math.floor(t / 1000);
  if(sec !== lastBadgeSec){ lastBadgeSec = sec; updateBadges(); }

  requestAnimationFrame(tick);
}

/* ================= wiring ================= */
function sfxGate(){ tone(520, .1, 0, 'sine', .15); tone(780, .12, .09, 'sine', .15); }

playBtn.addEventListener('click', function(){
  ensureAudio();
  overlay.classList.add('hidden');
  renderChicks();
  updateBadges();
  if(!S.started){
    S.started = true;
    S.birdY = vh() * 0.3;
    S.vy = 0;
    S.holding = false;
    showWhisper('Hold to fly up \u2014 reeds ahead hide maths\u2026');
    W.nextGateAt = W.scroll + 520;
  } else {
    W.nextGateAt = W.scroll + randInt(900, 1400);
  }
  W.mode = 'fly';
});

soundBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  muted = !muted;
  soundBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
  if(muted && window.speechSynthesis) speechSynthesis.cancel();
});

function holdOn(ev){
  if(ev.target && ev.target.closest &&
     ev.target.closest('.fish, #bubble, #soundBtn, #playBtn, .wbub, #overlay')) return;
  ensureAudio();
  S.holding = true;
}
function holdOff(){ S.holding = false; }
scene.addEventListener('pointerdown', holdOn);
window.addEventListener('pointerup', holdOff);
window.addEventListener('pointercancel', holdOff);
window.addEventListener('keydown', function(ev){
  if(ev.code === 'Space' || ev.code === 'ArrowUp'){ ev.preventDefault(); S.holding = true; }
});
window.addEventListener('keyup', function(ev){
  if(ev.code === 'Space' || ev.code === 'ArrowUp') S.holding = false;
});

window.addEventListener('resize', function(){
  if(S.birdY > birdMaxY()) S.birdY = birdMaxY();
});

fillStrips();
renderChicks();
S.birdY = 0.3 * (window.innerHeight || 600);
S.vy = 0;
S.holding = false;
birdEl.style.left = '24%';
birdEl.style.top = S.birdY + 'px';
requestAnimationFrame(tick);
</script>
