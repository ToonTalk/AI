<title>14 Brasenose Villas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D view fills the frame; annotation cards styled like a drawing title block float in the corners */
:root{
  --bg:#cfdbe3;
  --paper:#f5f7f8;
  --paper-2:#e9eef1;
  --ink:#1b2630;
  --ink-2:#55636f;
  --dim:#2a68a3;          /* the blue of the drawings' dimension strings */
  --redline:#cf3b2a;      /* revision-cloud red: "you are here" */
  --line:rgba(27,38,48,.16);
  --map-floor:#efe6d6;
  --map-wet:#dfe7ec;
  --map-wall:#26313b;
  --map-win:#5aa0d6;
  --map-text:#4b5763;
  --shadow:0 6px 22px rgba(18,28,38,.18);
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151a; --paper:#151c23; --paper-2:#1c252e; --ink:#e3e9ee; --ink-2:#9aa8b3;
    --dim:#7fb3e4; --redline:#ff6b57; --line:rgba(227,233,238,.15);
    --map-floor:#2a3038; --map-wet:#22303a; --map-wall:#d9e1e7; --map-win:#6fb2e6; --map-text:#a9b6c1;
    --shadow:0 6px 22px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151a; --paper:#151c23; --paper-2:#1c252e; --ink:#e3e9ee; --ink-2:#9aa8b3;
  --dim:#7fb3e4; --redline:#ff6b57; --line:rgba(227,233,238,.15);
  --map-floor:#2a3038; --map-wet:#22303a; --map-wall:#d9e1e7; --map-win:#6fb2e6; --map-text:#a9b6c1;
  --shadow:0 6px 22px rgba(0,0,0,.45); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
#view{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
.layer{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding-inline:16px;pointer-events:none}
.layer>*{pointer-events:auto}
.top{top:calc(14px + env(safe-area-inset-top,0px));align-items:flex-start;flex-wrap:wrap}
.bottom{bottom:calc(14px + env(safe-area-inset-bottom,0px));align-items:flex-end}
.card{background:color-mix(in srgb,var(--paper) 93%,transparent);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.title{padding:10px 14px 11px;min-width:0;max-width:340px}
.eyebrow,.label{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:2px 0 6px;font-family:var(--f-label);font-weight:600;font-size:22px;letter-spacing:.02em;line-height:1.05;text-wrap:balance}
.where{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:7px}
.where b{font-weight:600;font-size:16px}
.where .label{color:var(--ink-2)}
.modes{display:flex;flex-direction:column;gap:6px;padding:6px;align-items:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:600 13px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:transparent;border:0;padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#furn::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border:1.5px solid currentColor;border-radius:2px;vertical-align:1px}
#furn[aria-pressed="true"]::before{background:currentColor}
.seg button:focus-visible,select:focus-visible,.pad button:focus-visible{outline:2px solid var(--dim);outline-offset:1px}
.help{padding:10px 14px;font-size:14px;line-height:1.45;max-width:330px;color:var(--ink-2)}
.help b{color:var(--ink);font-weight:600}
kbd{font:600 12px/1 var(--f-label);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:2px 5px;color:var(--ink);background:var(--paper-2)}
.mapcard{padding:8px;display:flex;flex-direction:column;gap:6px;width:236px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:6px}
select{font:500 13px var(--f-body);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:150px}
#map{width:100%;height:250px;display:block;border-radius:3px;cursor:crosshair;background:var(--paper-2)}
.hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:max-content;max-width:min(360px,calc(100% - 32px));padding:12px 16px;font-size:15px;line-height:1.5;text-align:center;pointer-events:none;transition:opacity .4s}
.hint b{font-weight:600}
.pad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;padding:8px}
.pad button{font:600 20px/1 var(--f-body);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .up{grid-column:2}
.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
@media (pointer:coarse){ .pad{display:grid} .help{display:none} }
@media (max-width:640px){
  .title{max-width:none;padding:8px 12px}
  .eyebrow{display:none}
  h1{font-size:18px;margin-bottom:5px}
  .mapcard{width:150px}
  #map{height:160px}
  .maphead select{max-width:134px}
  .maphead .label{display:none}
  .seg button{padding:7px 9px;font-size:12px}
  .help{display:none}
}
@media (prefers-reduced-motion:reduce){ .hint{transition:none} }
</style>

<div id="app">
  <canvas id="view" tabindex="0" aria-label="3D view of the house. Use the arrow keys to walk and turn."></canvas>

  <div class="layer top">
    <header class="card title">
      <div class="eyebrow">Proposed scheme · drawings rev B, Sept 2026</div>
      <h1>14 Brasenose Villas</h1>
      <div class="where"><span class="label" id="lvl">Outside</span><b id="room">Front garden</b></div>
    </header>
    <div class="card modes">
      <div class="seg" role="group" aria-label="View">
        <button id="mWalk" aria-pressed="true">Walk</button>
        <button id="mOver" aria-pressed="false">Overview</button>
      </div>
      <div class="seg" id="cut" role="group" aria-label="Show" hidden>
        <button data-cut="all" aria-pressed="true">Whole</button>
        <button data-cut="ff" aria-pressed="false">1st floor</button>
        <button data-cut="gf" aria-pressed="false">Ground</button>
      </div>
      <div class="seg"><button id="furn" aria-pressed="true" title="Show or hide the loose furniture (F)">Furniture</button></div>
    </div>
  </div>

  <div class="card hint" id="hint">Click the view, then use <kbd>↑</kbd> <kbd>↓</kbd> to walk and <kbd>←</kbd> <kbd>→</kbd> to turn.<br><b>Walk up the path and in through the front door.</b></div>

  <div class="layer bottom">
    <div>
      <div class="card help" id="help"></div>
      <div class="card pad" id="pad" aria-label="Movement buttons">
        <button class="up" data-k="f" aria-label="Walk forward">↑</button>
        <button class="left" data-k="l" aria-label="Turn left">←</button>
        <button class="down" data-k="b" aria-label="Walk back">↓</button>
        <button class="right" data-k="r" aria-label="Turn right">→</button>
      </div>
    </div>
    <aside class="card mapcard">
      <div class="maphead">
        <span class="label" id="mapLbl">Ground floor</span>
        <select id="goto" aria-label="Go to a room"></select>
      </div>
      <canvas id="map" aria-label="Floor plan. Click to jump there."></canvas>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;

/* ---------------------------------------------------------------
   Dimensions (metres), read off drawings 101/102/200/201/300/301.
   Plan coordinates: x runs left→right looking at the front of the
   house (Plot 15 side → party wall with Plot 13), y runs from the
   front wall (0) toward the garden. h is height above ground-floor
   finished floor level (FFL).
---------------------------------------------------------------- */
const F  = 2.672;   // first floor FFL
const GC = 2.425;   // ground floor ceiling, existing house
const FC = 4.995;   // first floor ceiling (FFL + 2323)
const WT = 5.05;    // top of walls / eaves
const RIDGE = 7.2;  // main ridge
const KS = Math.tan(25 * Math.PI / 180);     // kitchen roof pitch, 25°
const KX = 4.146, KAPEX = 3.99;              // kitchen ridge line and apex
const hk = x => KAPEX - Math.abs(x - KX) * KS;

/* ---------- deterministic noise for textures ---------- */
let seed = 1234567;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const jit = (c, a) => c.map(v => Math.max(0, Math.min(255, Math.round(v + (rnd() - .5) * 2 * a))));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

/* ---------- renderer ---------- */
const canvas = document.getElementById('view');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = T.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new T.Scene();
const SKY = 0xbcd3e4;
scene.fog = new T.Fog(SKY, 70, 190);
const camera = new T.PerspectiveCamera(68, 1, 0.05, 400);
camera.rotation.order = 'YXZ';

function makeTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = ANISO;
  return t;
}
function speckle(g, s, n, alpha, dark) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = dark ? `rgba(0,0,0,${alpha * rnd()})` : `rgba(255,255,255,${alpha * rnd()})`;
    g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}
const TX = {
  brick: makeTex(512, (g, s) => {           // 215×65 brick, 10 mm joints; 0.9 m tile
    g.fillStyle = '#c9c1b4'; g.fillRect(0, 0, s, s);
    const ch = s / 12, bw = s / 4;
    for (let r = 0; r < 12; r++) for (let i = -1; i < 4; i++) {
      const x = i * bw + (r % 2) * bw / 2;
      const base = rnd() < .15 ? [122, 62, 48] : [160, 84, 60];
      g.fillStyle = rgb(jit(base, 16)); g.fillRect(x + 3, r * ch + 3, bw - 6, ch - 6);
    }
    speckle(g, s, 5000, .12, true); speckle(g, s, 2500, .08, false);
  }),
  slate: makeTex(512, (g, s) => {
    g.fillStyle = '#2d333a'; g.fillRect(0, 0, s, s);
    const rh = s / 5, w = s / 4;
    for (let r = 0; r < 5; r++) for (let i = -1; i < 5; i++) {
      const x = i * w + (r % 2) * w / 2;
      g.fillStyle = rgb(jit([78, 86, 96], 9)); g.fillRect(x + 2, r * rh + 2, w - 3, rh - 3);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + 2, r * rh + rh - 7, w - 3, 5);
    }
    speckle(g, s, 3000, .1, false);
  }),
  render: makeTex(256, (g, s) => { g.fillStyle = '#ece8df'; g.fillRect(0, 0, s, s); speckle(g, s, 4000, .05, true); speckle(g, s, 3000, .1, false); }),
  grass: makeTex(512, (g, s) => {
    g.fillStyle = '#5f8a41'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 14000; i++) { g.fillStyle = rgb(jit(rnd() < .5 ? [74, 112, 46] : [110, 150, 70], 14)); g.fillRect(rnd() * s, rnd() * s, 1, 3 + rnd() * 3); }
  }),
  paving: makeTex(512, (g, s) => {           // 600×600 slabs, 1.8 m tile
    g.fillStyle = '#8d877d'; g.fillRect(0, 0, s, s);
    const w = s / 3;
    for (let r = 0; r < 3; r++) for (let i = -1; i < 3; i++) { g.fillStyle = rgb(jit([196, 188, 172], 8)); g.fillRect(i * w + (r % 2) * w / 2 + 3, r * w + 3, w - 6, w - 6); }
    speckle(g, s, 6000, .1, true);
  }),
  gravel: makeTex(256, (g, s) => { g.fillStyle = '#b3aa98'; g.fillRect(0, 0, s, s); speckle(g, s, 7000, .3, true); speckle(g, s, 7000, .35, false); }),
  porch: makeTex(256, (g, s) => {           // Victorian black-and-white path tiles
    const n = 8, w = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = (i + j) % 2 ? '#2a2a2c' : '#e6dfd2'; g.fillRect(i * w, j * w, w, w); }
    speckle(g, s, 2000, .1, true);
  }),
  road: makeTex(256, (g, s) => { g.fillStyle = '#4b4e53'; g.fillRect(0, 0, s, s); speckle(g, s, 9000, .25, true); speckle(g, s, 5000, .12, false); }),
  porcelain: makeTex(1024, (g, s) => {      // 1200×600 porcelain, concrete look; 2.4 m tile
    g.fillStyle = '#b3ada3'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) { g.fillStyle = rgb(jit([206, 200, 189], 3)); g.fillRect(i * 512 + 1.5, j * 256 + 1.5, 509, 253); }
    g.save(); g.beginPath(); for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) g.rect(i * 512 + 1.5, j * 256 + 1.5, 509, 253); g.clip();
    for (let i = 0; i < 520; i++) {
      const x = rnd() * s, y = rnd() * s, r = 14 + rnd() * 90, dk = rnd() < .55;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, dk ? `rgba(120,108,92,${.035 + rnd() * .04})` : `rgba(255,252,246,${.04 + rnd() * .05})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    speckle(g, s, 26000, .07, true); speckle(g, s, 16000, .1, false);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(70,62,52,${.2 + rnd() * .25})`; g.beginPath(); g.arc(rnd() * s, rnd() * s, .6 + rnd() * 1.3, 0, 7); g.fill(); }
    g.restore();
  }),
  bamboo: makeTex(1024, (g, s) => {         // 125 mm planks of three laminated strips; 2 m tile
    g.fillStyle = '#6e5534'; g.fillRect(0, 0, s, s);
    const pw = s / 16;
    for (let p = 0; p < 16; p++) {
      let y = -rnd() * 900;
      while (y < s) {
        const len = 490 + rnd() * 460;
        for (let k = 0; k < 3; k++) {
          const x = p * pw + 1 + k * (pw - 2) / 3, w = (pw - 2) / 3;
          g.fillStyle = rgb(jit([208, 172, 114], 9)); g.fillRect(x, y + 1, w, len - 2);
          for (let q = 0; q < 5; q++) { g.fillStyle = `rgba(120,84,40,${.06 + rnd() * .08})`; g.fillRect(x + rnd() * w, y, 1, len); }
          for (let ny = y + 40 + rnd() * 120; ny < y + len - 10; ny += 150 + rnd() * 90) {
            g.fillStyle = 'rgba(110,72,30,.38)'; g.fillRect(x, ny, w, 3);
            g.fillStyle = 'rgba(255,236,190,.25)'; g.fillRect(x, ny + 3, w, 2);
            g.fillStyle = 'rgba(110,72,30,.25)'; g.fillRect(x + w * .3, ny - 2, w * .4, 7);
          }
        }
        g.fillStyle = 'rgba(70,46,20,.55)'; g.fillRect(p * pw, y, pw, 2);
        y += len;
      }
      g.fillStyle = 'rgba(70,46,20,.5)'; g.fillRect(p * pw, 0, 1.5, s);
    }
  }),
  tileLight: makeTex(512, (g, s) => {       // 600×300 light ceramic; 1.2 m tile
    g.fillStyle = '#cfccc5'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) {
      const x = i * 256 + 1.5, y = j * 128 + 1.5;
      g.fillStyle = rgb(jit([242, 240, 235], 2)); g.fillRect(x, y, 253, 125);
      const gr = g.createLinearGradient(x, y, x + 253, y + 125); gr.addColorStop(0, 'rgba(255,255,255,.35)'); gr.addColorStop(.6, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.03)');
      g.fillStyle = gr; g.fillRect(x, y, 253, 125);
    }
    speckle(g, s, 1500, .04, true);
  }),
  veneer: makeTex(512, (g, s) => {          // crown-cut oak veneer, grain running vertically; 0.8 m tile
    g.fillStyle = '#b98d5c'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '150,104,58' : '214,176,128'},${.12 + rnd() * .18})`; g.fillRect(rnd() * s, 0, 4 + rnd() * 26, s); }
    for (let i = 0; i < 420; i++) {
      const x0 = rnd() * s, a = 2 + rnd() * 6, f = 1 + Math.floor(rnd() * 3);
      g.strokeStyle = `rgba(96,62,30,${.05 + rnd() * .12})`; g.lineWidth = .6 + rnd() * 1.2; g.beginPath();
      for (let y = 0; y <= s; y += 16) { const x = x0 + Math.sin(y / s * Math.PI * 2 * f) * a; y ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(232,200,150,${.15 + rnd() * .2})`; g.fillRect(rnd() * s, rnd() * s, 3 + rnd() * 9, 1.5); }
  }),
  boards: makeTex(256, (g, s) => {
    const n = 8, w = s / n;
    for (let i = 0; i < n; i++) { g.fillStyle = rgb(jit([128, 98, 70], 10)); g.fillRect(i * w, 0, w - 2, s); g.fillStyle = 'rgba(40,25,15,.5)'; g.fillRect(i * w + w - 2, 0, 2, s); }
    speckle(g, s, 2000, .1, true);
  }),
};

/* ---------- materials ---------- */
const lam = (color, map, extra = {}) => new T.MeshPhongMaterial(Object.assign({ color, map: map || null, shininess: 6, specular: 0x0c0c0c }, extra));
const MAT = {
  brick: lam(0xffffff, TX.brick), render: lam(0xffffff, TX.render), plaster: lam(0xf3efe8), plasterC: lam(0xfaf8f4),
  slate: lam(0xffffff, TX.slate), soffit: lam(0xefefeb), white: lam(0xf6f6f2), grass: lam(0xffffff, TX.grass),
  paving: lam(0xffffff, TX.paving), gravel: lam(0xffffff, TX.gravel), porch: lam(0xffffff, TX.porch),
  road: lam(0xffffff, TX.road), pavement: lam(0xa8a59f), kerb: lam(0x9c9993), boards: lam(0xffffff, TX.boards),
  deck: lam(0xc4b39c, TX.boards), stoneSill: lam(0xd9d3c5), gutter: lam(0x2f3337), frontDoor: lam(0x24463a),
  doorW: lam(0xf1efea), cabinet: lam(0xffffff, TX.veneer), doorOak: lam(0xf4e6d4, TX.veneer),
  porcelain: lam(0xffffff, TX.porcelain, { shininess: 22, specular: 0x1c1c1c }), bamboo: lam(0xffffff, TX.bamboo, { shininess: 14, specular: 0x161410 }),
  tileLight: lam(0xffffff, TX.tileLight, { shininess: 45, specular: 0x333333 }), counter: lam(0xe9e6df), plinth: lam(0x2c3237), steel: lam(0xaab1b6),
  black: lam(0x26282a), fabric: lam(0x7b8a73), cushion: lam(0x8c9a83), fabric2: lam(0xb59a7a), linen: lam(0xeee9df),
  linen2: lam(0xfaf7f1), throw: lam(0x5f7590), wood: lam(0x8c6a4b), darkwood: lam(0x5a4331), ceramic: lam(0xfbfbfa),
  water: lam(0xd7e8ef), rug: lam(0xa86f55), rug2: lam(0x6d7f8f), terracotta: lam(0xae6a47), leaf: lam(0x4e7a38, null, { flatShading: true }),
  leaf2: lam(0x3e6a30, null, { flatShading: true }), trunk: lam(0x5b4636), fire: lam(0x161514), ashp: lam(0xdfe2e3),
  book1: lam(0x8e3b34), book2: lam(0x2f5168), book3: lam(0xc9a24a), book4: lam(0x47684a), tv: lam(0x18191b),
  glass: new T.MeshPhongMaterial({ color: 0xa9cde0, transparent: true, opacity: .26, depthWrite: false, side: T.DoubleSide, shininess: 90, specular: 0x9ab }),
  darkGlass: new T.MeshPhongMaterial({ color: 0x334452, shininess: 80, specular: 0x667788 }),
  sky: new T.MeshBasicMaterial({ color: 0xd8ecf8 }),
  bulb: new T.MeshBasicMaterial({ color: 0xfff1d0 }),
