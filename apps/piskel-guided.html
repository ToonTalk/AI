html,
body {
  --highlight-color: gold;
}

html,
body {
  height: 100%;
  width: 100%;
  margin: 0;
  overflow: hidden;
  cursor: default;
  font-family: Arial;
  font-size: 11px;
  line-height: 1.1;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

ul,
li {
  margin: 0;
  padding: 0;
  list-style-type: none;
}

/** Firefox overrides this with -moz-use-system-font */
button,
input,
input[type="submit"] {
  font-family: Arial;
}

/* IE11 applies a big default margin for range inputs */
input[type="range"] {
  padding: 0;
}

/* Force apparition of scrollbars on leopard */
::-webkit-scrollbar {
  -webkit-appearance: none;
  width: 6px;
}

::-webkit-scrollbar-thumb {
  border-radius: 2px;
  background-color: #666;
}

::-webkit-scrollbar-track {
  background-color: rgba(50, 50, 50, 0.4);
}

a,
a:visited {
  color: gold;
}

body {
  background: #1d1d1d;
}

/* Browser fixes */
::-ms-clear {
  display: none;
}

.allow-user-select {
  -webkit-touch-callout: initial;
  -webkit-user-select: initial;
  -khtml-user-select: initial;
  -moz-user-select: initial;
  -ms-user-select: initial;
  user-select: initial;
}

.no-overflow {
  overflow: hidden;
}

.highlight {
  color: gold;
}

.pull-top,
.pull-right,
.pull-bottom,
.pull-left {
  position: absolute;
}

.pull-top {
  top: 0;
}

.pull-right {
  right: 0;
}

.pull-bottom {
  bottom: 0;
}

.pull-left {
  left: 0;
}

.uppercase {
  text-transform: uppercase;
}

.checkbox-fix {
  margin: 3px 3px 3px 0;
}

.checkbox-container {
  display: flex;
  align-items: center;
}

.hidden {
  display: none;
}

/**
 * TOOLTIPS
 */
.tooltip-shortcut {
  color: gold;
}

.tooltip-container {
  text-align: left;
}

.tooltip-descriptor {
  color: #999;
}

.tooltip-descriptor:last-child {
  padding-bottom: 5px;
}

.tooltip-descriptor-button {
  padding: 2px;
  border: 1px Solid #999;
  font-size: 0.8em;
  margin-right: 5px;
  width: 35px;
  text-align: center;
  border-radius: 3px;
  display: inline-block;
  line-height: 10px;
}

@keyframes fade {
  50% {
    opacity: 0.5;
  }
}

@keyframes glow {
  0% {
    opacity: 0.66;
  }
  50% {
    opacity: 1;
  }
  100% {
    opacity: 0.66;
  }
}

/**
 * Application layout
 */

.main-wrapper {
  position: fixed;
  top: 5px;
  right: 0;
  bottom: 5px;
  left: 0;
}

.column-wrapper {
  text-align: center;
  font-size: 0;
  display: flex;

  position: absolute;
  left: 100px; /* Reserve room for tools on the left edge of the screen. */
  top: 0;
  right: 50px; /* Reserve room for actions on the right edge of the screen. */
  bottom: 0;
}

.left-column {
  vertical-align: top;
  height: 100%;
  padding-right: 7px;
  flex-shrink: 0;
}

.main-column {
  height: 100%;
  position: relative;
}

.right-column {
  box-sizing: border-box;
  vertical-align: top;
  height: 100%;
  flex-shrink: 0;

  display: flex;
  flex-direction: column;
  position: relative;

  /* Keep in sync with Constants.RIGHT_COLUMN_PADDING_LEFT */
  padding-left: 10px;
  /* Add some padding for the absolutely positioned .cursor-coordinates */
  padding-bottom: 20px;
}

.drawing-canvas-container {
  font-size: 0;
}

.sticky-section {
  position: fixed;
  top: 0;
  bottom: 0;
  z-index: 1000;
}

.sticky-section .sticky-section-wrap {
  display: table;
  height: 100%;
}

.sticky-section .vertical-centerer {
  display: table-cell;
  vertical-align: middle;
}

.left-sticky-section.sticky-section {
  left: 0;
  max-width: 100px;
}

.left-sticky-section .tool-icon {
  float: left;
}

.cursor-coordinates {
  color: gold;
  font-size: 12px;
  font-weight: bold;
  font-family: monospace;
}

.cursor-coordinates .drawing-zoom {
  position: absolute;
  top: -20px;
  left: 1px;
}

.cursor-coordinates .frame-info {
  line-height: 1.5;
  text-align: left;
}

/**
 * Canvases layout
 */

.canvas {
  position: relative;
  z-index: 1;
}

.canvas-container {
  position: relative;
  display: block;
}

.canvas-container .canvas-background {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
}

.light-picker-background,
.light-canvas-background .canvas-background {
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAABlBMVEXf39////8zI3BgAAAAHklEQVR4AWNghAIGCMDgjwgFCDDSw2M0PSCD0fQAACRcAgF4ciGUAAAAAElFTkSuQmCC")
    repeat;
}

.medium-picker-background,
.medium-canvas-background .canvas-background {
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAABlBMVEW6urr///82MBGFAAAAHUlEQVR4AWOAAUYoQOePEAUj3v9oYDQ9gMBoegAAJFwCAbLaTIMAAAAASUVORK5CYII=")
    repeat;
}

.lowcont-medium-picker-background,
.lowcont-medium-canvas-background .canvas-background {
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAABlBMVEXV1dXb29tFGkCIAAAAHklEQVR4AWNghAIGCMDgjwgFCDDSw2M0PSCD0fQAACRcAgF4ciGUAAAAAElFTkSuQmCC")
    repeat;
}

.lowcont-dark-picker-background,
.lowcont-dark-canvas-background .canvas-background {
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAABlBMVEVMTExVVVUnhsEkAAAAHUlEQVR4AWOAAUYoQOePEAUj3v9oYDQ9gMBoegAAJFwCAbLaTIMAAAAASUVORK5CYII=")
    repeat;
}

.canvas.onion-skin-canvas {
  opacity: 0.2;
}

.canvas.canvas-overlay,
.canvas.layers-canvas,
.canvas.onion-skin-canvas {
  position: absolute;
  top: 0;
  left: 0;
}

.tools-wrapper,
.options-wrapper,
.palette-wrapper {
  float: left;
}

/**
 * Z-indexes should match the drawing area canvas superposition order :
 * - 1 : draw layers below current layer
 * - 2 : draw current layer
 * - 3 : draw layers above current layer
 * - 4 : draw the tools overlay
 */
.canvas.layers-below-canvas {
  z-index: 7;
}
.canvas.drawing-canvas {
  z-index: 8;
}
.canvas.canvas-overlay {
  z-index: 9;
}
.canvas.onion-skin-canvas {
  z-index: 10;
}
.canvas.layers-above-canvas {
  z-index: 11;
}

.row {
  display: block;
}

.textfield {
  box-sizing: border-box;

  background: black;
  border: 1px solid #888;
  border-radius: 2px;
  padding: 3px 10px;
  color: white;

  height: 23px;
}

.textfield[readonly="true"] {
  background: transparent;
}

.textfield[disabled="disabled"] {
  background: #3a3a3a;
}

.textfield:focus {
  border-color: gold;
  outline: none;
}

.textfield-small {
  width: 50px;
}

.button {
  box-sizing: border-box;
  height: 24px;
  background-color: #666;
  border-style: none;
  border-radius: 2px;
  cursor: pointer;
  text-decoration: none;

  color: white;
  font-weight: bold;
  font-size: 1rem;
  text-align: center;

  transition: background-color 0.2s linear;
}

.button:hover {
  color: gold;
}

.button-primary {
  background-color: gold;
  color: black;
}

.button-primary:hover {
  background-color: white;
  color: black;
}

.button[disabled],
.button[disabled]:hover {
  cursor: default;
  background-color: #aaa;
  color: #777;
}

.import-size-field,
.resize-size-field,
.export-size-field {
  width: 50px;
  margin-right: 8px;
  text-align: right;
}

/** Righty sticky drawer expanded state. */

.right-sticky-section.sticky-section {
  right: 0;
  width: 47px;

  -webkit-transition: all 200ms ease-out;
  -moz-transition: all 200ms ease-out;
  -ms-transition: all 200ms ease-out;
  -o-transition: all 200ms ease-out;
  transition: all 200ms ease-out;
}

.right-sticky-section.expanded {
  right: 280px;
}

.right-sticky-section .tool-icon {
  float: right;
  margin-right: 0;
}

.tool-icon .label {
  position: absolute;
  left: 0;
  bottom: 4px;
  right: 0;
  font-size: 11px;
  text-transform: uppercase;
  color: #fff;
  text-align: center;
}

.drawer-content {
  overflow: hidden;
  background-color: #444;
  height: 550px;
  max-height: 100%;
  width: 280px;
  border-top-left-radius: 4px;
  border-bottom-left-radius: 4px;
  box-shadow: 0 0 5px 0 black;
}

.right-sticky-section.expanded .tool-icon {
  padding-right: 1px;
}

.right-sticky-section .tool-icon.has-expanded-drawer {
  position: relative;
  background-color: #444;
  margin-right: 0;
  padding-right: 2px;
  border-left: 3px solid gold;
}

/************************************************************************************************/
/* Common settings classes                                                                      */
/************************************************************************************************/

.settings-section {
  margin: 10px 20px;
  font-size: 12px;
  font-weight: bold;
  color: #ccc;
}

.settings-section .button {
  margin: 0;
}

.settings-title {
  margin-top: 20px;
  margin-bottom: 10px;
  text-transform: uppercase;
  border-bottom: 1px #aaa solid;
  padding-bottom: 5px;
  color: gold;
}

.settings-description {
  margin: 0 0 10px 0;
}

.settings-form-section {
  margin-bottom: 10px;
}

.settings-item {
  margin: 10px 0;
}

[name*="checkbox"] {
  vertical-align: middle;
}

/********************************/
/*  Preferences Settings panel  */
/********************************/

.settings-section-preferences {
  height: 100%;
  position: relative;
  overflow: hidden;
  margin: 0 20px;
  height: 100%;
}

.background-picker-wrapper {
  display: inline-block;
  width: 130px;
  overflow: hidden;
  vertical-align: middle;
  margin-left: 5px;
}

.background-picker {
  cursor: pointer;
  float: left;
  height: 14px;
  width: 14px;
  background-color: transparent;
  margin-right: 5px;
  padding: 1px;
  position: relative;
  border: #888 2px solid;
}

.background-picker:hover {
  border-color: #eee;
}

.background-picker.selected {
  border-color: gold;
}

.settings-opacity-input {
  margin: 5px;
  vertical-align: middle;
}

.layer-opacity-input,
.tile-mask-opacity-input {
  width: 100px;
}

.settings-opacity-text {
  height: 31px;
  display: inline-block;
  line-height: 30px;
  width: 40px;
  border: 1px solid grey;
  box-sizing: border-box;
  border-radius: 3px;
  text-align: center;
}

.settings-item-grid-size,
.settings-item-grid-spacing,
.settings-item-grid-color {
  display: flex;
  align-items: center;
}

.settings-item-grid-size > label,
.settings-item-grid-spacing > label,
.settings-item-grid-color > label {
  width: 65px;
  flex-shrink: 0;
}

.grid-spacing-container .size-picker-option[data-size="1"] {
  padding: 7px;
}
.grid-spacing-container .size-picker-option[data-size="2"] {
  padding: 6px;
}
.grid-spacing-container .size-picker-option[data-size="4"] {
  padding: 5px;
}
.grid-spacing-container .size-picker-option[data-size="8"] {
  padding: 4px;
}
.grid-spacing-container .size-picker-option[data-size="16"] {
  padding: 3px;
}
.grid-spacing-container .size-picker-option[data-size="32"] {
  padding: 2px;
}
.grid-spacing-container .size-picker-option[data-size="64"] {
  padding: 1px;
}

.settings-item-grid-size .size-picker-option,
.settings-item-grid-spacing .size-picker-option {
  border-color: #888;
}

.settings-item-grid-size .size-picker-option:not(.selected):hover,
.settings-item-grid-spacing .size-picker-option:not(.selected):hover {
  border-color: white;
}

.grid-width-select,
.color-format-select {
  margin: 5px 5px 0 5px;
}

.grid-colors-list {
  overflow: hidden;
  padding: 0 5px;
}

.grid-colors-item {
  float: left;
  width: 20px;
  height: 20px;
  cursor: pointer;
  border: 2px solid #888;
  margin-right: 2px;
  margin-bottom: 2px;
  box-sizing: border-box;
}

.grid-colors-item:hover {
  border-color: white;
}

.grid-colors-item.selected {
  border-color: gold;
}

.settings-section-preferences > .settings-title {
  /* Override the default 10px margin bottom for this panel */
  margin-bottom: 15px;
}

.settings-section-preferences .button-primary {
  margin-top: 10px;
}

/*******************************/
/* Gif/Png Export Setting panel*/
/*******************************/
.gif-download-button,
.gif-render-button {
  margin-top: 10px;
  margin-right: 10px;
}

.gif-export-preview,
.png-export-preview {
  position: relative;
  margin-top: 10px;
  max-height: 32px;
}

.gif-export-preview {
  max-width: 32px;
}

.png-export-preview img {
  max-height: 32px;
  float: left;
}

.png-export-preview .light-picker-background {
  max-width: 240px;
}

.gif-upload-status {
  width: 180px;
  margin-left: 5px;
  margin-top: 10px;
}

.gif-upload,
.png-export-preview {
  overflow: hidden;
}

.gif-upload-status,
.gif-export-preview {
  float: left;
}

.gif-export-warning {
  display: none;
}

.gif-export-warning.visible {
  display: flex;
  align-items: center;
  border: 1px solid red;
  padding: 5px;
  margin: 5px 0;
}

.gif-export-warning-icon {
  flex-shrink: 0;
  margin-right: 5px;
}

.gif-export-warning-message {
  font-weight: normal;
}

.export-scale {
  margin-bottom: 10px;
}

.export-scale .scale-input {
  margin: 5px;
  vertical-align: middle;
  width: 150px;
}

.export-scale .scale-text {
  height: 31px;
  display: inline-block;
  line-height: 30px;
  width: 40px;
  border: 1px solid grey;
  box-sizing: border-box;
  border-radius: 3px;
  text-align: center;
}

.export-resize {
  margin: 10px 0;
  overflow: hidden;
}

.export-resize > * {
  float: left;
}

.export-resize > *:not(:last-child) {
  margin-right: 10px;
}

.export-resize > .resize-field {
  width: 70px;
}

.export-resize > .resize-label {
  height: 23px;
  line-height: 23px;
}

.export-panel-header {
  padding: 10px 5px 0px;
}

.export-info {
  font-style: italic;
  text-shadow: none;
  font-weight: normal;
}

.export-panel-section {
  padding: 5px;
  margin-top: 10px;
  border: 1px solid #5d5d5d;
  border-radius: 2px;
}

.export-panel-row {
  display: flex;
  align-items: center;
  overflow: hidden;
}

.export-panel-gif .button,
.export-panel-png .button {
  margin-right: 5px;
  width: 75px;
  flex-shrink: 0;
}

.export-panel-png .textfield {
  width: 50px;
}

#png-export-columns,
#png-export-rows {
  /* Override default textfield padding-right to keep the number spinners
     aligned to the right. */
  padding-right: 0;
}

/************************************************************************************************/
/* Import panel                                                                                 */
/************************************************************************************************/

.import-section,
.resize-section {
  margin: 10px 0;
}

.file-input-button {
  margin-right: 8px;
  border-radius: 2px;
}

.import-highlight {
  font-weight: bold;
  color: white;
}

.resize-section-title {
  vertical-align: top;
  display: inline-block;
  padding-top: 5px;
  width: 25%;
}

.resize-anchor-container {
  position: relative;
  margin-top: 5px;
  display: inline-block;
}

.save-field {
  width: 100%;
}

.save-status {
  margin-top: 10px;
  margin-bottom: -10px;
  vertical-align: middle;
  font-weight: normal;
  text-shadow: none;
  font-style: italic;
}

.save-file-name {
  white-space: nowrap;
  font-weight: bold;
  color: white;
  font-style: normal;
}

.save-desktop-file-name {
  word-wrap: break-word;
  font-weight: bold;
  color: white;
  font-style: normal;
}

.save-status-warning-icon {
  float: left;
  margin-top: 5px;
}

.save-status-warning-icon {
  overflow: hidden;
  padding-left: 10px;
}

.tool-icon {
  position: relative;
  cursor: pointer;
  width: 46px;
  height: 46px;
  margin: 1px;
  background-color: #3a3a3a;
}

.tool-icon.selected {
  cursor: default;
  background-color: #444;
}

.tool-icon.selected:before {
  content: "";
  position: absolute;
  height: 100%;
  width: 100%;
  border: 3px solid gold;
  box-sizing: border-box;
}

.tool-icon:hover {
  background-color: #444;
}

.color-picker-slider * {
  box-sizing: border-box;
}

.color-picker-slider input[type="range"] {
  -webkit-appearance: none;
  -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
  width: 100%;
  border: none;
  padding: 1px 2px;
  border-radius: 3px;
  background-image: linear-gradient(
    to right,
    hsl(0, 30%, 70%) 0,
    hsl(359, 30%, 70%) 100%
  );
  box-shadow:
    inset 0 1px 0 0 #0d0e0f,
    inset 0 -1px 0 0 #3a3d42;
  outline: none; /* no focus outline */
}

/* thumb */

.color-picker-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  cursor: pointer;
  width: 7px;
  height: 18px;
  border: none;
  border-radius: 2px;
  background-image: -webkit-gradient(
    linear,
    left top,
    left bottom,
    color-stop(0%, #529de1),
    color-stop(100%, #245e8f)
  ); /* android <= 2.2 */
  background-image: -webkit-linear-gradient(
    top,
    #529de1 0,
    #245e8f 100%
  ); /* older mobile safari and android > 2.2 */
  background-image: linear-gradient(
    to bottom,
    #529de1 0,
    #245e8f 100%
  ); /* W3C */
}
.color-picker-slider input[type="range"]::-moz-range-thumb {
  width: 7px;
  height: 18px;
  border: none;
  border-radius: 2px;
  background-image: linear-gradient(
    to bottom,
    #529de1 0,
    #245e8f 100%
  ); /* W3C */
}

.color-picker-slider input[type="range"]::-ms-thumb {
  width: 7px;
  height: 18px;
  border-radius: 2px;
  border: 0;
  background-image: linear-gradient(
    to bottom,
    #529de1 0,
    #245e8f 100%
  ); /* W3C */
}

/*CROSS BROWSER RESET*/

.color-picker-slider input[type="range"]::-moz-range-track {
  border: inherit;
  background: transparent;
}

.color-picker-slider input[type="range"]::-ms-track {
  border: inherit;
  color: transparent; /* don't drawn vertical reference line */
  background: transparent;
}

.color-picker-slider input[type="range"]::-ms-fill-lower,
.color-picker-slider input[type="range"]::-ms-fill-upper {
  background: transparent;
}

.color-picker-slider input[type="range"]::-ms-tooltip {
  display: none;
}

.color-picker-slider,
.color-picker-input {
  padding: 0 10px;
  height: 25px;
  overflow: hidden;
}

.color-picker-slider span {
  line-height: 25px;
  width: 10px;
  float: left;
}

.color-picker-slider input[type="range"] {
  float: left;
  height: 10px;
  width: 100px;
  margin: 7px 1px 7px 8px;
}

.color-picker-slider input[type="text"] {
  float: left;
  width: 47px;
  margin-left: 5px;
}

.color-picker-input {
  margin-bottom: 10px;
}

.color-picker-input .textfield {
  width: 100%;
}

.color-picker-slider input[type="range"][data-dimension="h"] {
  background-image: linear-gradient(
    to right,
    #ff0000 0%,
    #ffff00 17%,
    #00ff00 33%,
    #00ffff 50%,
    #0000ff 67%,
    #ff00ff 83%,
    #ff0000 100%
  );
}

#dialog-container-wrapper {
  position: absolute;
  z-index: 20000;

  top: 0;
  right: 0;
  bottom: 0;
  left: 0;

  padding: 50px 150px;
  overflow: hidden;

  box-sizing: border-box;
  -moz-box-sizing: border-box;

  background-color: rgba(0, 0, 0, 0.8);
  opacity: 0;
  pointer-events: none;

  color: white;
}

#dialog-container-wrapper.animated {
  transition: opacity 0.2s;
}

#dialog-container-wrapper.show {
  opacity: 1;
  pointer-events: auto;
}

#dialog-container {
  width: 100%;
  height: 100%;

  margin-top: -1500px;

  box-sizing: border-box;
  -moz-box-sizing: border-box;

  border-radius: 3px;
  border: 3px solid gold;
  background: #444;
  overflow: auto;
}

.show #dialog-container {
  margin-top: 0;
}

.dialog-wrapper {
  height: 100%;
  position: relative;
}

.dialog-content {
  position: absolute;
  top: 45px;
  bottom: 0;
  width: 100%;
  box-sizing: border-box;
}

.dialog-head {
  width: 100%;
  background: gold;
  margin: 0;
  padding: 10px;
  color: black;
  font-size: 1.8em;
  height: 45px;
  box-sizing: border-box;
  -moz-box-sizing: border-box;
}

.dialog-close {
  position: absolute;
  top: 0;
  right: 0;
  line-height: 45px;
  margin-right: 10px;
  font-size: 1.3em;
  cursor: pointer;
}

  height: 500px;

  left: 50%;

.backups-step-container {

  height: 100%;

}

.backups-step-content {

}

.backups-step-actions {

.browse-backups .browse-backups-disclaimer {

.browse-backups .browse-backups-disclaimer-content {
  padding: 0 20px;

}

.browse-backups .browse-backups-disclaimer .backups-icon {
  border: 1px solid gold;
  flex-shrink: 0;
  width: 90px;

}

.browse-backups .centered-message {
  position: absolute;
  left: 50%;

.browse-backups .session-list-empty,
.browse-backups .snapshot-list-empty {

.browse-backups .session-list-error,

.browse-backups .session-item {

.browse-backups .session-item:last-child,
.browse-backups .snapshot-item:last-child {
  margin-bottom: 0;
}

/************************************************************************************************/
/* Browse local piskels panel                                                                   */
/************************************************************************************************/

#dialog-container.browse-local {
  width: 700px;
  height: 500px;
  top: 50%;
  left: 50%;
  position: absolute;
  margin-left: -350px;
}

.show #dialog-container.browse-local {
  margin-top: -250px;
}

.local-piskel-list {
  width: 100%;
}

.local-piskel-item {
  height: 3em;
}

.local-piskel-name {
  width: 40%;
}

.local-piskel-save-date {
  font-weight: normal;
}

.local-piskel-list a {
  text-decoration: none;
}

.local-piskel-list a:hover {
  text-decoration: underline;
}

.local-piskel-list-head {
  font-weight: bold;
  color: gold;
}

.local-piskel-load-button,
.local-piskel-delete-button {
  width: 75px;
}

.cheatsheet-link {
  position: fixed;
  bottom: 10px;
  left: 10px;

  color: gold;
  font-weight: bold;
  font-size: 1.25em;
  line-height: 20px;

  cursor: pointer;

  opacity: 0.5;
  z-index: 11000;
  transition: opacity 0.3s;
}

.cheatsheet-link:hover {
  opacity: 1;
}

.cheatsheet-container {
  box-sizing: border-box;
  display: block;

  bottom: 46px;
  padding: 20px 3%;
  border-radius: 3px;
  background-color: rgba(0, 0, 0, 0.9);
  overflow: auto;
}

.cheatsheet-container .cheatsheet-title {
  font-size: 24px;
  margin-top: 30px;
}

.cheatsheet-container .cheatsheet-title:nth-of-type(1) {
  margin-top: 0;
}

.cheatsheet-section {
  box-sizing: border-box;
  float: left;

  vertical-align: top;
  padding: 0 20px 20px 20px;
  min-width: 300px;
}

.cheatsheet-boxes {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;

  float: left;
}

@media (min-width: 1300px) {
  .cheatsheet-container > div {
    width: 33%;
  }
  .cheatsheet-boxes {
    flex-direction: column;
  }
}

.cheatsheet-shortcut {
  overflow: hidden;
  margin: 10px 0;
}

.cheatsheet-icon.tool-icon {
  float: left;

  height: 30px;
  width: 30px;
  margin: 0 10px 0 0;
  background-size: 30px 30px;
}

.cheatsheet-description {
  color: white;
  font-size: 14px;
  margin-left: 10px;
  line-height: 30px;
}

.cheatsheet-key {
  box-sizing: border-box;
  display: inline-block;
  height: 30px;
  line-height: 26px;
  padding: 0 10px;

  border: 2px solid white;
  border-radius: 2px;

  text-align: center;
  font-family: monospace;
  font-weight: bold;
  font-size: 18px;
  color: white;
}

.cheatsheet-shorcut-conflict .cheatsheet-key {
  border-color: red;
  color: red;
}

.cheatsheet-shortcut-editable {
  cursor: pointer;
}

.cheatsheet-shortcut-editable .cheatsheet-key {
  border-color: gold;
  color: gold;
}

.cheatsheet-shortcut-editing .cheatsheet-key {
  animation: fade 0.5s infinite;
}

.cheatsheet-shortcut-undefined .cheatsheet-key {
  border-color: red;
  color: red;
}

/*Cheatsheet actions*/

.cheatsheet-actions {
  position: absolute;
  box-sizing: border-box;

  bottom: 0;
  left: 0;
  right: 0;
  height: 46px;

  padding: 10px;
  overflow: hidden;

  background-color: gold;
}

.cheatsheet-helptext {
  font-size: 14px;
  height: 26px;
  line-height: 26px;
  color: black;
}

.cheatsheet-helptext-tooltip {
  text-align: left;
}

.cheatsheet-helptext-tooltip-item {
  line-height: 0.9em;
  margin: 10px 0;
}

.cheatsheet-button {
  position: absolute;
  bottom: 10px;
  right: 10px;
}

#dialog-container.create-palette {
  width: 500px;
  height: 600px;
  top: 50%;
  left: 50%;
  position: absolute;
  margin-left: -250px;
}

.show #dialog-container.create-palette {
  margin-top: -300px;
}

.create-palette-section {
  position: absolute;
  left: 10px;
  top: 50px;
}

.create-palette-import-section {
  display: inline-block;
}

.colors-container {
  position: absolute;

  left: 10px;
  right: 10px;
  top: 85px;

  height: 460px;

  border: 1px solid black;
  background: #333;
}

.color-picker-container {
  position: absolute;
  left: 280px;
  top: 0;
  bottom: 0;
  right: 0;
  background: #222;
}

.create-palette-actions {
  position: absolute;
  box-sizing: border-box;

  width: 100%;
  height: 45px;

  left: 0;
  right: 0;
  bottom: 0;

  padding: 10px;
  text-align: right;
}

.color-preview {
  width: 170px;
  height: 70px;
  margin: 11px;
}

.colors-list {
  overflow: auto;
  width: 280px;
  box-sizing: border-box;
  height: 100%;
  padding-bottom: 10px;
}

.create-palette-color,
.create-palette-new-color,
.colors-list-drop-proxy {
  position: relative;
  float: left;

  width: 44px;
  height: 44px;
  margin: 10px 0 0 10px;

  box-sizing: border-box;

  cursor: pointer;
}

@-moz-document url-prefix() {
  .create-palette-color,
  .create-palette-new-color,
  .colors-list-drop-proxy {
    margin: 7px 0 0 7px;
  }
}

@media screen and (-ms-high-contrast: active), (-ms-high-contrast: none) {
  .create-palette-color,
  .create-palette-new-color,
  .colors-list-drop-proxy {
    margin: 7px 0 0 7px;
  }
}

.create-palette-color {
  border: 1px solid #2c2c2c;
  transition: border-color 0.2s;
}
.create-palette-color:hover {
  border: 1px solid gold;
}

.colors-list-drop-proxy {
  border: 2px dotted #eee;
}

.create-palette-new-color {
  border: 2px dotted gold;

  border-radius: 2px;
  line-height: 40px;
  text-align: center;
  font-size: 20px;
  color: gold;
}

.create-palette-color.selected {
  border: 2px solid gold;
}

.create-palette-remove-color {
  position: absolute;
  top: 0;
  right: 0;
  padding: 2px 4px 0 0;
  opacity: 0.2;

  font-weight: bold;
  color: rgb(255, 255, 255);
  text-shadow: 0 0 1px rgb(0, 0, 0);

  transition:
    opacity 0.3s,
    color 0.1s;
}

.light-color .create-palette-remove-color {
  color: rgb(0, 0, 0);
  text-shadow: 0 0 1px rgb(255, 255, 255);
}

.selected .create-palette-remove-color {
  top: -1px;
  right: -1px;
}

.create-palette-color:hover .create-palette-remove-color {
  opacity: 0.6;
}

.create-palette-color .create-palette-remove-color:hover {
  opacity: 1;
  color: rgb(240, 80, 80);
  text-shadow: 0 0 1px rgb(0, 0, 0);
}

/*SPECTRUM OVERRIDES*/

.create-palette .sp-container {
  background-color: transparent;
  border: none;
  box-shadow: none;
  border-radius: 0;
  padding: 5px;
}

#dialog-container.import {
  width: 500px;
  height: 350px;
  top: 50%;
  left: 50%;
  position: absolute;
  margin-left: -250px;
  margin-top: -175px;
}

.import .dialog-content {
  font-size: 1.3em;
}

.import-step-container {
  display: flex;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  box-shadow: 0 0 2px 0 rgba(0, 0, 0, 0.5);
  background: #444;
}

.import-step-content {
  padding: 10px;
}

.import-step-buttons {
  position: absolute;
  bottom: 10px;
  right: 10px;
  text-align: right;
}

.import-first-step .import-back-button {
  display: none;
}

/**
 * IMAGE IMPORT STEP
 */

.import-image-container {
  padding: 10px;
}

.import-image-loading {
  opacity: 0.3;
  pointer-events: none;
}

.import-image-loading::after {
  content: "loading image";

  position: absolute;
  width: 100%;
  top: 0;
  left: 0;
  margin-top: 110px;

  text-align: center;
  font-size: 3em;
  color: white;
  text-shadow: 0 0 60px black;
}

.import-subsection {
  margin-left: 25px;
}

.import-section:not(.import-subsection) > .dialog-section-title {
  width: 50px;
}

.import-section-preview-title {
  position: absolute;
  margin-left: 50%;
  margin-top: -28px;
}

.import-section-preview {
  position: absolute;
  display: inline-block;
  border: 1px dashed #999;
  border-radius: 3px;
  margin-left: 50%;
  top: 10px;

  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.import-section-preview img {
  max-width: 100%;
  max-height: 100%;
  display: block;
}

.import-section-preview canvas {
  position: absolute;
}

.dialog-section-title {
  display: inline-block;
  width: 80px;
}

.dialog-section-radio {
  margin-top: 15px;
  vertical-align: sub;
}

.import-size-field:nth-of-type(2) {
  margin-left: 5px;
}

.import-image-file-name {
  display: inline-block;
  overflow: hidden;

  width: 200px;
  vertical-align: middle;

  word-break: break-all;
  white-space: nowrap;
  text-overflow: ellipsis;

  font-style: italic;
  font-weight: normal;
  text-shadow: none;
  color: gold;
}

[name="smooth-resize-checkbox"] {
  margin: 0 8px;
}

.dialog-import-body {
  padding: 10px 20px;
  font-size: 1.3em;
}

/**
 * SELECT MODE
 */

.import-info {
  display: flex;
  flex-direction: column;

  height: 100%;
  max-width: 178px;
  box-sizing: border-box;

  padding: 10px;
  border-right: 3px solid gold;
}

.import-preview canvas {
  max-width: 100%;
  max-height: 100%;
}

.import-meta {
  margin-top: 10px;
  box-sizing: border-box;

  /*center meta information horizontally*/
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.import-meta > div {
  height: 22px;
  display: flex;
  margin-bottom: 5px;
}

.import-meta-value,
.import-meta-label {
  padding: 2px 4px;
}

.import-meta-label {
  border-radius: 2px 0 0 2px;
  color: gold;
}

.import-meta-value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.import-missing {
  text-align: center;
  line-height: 70px;
  font-style: italic;
  color: #aaa;
}

.import-mode-title {
  margin-bottom: 10px;
}

.import-mode-section {
  display: flex;
  border: 3px solid #666;
  border-radius: 3px;
  padding: 10px;
  margin-bottom: 10px;
  align-items: center;
}

.import-mode-section .button {
  width: 75px;
  height: 30px;
  font-size: 14px;
  margin-left: 10px;

  flex-grow: 0;
  flex-shrink: 0;
}

.import-mode-section-description {
  flex-grow: 1;
}

.import-resize-option,
.insert-mode-option {
  display: flex;
  align-items: center;
  margin: 5px 0;
}

.import-resize-option :checked + span,
.insert-mode-option :checked + span {
  color: gold;
}

.import-resize-option input,
.insert-mode-option input {
  margin: 5px;
}

/**
 * ADJUST SIZE
 */
.import-resize-anchor-info {
  margin-bottom: 10px;
}

.import-resize-section {
  margin-bottom: 10px;
}

.import-resize-anchor {
  margin-top: 20px;
}

.import-resize-option :checked + span {
  color: gold;
}

.import-resize-warning {
  color: gold;
}

/**
 * INSERT LOCATION
 */

.insert-mode-container {
  margin-top: 20px;
  margin-bottom: 10px;
}

.insert-frame-preview {
  margin: 10px 0;
}

.insert-frame-preview .frame-picker-wrapper {
  height: 120px;
}

.performance-link {
  display: none;
  position: fixed;
  bottom: 10px;
  right: 10px;
  z-index: 11000;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s;
}

.performance-link.visible {
  display: block;
  opacity: 0.66;
  animation: glow 2s infinite;
}

.performance-link.visible:hover {
  opacity: 1;
  animation: none;
}

#dialog-container.performance-info {
  width: 500px;
  height: 525px;
  top: 50%;
  left: 50%;
  position: absolute;
  margin-left: -250px;
  margin-top: -260px;
}

.dialog-performance-info-body {
  font-size: 13px;
  letter-spacing: 1px;
  padding: 10px 20px;
}

.dialog-performance-info-body ul {
  border: 1px solid #666;
  padding: 5px;
  border-radius: 3px;
}

.dialog-performance-info-body li {
  list-style-type: initial;
  margin: 0 20px;
}

.dialog-performance-info-body sup {
  color: gold;
  cursor: pointer;
}

.show #dialog-container.performance-info {
  margin-top: -300px;
}

.dialog-performance-info-body .warning-icon {
  float: left;
  margin-top: 10px;
}

.dialog-performance-info-body .warning-icon-info {
  overflow: hidden;
  margin-left: 30px;
}

/************************************************************************************************/
/* Unsupported browser dialog                                                                   */
/************************************************************************************************/

#dialog-container.unsupported-browser {
  width: 600px;
  height: 260px;
  top: 50%;
  left: 50%;
  position: absolute;
  margin-top: -130px;
  margin-left: -300px;
}

.unsupported-browser .dialog-content {
  font-size: 1.2em;
  letter-spacing: 1px;
  padding: 10px 20px;
  overflow: auto;
}

.unsupported-browser .supported-browser-list {
  padding: 5px 20px;
}

.unsupported-browser .supported-browser-list li {
  list-style-type: square;
}

#current-user-agent {
  color: gold;
}

.user-message {
  position: absolute;
  right: 0;
  bottom: 0;
  padding: 10px 47px;
  max-width: 300px;

  border-top-left-radius: 7px;
  border: #e1a325 2px solid;
  border-right: 0;
  border-bottom: 0;

  color: #222;
  background-color: gold;

  font-weight: bold;
  font-size: 13px;

  z-index: 30000;
}

.user-message .close {
  position: absolute;
  top: 6px;
  right: 17px;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

.user-message .close:hover {
  color: black;
}

.progress-bar-container {
  position: absolute;
  left: 0;
  bottom: 0;
  padding: 10px;
  width: 360px;
  border-top-right-radius: 2px;
  border: gold 2px solid;
  border-left: 0;
  border-bottom: 0;
  background-color: #444;
  font-size: 14px;
  z-index: 30000;
  color: #eee;
}

.progress-bar-item {
  float: left;
  height: 20px;
}

.progress-bar-status {
  line-height: 20px;
  width: 40px;
  overflow: hidden;
  margin: 0 0 0 10px;
}

.progress-bar {
  border: 1px solid grey;
  margin-top: 8px;
  height: 4px;
  width: 300px;
  background: linear-gradient(
      to left,
      gold,
      gold
    )
    no-repeat -300px 0;
  background-color: black;
}

.toolbox-container {
  border: 2px solid #888;
  font-size: medium;
  color: white;
  text-align: left;
  border-radius: 2px;
  margin-top: 5px;
  overflow: hidden;
}

.toolbox-title {
  padding: 8px;
  margin: 0;
  font-size: 15px;
  /* reset for firefox */
  height: 16px;
  background: #222;
}

.toolbox-buttons {
  flex-shrink: 0;
  overflow: hidden;
  border-top: 1px solid #666;
  border-bottom: 1px solid #222;
}

.toolbox-buttons .button {
  /* Override border propery on .button elements from form.css */
  border-style: solid;
  border-color: #333;
  border-width: 0 1px 0 0;
  border-radius: 0;

  background-color: #3f3f3f;
}

.toolbox-buttons .button[disabled],
.toolbox-buttons .button[disabled]:hover {
  background-color: #aaa;
}

.toolbox-buttons button:last-child {
  border-right-width: 0;
}

/**
 * Layers container
 */
.layers-list-container {
  min-height: 85px;
  display: flex;
  flex-direction: column;
}

/**
 * Layers title and toggle preview
 */

.layers-title {
  position: relative;
  flex-shrink: 0;
}

.layers-toggle-preview {
  position: absolute;
  top: 0.3em;

  cursor: pointer;

  margin: 0 0 5px 5px;
  width: calc((100% - 30px) / 5);
  height: 32px;
  position: relative;
}

.palettes-list-colors.tiny > .palettes-list-color {

  height: 14px;
}

.palettes-list-primary-color:before {
  left: 1px;
}

.palettes-list-secondary-color:before {
  right: 1px;
  background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20height%3D%2215%22%20width%3D%2215%22%3E%3Cpath%20stroke%3D%22gold%22%20stroke-width%3D%222%22%20d%3D%22M3%2013h10V3z%22/%3E%3C/svg%3E");
}

  right: 0;

          <input type="number" min="1" class="textfield" id="png-export-columns" name="png-export-columns">
        </div>
        <div style="flex: 1;">
          <span>Rows</span>
          <input readonly="true" class="textfield" id="png-export-rows" name="png-export-rows">
        </div>
      </div>
    </div>
    <div class="export-panel-section">
      <div style="padding-bottom: 5px">
        <span class="highlight export-panel-row">Spritesheet file export: </span>
      </div>
      <div class="export-panel-row">
        <button type="button" class="button button-primary png-download-button" data-test-id="png-download-button">Download</button>
        <span class="png-export-dimension-info export-info"></span>
      </div>
    </div>
    <div class="export-panel-section">
      <div style="padding-bottom: 5px">
        <span class="highlight export-panel-row">Spritesheet data-uri export: </span>
      </div>
      <div class="export-panel-row">
        <button type="button" style="white-space: nowrap;" class="button button-primary datauri-open-button">Open</button>
        <span class="export-info">Open the spritesheet as a data-uri</span>
      </div>
    </div>

    <div class="export-panel-section">
      <div style="padding-bottom: 5px">
        <span class="highlight export-panel-row">PixiJS Movie export: </span>
      </div>
      <div class="checkbox-container" style="margin: 5px 0;">
        <input id="png-pixi-inline-image" class="png-pixi-inline-image-checkbox checkbox-fix" type="checkbox" />
        <label for="png-pixi-inline-image">Inline spritesheet as data-uri</label>
      </div>
      <div class="export-panel-row">
        <button type="button" class="button button-primary png-pixi-download-button"/>Download</button>
        <span class="export-info">Spritesheet with JSON metadata</span>
      </div>
    </div>

    <div class="export-panel-section">
      <div style="padding-bottom: 5px">
        <span class="highlight">Selected frame export:</span>
      </div>
      <div class="export-panel-row">
        <button type="button" class="button button-primary selected-frame-download-button" data-test-id="png-selected-frame-download-button"/>Download</button>
        <span class="export-info">Single frame as a PNG file</span>
      </div>
    </div>

  </div>
</script>

  <script type="text/html" id="templates/settings/export/gif.html">
  <div class="export-panel-gif">
    <div class="export-panel-header export-info">
      Convert your sprite to an animated GIF.
    </div>
    <div class="gif-export-warning">
      <div class="gif-export-warning-icon icon-common-warning-red">&nbsp;</div>
      <div class="gif-export-warning-message">
        Too many colors: can not preserve original colors or transparency.
      </div>
    </div>
    <div class="export-panel-section export-panel-row">
      <input id="gif-repeat-checkbox" class="gif-repeat-checkbox checkbox-fix" type="checkbox" />
      <label for="gif-repeat-checkbox"
             title="Uncheck to play the animation only one time."
             rel="tooltip"
             data-placement="top">Loop repeatedly</label>
    </div>
    <div class="export-panel-section export-panel-row">
      <button type="button" class="button button-primary gif-download-button">Download</button>
      <div class="export-info">Download as an animated GIF.</div>
    </div>
  </div>
</script>

      <div class="checkbox-container" style="margin: 5px 0;">
        <input id="zip-split-layers" class="zip-split-layers-checkbox checkbox-fix" type="checkbox" />
        <label for="zip-split-layers">Split by layers</label>
      </div>
      <div class="checkbox-container use-layer-names-container" style="margin: 5px 0;">

    </div>
  </div>
</script>

<script>
/* ============================================================
   vg-core.js — app-agnostic voice-guide core.
   Extracted from the First Day at the Game Studio layer (which
   was itself ported from the In-Between voice-demo architecture):
   docked side panel, transcript log, one generation counter,
   trusted-event takeover, provenance-correct resume, mic-by-
   policy, confirm-wrapper, two-tier DO gating, keyless-artifact
   LLM chain. Defines exactly ONE global, window.VoiceGuide, and
   has no side effects until create(adapter) is called.
   Authoring-time reuse: this file is spliced into a single-file
   app by the build; it is not a runtime dependency.
   ============================================================ */
(function(){
'use strict';
const VG_ABORT={vg:'abort'};
const VG_DEFAULT_KEYLESS=['claude-sonnet-5','claude-sonnet-4-6'];

/* Canonical prompt-rule text. Authoring aids for adapter system
   prompts — compose with these instead of copying, so the load-
   bearing policy sentences have one home. Parameterized fragments
   take the app's own nouns; plain ones are app-free. */
const fragments={
  voiceRules:'Your reply is read aloud by speech synthesis, so write plain speakable prose only: no markdown of any kind, no lists, no headings, no code fences, no URLs, no emoji, and write numbers and symbols the way you would say them. Prefer one to three short sentences.',
  statusRule:"The visitor's message ends with a STATUS RIGHT NOW block. Your advice must match it exactly: if earlier conversation turns disagree with the status, the status wins, and never tell the visitor to do a step the status shows as already done.",
  selfKnowledge:'You live in a docked panel \u2014 beside the app on wide windows, below it on narrow ones. The app always reflows to fit, so you never cover it; the arrow at the top of your panel hides you if the visitor wants the space back.',
  doLineMeta:'These ids are for the DO line only; in prose keep using visible names. The DO line is executed by the app and stripped before speaking, so never mention it.',
  ratifyNotice:'The app will also ask the visitor to confirm these actions, so never claim one is already done \u2014 say you are asking.',
  consentScope(o){ o=o||{};
    return '"Please do", "yes", or "go ahead" authorize only the precise action you just offered and nothing more \u2014 if you offered to '+
      (o.pointExample||'jump to a tab')+', consent to that is consent to jump, never to '+
      (o.escalations||'do anything state-changing')+'. Never escalate; when in doubt, use '+(o.safeVerb||'SHOW')+'.'; },
  pointNotDescribe(o){ o=o||{};
    return "The page is often taller than the window, so when the visitor says they can't see or find something, never just describe where it is: end with a "+
      (o.pointVerbs||'DO SHOW')+' line, which switches to it, scrolls it into view, and highlights it. Questions like "where is", "I don\'t see", or "how do I get to" should ALWAYS end with a DO line.'; }
};

  const MASCOT=ui.mascot||'\u{1F916}', THINK=ui.thinkFace||'\u{1F914}';
  const W=layout.panelWidth||300, M=layout.panelMargin||(W+2);
  const NARROW=('narrowMax' in layout)?layout.narrowMax:700;
  const APPBP=layout.appBreakpoint||0;
  const reflow=layout.reflowCSS||{};
  const BANDS=reflow.bands||[];
  const STORE_KEY=(A.id||'vg')+'-guide-panel';
