    <script>
        const postsData = [{"title": "A conversation with simulated Seymour Papert, Marvin Minsky, Alan Kay, and Lev Vygotsky led to a greatly improved agent societies construction kit", "post_url": "https://docs.google.com/document/d/1eq9W_bW533ivHT02PvRy6RcV-qYB53mfBPjHnfTkeM8/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/atelier.html", "title": "The Atelier"}, {"url": "https://toontalk.github.io/AI/apps/Agentic%20AI%20Explorer%20v1.3%20-%20Updated.html", "title": "ToonTalk"}, {"url": "https://toontalk.github.io/agent-construction-kit/making-of.html", "title": "The Making of Agent Kit"}], "chat_logs": [{"url": "https://claude.ai/share/98ec16f7-54b3-4595-a0d1-d0a894f39b6a", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "A simulated roundtable conducted with Claude Chat\u2014featuring persona-models of Seymour Papert, Marvin Minsky, Alan Kay, and Lev Vygotsky\u2014directly shaped a reimagined \"agent societies\" construction kit, spawning three apps: The Atelier, ToonTalk, and The Making of Agent Kit. The conversation zeroed in on concrete design tensions\u2014who owns ideas vs. commissions, how machines should scaffold imagination, and the need for visible mechanisms and debugging affordances\u2014so the rebuilt kit adds layered abstractions, social agent primitives, and tools that support both playful creation and deeper conceptual testing. The result is a practical, research-driven toolkit that helps children compose, iterate, and take ownership of multi-agent simulations while preserving clear pathways to explanation and theory-building.", "ai_app": true}, {"title": "Making a full-featured ToonTalk 3D", "post_url": "https://docs.google.com/document/d/1N3eFy6C06pfMREwbnzUNYYhP7aEi4c1fiylvMk-0Ylg/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/toontalk-3d/manual.html", "title": "ToonTalk 3D \u2014 the manual"}, {"url": "https://toontalk.github.io/toontalk-3d/making-of.html", "title": "Reading the Manual"}, {"url": "https://toontalk.github.io/toontalk-3d/gallery.html", "title": "ToonTalk 3D examples"}], "chat_logs": [{"url": "https://chatgpt.com/share/6ab1487c-1424-83eb-9ea8-8b439aa895c6", "title": "ChatGPT - Comment on Attached File"}, {"url": "https://claude.ai/share/6f1092c6-6547-4d63-9490-575a38be663d", "title": "Claude Chat"}], "videos": [], "chatbots": ["ChatGPT", "Claude"], "description": "Using AI coding agents, Ken Kahn has rebuilt and revived ToonTalk as a full-featured 3D web app, accompanied by a manual, a \"Reading the Manual\" guide, and an expanded collection of example programs. The release grows examples from 18 to 66 and adds core components\u2014robots, numbers, text pads, scales, boxes and tools\u2014plus images, sounds, puzzles, and 3D models, including a toy\u2011plane\u2013style 3D turtle whose trails are first-class objects. New affordances include robots that train other robots (meta-programming), a smart camera that follows the action, Marty (an assistant that creates media, comments on runs, and helps author programs), and an extensible library of anima-gadgets for animated behaviors. The project resurrects a 30-year\u2011old educational programming paradigm for teachers and researchers as an interactive, multimedia platform for studying programming-by-demonstration and AI-assisted authoring.", "ai_app": true}, {"title": "Controlling ToonTalk 3D with your voice", "post_url": "https://docs.google.com/document/d/1G23SwW0HVlMgLtKTrbGaIeBp5JD3qmrWvLkkarH7aRI/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/toontalk-3d/making-of.html", "title": "Reading the Manual"}], "chat_logs": [], "videos": [], "chatbots": [], "description": "Ken Kahn extended ToonTalk 3D with a voice-control mode, creating an exploratory app called \"Reading the Manual\" and spending five days iteratively prompting Claude to make spoken commands general and robust. He demonstrates training a robot to double numbers by speaking compound instructions like \"give a robot of one,\" \"put the one in the copier,\" and \"run,\" while the system shows the robot\u2019s thought bubble and optionally speaks feedback. The transcript reveals how the interface tolerates transcription errors, allows quick rephrasings, and reports benign versus problematic misinterpretations, so users can teach, stop, and debug behaviors by voice. Overall the project shows practical, hands-on progress toward fluid natural-language programming of a visual, agent-based learning environment.", "ai_app": true}, {"title": "Making the Comic Chat web app multi-player (and multi-LLM)", "post_url": "https://docs.google.com/document/d/1y590HqOdphVOCtw3JbrhCRGjUbeV6DdXqBEmxcvBzb4/edit?tab=t.0#heading=h.xi0v8zr5rev3", "apps": [{"url": "https://toontalk.github.io/AI/apps/comic-chat/index.html", "title": "Web Comic Chat"}, {"url": "https://claude.ai/public/artifacts/cc4d5dc2-f74d-4199-80e4-ca8d83024ba8", "title": "Claude Artifact"}], "chat_logs": [], "videos": [{"url": "https://youtu.be/H_5tEZze8Vw?si=j6pcq3adyLnIcrDj", "title": "Bill Gates' MIT Speech Featuring Comic Chat.  1996.", "video_id": "H_5tEZze8Vw"}], "chatbots": ["Claude"], "description": "Ken Kahn rebuilt the classic Comic Chat as an AI-powered web app and extended it into a multi-player, multi-LLM experience. Using Claude Code Fable 5 he produced a static, WebRTC-ready page that accepts user-supplied API keys for Claude, ChatGPT, or Gemini (with model-name choices and \"mini\" defaults), extracts room codes from file:// links, and generates shareable URLs so collaborators can join instantly. The result is a collaborative comic-chat prototype that runs locally or online and even prompted practical rendering feedback from original creator David Kurlander about head/body halos and balloon style. Kahn found the implementation surprisingly easy\u2014though he had to prompt Claude to imagine the multi-user angle.", "ai_app": true}, {"title": "A two-month project for Claude to port ToonTalk to the web", "post_url": "https://docs.google.com/document/d/1BLeINnjCbSp2iL4qPa00osr8iuGCbyHUGVUND7ke5iM/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/tt-wasm/tt-wasm/docs/port-notes.html", "title": "ToonTalk to WebAssembly \u2014 engineering notes"}, {"url": "https://toontalk.github.io/tt-wasm/tt-wasm/docs/port-story.html", "title": "Putting ToonTalk back on its feet \u2014 the story of a port"}], "chat_logs": [{"url": "https://claude.ai/share/d9ad86f2-fc71-422b-8d9b-2206b0495d89", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "Over two focused months, Claude was asked to revive ToonTalk \u2014 Ken Kahn\u2019s 210,000-line, game-like programming language for children \u2014 by porting it to the web, yielding two concrete deliverables: \"ToonTalk to WebAssembly \u2014 engineering notes\" and \"Putting ToonTalk back on its feet \u2014 the story of a port.\" Claude analyzed the old Windows C++ codebase and earlier 2013\u201315 JavaScript work, experimented with TypeScript rewrites and WebAssembly bindings, and iterated through hands-on Claude chat/code sessions; the project\u2019s annotated Claude chat logs chronicle those prompt\u2013code cycles. The result is an engaging technical narrative and engineering artifact set that demonstrates how an LLM-assisted workflow can resurrect a complex constructionist tool for browsers.", "ai_app": true}, {"title": "Claude built an app for students to explore the tension between rules and values in civics and in AI alignment", "post_url": "https://docs.google.com/document/d/1d2nTeAncQZXwOXN9wqkqM7qDuSa-sLvC4GODWlVj_0A/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/Rules-and-values-construction-kit/v0.html", "title": "Civics: rule debugger \u2014 v0 seed"}, {"url": "https://toontalk.github.io/Rules-and-values-construction-kit/guides/young.html", "title": "How to play \u2014 Rule Debugger"}, {"url": "https://toontalk.github.io/Rules-and-values-construction-kit/guides/older.html", "title": "Field manual \u2014 Rule Debugger"}, {"url": "https://toontalk.github.io/Rules-and-values-construction-kit/guides/teachers.html", "title": "Teacher's guide \u2014 Rule Debugger"}, {"url": "https://toontalk.github.io/Rules-and-values-construction-kit/draft-childrens-rights.html", "title": "Civics: rule debugger"}, {"url": "https://claude.ai/public/artifacts/60fa1843-0529-4255-b406-b4784c634b99", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://claude.ai/share/22d1c084-57b8-4631-bbd6-a830d24f773e", "title": "Claude Chat"}, {"url": "https://claude.ai/share/92005ef0-9d07-4e73-b013-1623f5214ca2", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "Ken Kahn and Claude (Opus 4.8) co-created a working prototype called \"Rule Debugger\" \u2014 a suite that includes a v0 seed app, \"How to play,\" a field manual, and a teacher\u2019s guide \u2014 which invites students to author and iteratively refine civic rules and AI values. Learners draft rules (for example, unrestricted free speech) and the app generates personas who experience realistic harms (libel, legal chilling, or hate-crime consequences), prompting students to add exceptions and negotiate trade-offs like public safety versus surveillance. The prototype can also show the AI\u2019s normal response alongside the response shaped by the student\u2019s values, making trade-offs visible and discussable. As a constructionist classroom tool, it teaches civic reasoning and AI alignment by letting students debug social norms and observe the downstream effects of rules versus values.", "ai_app": true}, {"title": "Making a 3D first person ToonTalk with Claude", "post_url": "https://docs.google.com/document/d/1gwSygWYhvqXttB8eqZZdZbAmCEYeMUI2RLeaKsx9sVE/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/toontalk-3d/the-ledger.html", "title": "The Ledger"}, {"url": "https://toontalk.github.io/toontalk-3d/making-of.html", "title": "Reading the Manual"}, {"url": "https://toontalk.github.io/toontalk-3d/manual.html", "title": "ToonTalk 3D \u2014 the manual"}], "chat_logs": [], "videos": [{"url": "https://www.youtube.com/watch?v=bpr7hSpzUNQ", "title": "A demo of 3D ToonTalk running a context-free grammar sentence generator", "video_id": "bpr7hSpzUNQ"}], "chatbots": ["Claude"], "description": "Ken Kahn used Claude Code to port ToonTalk to the web and rapidly prototype a first-person 3D \"nano\u2011ToonTalk\"\u2014a compact, playable version built from 143 prompts and 140+ interactions that includes robots, boxes that hold numbers, stacks, training\u2011by\u2011demonstration, addressing, a copier, teams, scales, birds and nests, undo/save/load, text pads, a notebook, growable tables and recursive rooms. By leaning on LLM-driven asset generation (inspired by Blender API workflows) the team cut an initial multi\u2011month estimate to weeks and released artifacts like The Ledger, Reading the Manual, and ToonTalk 3D \u2014 the manual en route to a full-featured 3D ToonTalk. The project demonstrates how conversational code assistants can accelerate the creation of interactive, constructivist learning environments.", "ai_app": true}, {"title": "Creating a Claude artifact version of ToonTalk 3D and other enhancements", "post_url": "https://docs.google.com/document/d/1rutdaPaOfTTgiGR9MTBwygxA46clLGzqmTvOjGXgWW0/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/d87c8621-e629-46d9-b54c-c0e0651621a4", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/tt-wasm/tt-wasm/build/infinity/index.html", "title": "Exploring Infinity \u2014 ToonTalk"}, {"url": "https://toontalk.github.io/toontalk-3d/infinity.html", "title": "Exploring Infinity \u2014 ToonTalk 3D"}], "chat_logs": [], "videos": [], "chatbots": ["Claude"], "description": "Ken Kahn built a Claude artifact version of ToonTalk 3D by having Claude Code generate a compact HTML artifact that loads larger resource files (cached per browser), letting Marty the Martian use a Claude \u201cbrain\u201d with only a Claude account and no API keys (usage counts against your Claude quota). To bypass artifact size limits he split resources and reused the approach he\u2019d developed for Comic Chat. He also added arrow-key controls to rotate and flip numeric cubes and repurposed a previously blank face to show prime factorizations for integers and continued fractions for rationals. Together these changes turn multiple representations\u2014fractions, repeating decimals, scientific notation, English words, prime products, and continued fractions\u2014into tangible, pedagogically rich experiences.", "ai_app": true}, {"title": "Revisiting an AI Turtle Geometry Benchmark", "post_url": "https://docs.google.com/document/d/1xanvIbQNIEqUeXVLDYV13dJZ0p33bK3t9HCOsHr4fYI/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/turtleai-field-notes.html", "title": "Drawing turtle graphics from a picture \u2014 TurtleAI field notes"}], "chat_logs": [{"url": "https://claude.ai/share/9dcb0275-db65-47c7-b155-f8690d2f59b7", "title": "Claude Chat"}, {"url": "https://claude.ai/share/e507b12a-8f9f-4c5f-84e8-e892f71fd3ab", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "This field-note-style post revisits the TURTLEAI visual-programming benchmark by building a small app and running hands-on experiments: \"Drawing turtle graphics from a picture \u2014 TurtleAI field notes\" documents chat logs with Claude Sonnet 5 as it tried to reproduce target images. In quick random trials Sonnet scored 2/6 (33%) on an initial n=6 draw and a combined 4/21 (19%) across two disclosed rounds, with the author proposing a larger blind batch (e.g., n=30) and adding an extra experiment on 31 August. The author then let the model iterate\u2014analyzing failures, retrying, and producing image sequences that show the original task and successive attempts\u2014highlighting practical gaps between published benchmark results and current multimodal models.", "ai_app": true}, {"title": "Claude helped me add an interactive guided demo of Mind Maker", "post_url": "https://docs.google.com/document/d/1kkTph2kGeO2-B8K4rwId_mp8q0hZUeWpHRB9uc9YKcc/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/how-mind-maker-was-built.html", "title": "How Mind Maker's guide was built"}, {"url": "https://claude.ai/public/artifacts/2682b494-01fa-4273-9685-168b49216931", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/MindMaker-guided-demo.html", "title": "Mind Maker"}], "chat_logs": [{"url": "https://claude.ai/share/a4b50898-03ce-4234-99d9-870e3c3674cc", "title": "Claude Chat"}], "videos": [{"url": "https://www.youtube.com/watch?v=oB0r8DSRp4c", "title": "Mind Maker demo by an LLM", "video_id": "oB0r8DSRp4c"}], "chatbots": ["Claude"], "description": "This research highlights an innovative application of Claude Opus 4.8: creating an interactive, guided demo for the \"Mind Maker\" construction kit. Developer Ken Kahn challenged Claude to build a browser-based guide using speech synthesis and recognition, enabling users to ask questions, pause, and even take control. Claude successfully developed a sophisticated, adaptable demo that narrates actions, explains features, and intelligently resumes after user interaction, significantly expanding Mind Maker's codebase. This project powerfully demonstrates the potential of LLMs to revolutionize software education by offering dynamic, personalized demonstrations.", "ai_app": true}, {"title": "Adding AI guides to three apps and helping Claude to learn to do this better", "post_url": "https://docs.google.com/document/d/1IKoAcaW3HeOUul4Qpka9nGF3H02ELC7FUaa-BMB4acY/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/how-the-interpolation-app-guide-works.html", "title": "How your turtle guide works \u2014 In-Between"}, {"url": "https://claude.ai/public/artifacts/8b7fd7c4-0f4e-4b3a-9503-32527c705306", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/in-between-voice-demo.html", "title": "In-Between \u2014 a turtle shape lab"}, {"url": "https://claude.ai/public/artifacts/86e30ab7-d67e-4f96-84b2-55ac9027bdea", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/space_games_construction_kit.html", "title": "First Day at the Game Studio \u2014 Prototype"}, {"url": "https://toontalk.github.io/misc/space-games-guide-story.html", "title": "The Game Studio got a guide"}, {"url": "https://toontalk.github.io/misc/how-piskel-got-its-guide.html", "title": "How a free art app learned to give tours"}, {"url": "https://claude.ai/public/artifacts/8d843110-4136-4883-bbdf-a48901ec41d1", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/piskel-guided.html", "title": "Piskel"}, {"url": "https://toontalk.github.io/misc/a-guide-for-every-app.html", "title": "A guide for every app"}], "chat_logs": [{"url": "https://claude.ai/share/aa6cc2ad-0cab-4135-81d4-621149337678", "title": "Claude Chat"}, {"url": "https://claude.ai/share/c4baabab-41b3-4726-80f4-c4f7f5024680", "title": "Claude Chat"}, {"url": "https://claude.ai/share/814ad8c7-bc75-4610-885f-7aff6c432abe", "title": "Claude Chat"}, {"url": "https://claude.ai/share/18b45be9-5d19-4e0f-9205-a6dcf81afec9", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "This research details the creation of interactive AI guides for three distinct educational apps, including \"How your turtle guide works \u2014 In-Between\" and \"First Day at the Game Studio \u2014 Prototype.\" These innovative guides leverage speech synthesis and recognition to offer live, user-controlled demos and answer questions, specifically tailored for young, non-technical users. The process involved iteratively prompting Claude to create and refine these guides, addressing initial shortcomings like interface obstruction. Crucially, Claude was then tasked with developing a \"voice prompt guide,\" which evolved through multiple versions to streamline and improve the reproducibility of adding AI guides to new applications, enhancing accessibility for complex tools.", "ai_app": true}, {"title": "A child-friendly app for training, exploring, and interpreting large language models", "post_url": "https://docs.google.com/document/d/1cTVVSiRZQLSaJNTaZ3Cq9ey7fjSMTz0DhtwMuZZJa8s/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/tiny-mind-anatomy.html", "title": "tiny-mind-mega.html \u2014 an anatomy"}, {"url": "https://toontalk.github.io/misc/tiny-mind-making-of.html", "title": "How Tiny Mind was made"}, {"url": "https://claude.ai/public/artifacts/de58dcff-c800-43eb-ba13-28aff46e7788", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/misc/tiny-mind-guide-kids.html", "title": "Tiny Mind \u2014 a guide for kids"}, {"url": "https://toontalk.github.io/misc/tiny-mind-guide-older-kids.html", "title": "Tiny Mind \u2014 a field guide for older kids"}, {"url": "https://toontalk.github.io/misc/tiny-mind-guide-teachers.html", "title": "Tiny Mind \u2014 a guide for teachers"}, {"url": "https://toontalk.github.io/AI/misc/turning%20posts%20into%20a%20table/ken_kahn_posts.html", "title": "Ken Kahn 2025 Posts"}], "chat_logs": [{"url": "https://claude.ai/share/a210aa0d-ca38-40f7-a0ff-35758d64e905", "title": "Claude Chat"}, {"url": "https://claude.ai/share/af236dcc-98ac-4929-93ec-57bc51843f39", "title": "Claude Chat"}, {"url": "https://claude.ai/share/2b926d0f-5f4d-4a83-bd17-e5b0fcd246af", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "Explore a groundbreaking project that makes the complex world of large language models accessible to children through a unique app. This ambitious creation, notably co-developed with LLMs like Claude Fable, features a \"nursery\" where kids can train their own small storytelling AI. Young learners can then utilize a \"microscope\" facility to inspect a white-box version of their model, or even \"hunt\" for specific components underpinning unique knowledge from their training stories. Guided by an AI companion, this research offers a novel, constructionist approach, empowering children to not just use, but truly understand and interpret the inner workings of LLMs.", "ai_app": true}, {"title": "The making of the Thought Bubble app for seeing and modifying a tiny story-telling LLM\u2019s thoughts", "post_url": "https://docs.google.com/document/d/183Gd3-_9Lv2wlkybDgr1qIvsFUuUBmsx_yg83bBGWxk/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/jlens-tinystories/guides/thought-bubble-guide-kids.html", "title": "Thought Bubble \u2014 a guide for kids"}, {"url": "https://toontalk.github.io/jlens-tinystories/guides/thought-bubble-guide-older-kids.html", "title": "Thought Bubble \u2014 a guide for older kids"}, {"url": "https://toontalk.github.io/jlens-tinystories/guides/thought-bubble-guide-teachers.html", "title": "Thought Bubble \u2014 a guide for teachers & parents"}, {"url": "https://toontalk.github.io/jlens-tinystories/guides/thought-bubble-making-of.html", "title": "The making of Thought Bubble \u2014 and the research behind it"}, {"url": "https://claude.ai/public/artifacts/b7ef2b01-5946-4a89-a333-6f40c786bf92", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/jlens-tinystories/app/jlens-guided.html", "title": "Thought Bubble \u2014 Tiny Mind"}], "chat_logs": [{"url": "https://chatgpt.com/share/6a590500-78f4-83eb-b4a3-5afc21ae0ece", "title": "ChatGPT - Minsky vs Global Workspace Theory"}, {"url": "https://claude.ai/share/b659be38-7af6-4e3c-b972-1cde3b08d19e", "title": "Claude Chat"}, {"url": "https://claude.ai/share/444a0d5c-4d2c-4cc6-bd56-dd022ca27b91", "title": "Claude Chat"}], "videos": [], "chatbots": ["ChatGPT", "Claude"], "description": "\"Thought Bubble\" is an innovative web app making AI's inner workings accessible, especially for children. Building on Anthropic's research, it loads a tiny story-telling LLM, allowing users to visualize and even modify its \"thoughts\" as it generates narratives. This interactive experience reveals how altering a single \"thought\"\u2014like swapping \"hole\" for \"castle\"\u2014can lead to surprising, contextually rich outputs such as \"moat.\" Beyond the playful experimentation, the project delves into profound AI theory, using advanced AI chats to explore connections between Anthropic's \"Global Workspace\" and Marvin Minsky's \"Society of Mind,\" offering a unique educational lens into complex AI cognition.", "ai_app": true}, {"title": "Comic Chat recreated as an AI-powered web app by Claude", "post_url": "https://docs.google.com/document/d/1Dta9hKRzaGDGY1zTjz-_wPygdR3HacoYZlzMH-JMN2E/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/cc4d5dc2-f74d-4199-80e4-ca8d83024ba8", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/comic-chat/comic-chat-claude-v1.html", "title": "Web Comic Chat + AI"}, {"url": "https://toontalk.github.io/AI/apps/comic-chat/making-of.html", "title": "The Making of Web Comic Chat"}, {"url": "https://toontalk.github.io/AI/apps/comic-chat/version-1.html", "title": "Web Comic Chat"}, {"url": "https://toontalk.github.io/AI/apps/comic-chat/index.html", "title": "Web Comic Chat"}, {"url": "https://toontalk.github.io/AI/apps/comic-chat/comic-chat-retrospective.html", "title": "The Making of Web Comic Chat \u2014 a retrospective strip"}, {"url": "https://toontalk.github.io/AI/apps/comic-chat/fidelity-report.html", "title": "Web Comic Chat \u2014 Three Fidelity Fixes"}], "chat_logs": [{"url": "https://claude.ai/share/2b527c97-57ed-40fb-b78e-d7818bc9521e", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "On Comic Chat\u2019s 30th anniversary, Claude was used to recreate Microsoft\u2019s 1996 Comic Chat as an AI-powered web app, producing a working port that even extracted the original artwork from custom file formats. The project compared responses from different LLMs (ChatGPT and Claude), iteratively nudging Claude to refine the port and later adding AI features like multi-user play, optional LLM selection, and mobile support. The site documents the porting challenges, history, and statistics (the v2.5 client alone is ~174 files/95k lines), and includes Claude-generated chat logs and explanatory HTML for nontechnical audiences. It\u2019s both a practical demonstration of agent-driven code transfer and a hands-on study in using AI to resurrect and modernize a nostalgic research artifact.", "ai_app": true}, {"title": "Space travel games construction kit", "post_url": "https://docs.google.com/document/d/1Hc03s8jcp3sh-bpj7UScDccO37VCQX0KjibgZq9Rqko/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/space%20travel%20games%20construction%20kit%20early%20version/index.html", "title": "Space Travel Games Construction Kit"}, {"url": "https://toontalk.github.io/misc/Space%20Travel%20Games%20Construction%20Kit/build-notes.html", "title": "How This Reconstruction Was Built"}, {"url": "https://toontalk.github.io/misc/build-notes.html", "title": "How This Reconstruction Was Built"}, {"url": "https://toontalk.github.io/AI/apps/Space%20travel%20games%20construction%20kit%20reconstruction/making-of.html", "title": "The Making of the Metagame"}, {"url": "https://toontalk.github.io/AI/apps/Space%20travel%20games%20construction%20kit%20reconstruction/player-story.html", "title": "Your Story \u2014 A Space Travel Games Construction Kit"}, {"url": "https://toontalk.github.io/AI/apps/Space%20travel%20games%20construction%20kit%20reconstruction/index.html", "title": "A Space Travel Games Construction Kit"}, {"url": "https://toontalk.github.io/misc/record%20of%20new%20space%20travel%20games%20construction%20kit%20by%20chatgpt.html", "title": "Conversation Summary: First Day at the Game Studio"}], "chat_logs": [{"url": "https://chatgpt.com/share/6a22fc51-5ab4-83eb-8900-efa4efba28d7", "title": "ChatGPT - Game Dev Pedagogy Design"}, {"url": "https://chatgpt.com/share/6a23b46c-54ec-83ed-8430-00230259864b", "title": "ChatGPT - Horizontal Velocity Gauge Fix"}], "videos": [], "chatbots": ["ChatGPT"], "description": "Dive into the \"Space Travel Games Construction Kit,\" a fascinating modern reconstruction of a pioneering 2005 educational project. This kit empowers users to build their own space games, embodying \"layered learning\" by allowing them to choose how deeply they explore the underlying physics and programming. Featuring a child-friendly interface, a simplified momentum-based physics model, and an innovative \"metagame\" concept where games nest within a larger narrative, it offers a rich educational experience. Intriguingly, AI via ChatGPT was instrumental in shaping its pedagogical design and even debugging, highlighting a cutting-edge approach to accessible game development education.", "ai_app": true}, {"title": "A meta-constructionist app for children to create societies of minds that learn in a constructionist manner", "post_url": "https://docs.google.com/document/d/1Vz38nDugVgO_SWmH2qesmlbDSXuCFty2SbTQTvrAzyU/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/3a3b9d30-c29e-4d70-a03a-97d17ecaa623", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/atelier-v0.html", "title": "The Atelier \u2014 v0"}, {"url": "https://toontalk.github.io/misc/session-highlights.html", "title": "The Atelier \u2014 Build Diary"}, {"url": "https://toontalk.github.io/AI/apps/guides/guide-young-students.html", "title": "The Atelier \u2014 A Guide for Young Makers"}, {"url": "https://toontalk.github.io/AI/apps/guides/guide-older-students.html", "title": "The Atelier \u2014 A Guide for Older Students"}, {"url": "https://toontalk.github.io/AI/apps/guides/guide-teachers.html", "title": "The Atelier \u2014 A Guide for Teachers"}, {"url": "https://claude.ai/public/artifacts/aefcce12-b7f2-40de-b22b-5aea9423c42e", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/MindMaker.html", "title": "Mind Maker"}], "chat_logs": [{"url": "https://claude.ai/share/fc64d130-a73a-4824-9e65-92b01db4ed25", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "This research introduces a groundbreaking \"meta-constructionist\" app, The Atelier, empowering children to build and experiment with their own societies of learning AI minds. Driven by the question of whether LLMs can learn through interaction and construction rather than just instruction, the project flips traditional AI training on its head. The app, developed with Claude Artifacts, enables young makers to design agentic systems that create, reflect, and improve. It offers a unique, hands-on opportunity for students to not only explore AI but to construct the very principles of learning within their digital creations.", "ai_app": true}, {"title": "Creating two versions of an app that fuses multiple responses to prompts", "post_url": "https://docs.google.com/document/d/1tO1Xn8Kp6CG9_EfBv-dNWtIXzPaP4A_drtBLMNr983w/edit?usp=sharing", "apps": [], "chat_logs": [], "videos": [], "chatbots": [], "description": "This research meticulously explored the conceptual design for two innovative educational apps, even though no code was written. The core idea centered on developing tools that could intelligently fuse multiple user responses to prompts, leveraging AI to synthesize diverse perspectives into a single, enriched output. The project outlined distinct versions, each designed to enhance collaborative learning and critical thinking by demonstrating how disparate student ideas could be intelligently combined and presented, offering a powerful new approach to understanding complex topics.", "ai_app": true}, {"title": "A game that treats language as a construction kit", "post_url": "https://docs.google.com/document/d/1-FYboEEALyo7RluxBd8iP6v6X0nSSrKk1tvbrCDse28/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/c02e7e60-9879-4 d unique interactive experiences.", "ai_app": true}, {"title": "A unicorn\u2019s adventures with fairies, a mermaid, and an initially very friendly shark", "post_url": "https://docs.google.com/document/d/1NBTa7iql6lasJI8leuRauSMME_lPfY_KyOAa7Mc0E88/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/sisi%20unicorn%20adventure.html", "title": "Chronicles: unicorn fantasy world"}, {"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research post chronicles a captivating AI-driven adventure, where a 5-year-old co-authored a fantasy story using Gemini. Through 33 prompts, the \"Chronicles: unicorn fantasy world\" app brought to life a unicorn's journey, complete with crystal castles, fairies, and a mermaid. Most interestingly, the project explored the AI's surprising narrative resilience when the granddaughter requested to \"get eaten by a shark.\" The AI initially softened the encounter, portraying a friendly shark with a magical playroom stomach, prompting the child to repeatedly insist on a \"mean\" shark. This engaging experiment offers fascinating insights into user agency, AI's default safety mechanisms, and the evolving nature of creative storytelling.", "ai_app": true}, {"title": "Creating a Lemmings-like Computational Thinking Game with Claude and GPT Codex", "post_url": "https://docs.google.com/document/d/1qjp4rAGZgB_6VF2ne5gnhg-BuvebewYDVgMHcXKfNHo/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/0d8af466-7642-4f29-8959-25245b4c1fef", "title": "Claude Artifact"}, {"url": "https://gemini.google.com/share/01ba96aa10f8", "title": "Gemini"}, {"url": "https://toontalk.github.io/misc/rule-runners-claude-summary.html", "title": "Rule Runners"}, {"url": "https://claude.ai/public/artifacts/a83bb7fa-3c0e-4daa-b4d0-1d53b40f48df", "title": "Claude Artifact"}], le": "Emotion Machine \u2014 The future of jobs"}, {"url": "https://toontalk.github.io/AI/misc/socrates%20on%20chatgpt%20emotion-machine-2026-02-08.html", "title": "Emotion Machine \u2014 What would Socrates think of ChatGPT?"}, {"url": "https://toontalk.github.io/AI/misc/ai%20for%20elders%20emotion-machine-2026-02-08.html", "title": "Emotion Machine \u2014 Is it ethical to create AI companions for elderly people liv"}, {"url": "https://toontalk.github.io/AI/misc/sf%20story%20emotion-machine-2026-02-09.html", "title": "Emotion Machine \u2014 Create a single paragraph science fiction story that is funn"}, {"url": "https://toontalk.github.io/AI/misc/sf%20story%20emotion-machine-v2-2026-02-09.html", "title": "Emotion Machine \u2014 Create a single paragraph science fiction story that is funn"}, {"url": "https://toontalk.github.io/AI/misc/partial%20prolog%20emotion-machine-2026-02-09.html", "title": "Emotion Machine \u2014 Display the shortest JavaScript implementation of Prolog in"}], "chat_logs": [{"url": "https://claude.ai/share/9fab073a-9435-4ea9-8fe4-11679c01f868", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "This research explores Marvin Minsky's \"Emotion Machine\" theory by using Claude Opus 4.6 to create an innovative web application. The app features a multi-agent system where a \"Deliberator\" agent tackles problems by forwarding them to four \"emotion agents\"\u2014Frustration, Curiosity, Anxiety, and Confusion. A \"Reflector\" then synthesizes these diverse perspectives, guiding a \"Strategy Selector\" to refine the problem-solving approach. This unique design allows users to observe how AI agents, inspired by Minsky's ideas, can simulate complex human-like thinking processes to address challenges like redesigning K-12 education or pondering Socrates' view on ChatGPT. The project offers a fascinating, interactive exploration of cognitive theories through AI.", "ai_app": true}, {"title": "Agents or Personas - 3 case studies eatedly generates a text description from an image, then creates a new image solely from that description, revealing how visual information evolves and \"drifts\" through AI's lens. While building this intriguing \"SemanticDrift\" app, a significant challenge emerged when Gemini unexpectedly suffered an \"amnesia\" event, overwriting the entire project and highlighting the unpredictable nature of AI co-creation and its inherent quirks.", "ai_app": true}, {"title": "Making an app with Claude and Gemini for creating an agentic AI web app", "post_url": "https://docs.google.com/document/d/1WjC7pjD9rxvgv86ICrzFL7GHfJyprHzv-Ueboh1lwF8/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/0c4bddee-78bb-4f92-b6a8-de88ebe6a88d", "title": "Claude Artifact"}, {"url": "https://gemini.google.com/share/e41cf5e8735c", "title": "Gemini"}], "chat_logs": [{"url": "https://claude.ai/share/c24c9f81-57c6-4f24-9502-587cedeeaf73", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/62f4c63b54ad", "title": "Gemini"}, {"url": "https://gemini.google.com/share/efda4c63f1ee", "title": "Gemini"}, {"url": "https://gemini.google.com/share/02e3d88cd1b0", "title": "Gemini"}, {"url": "https://gemini.google.com/share/45ef1be89041", "title": "Gemini"}, {"url": "https://gemini.google.com/share/e41cf5e8735c", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research dives into making agentic AI accessible, demonstrating how chatbots like Claude and Gemini can empower beginners to build sophisticated web applications. The author successfully developed an interactive web app where users define and prompt custom AI agents, manually or automatically forwarding responses between them to simulate collaborative workflows. Initially built with Claude, the application was significantly enhanced by Gemini, integrating powerful features like web search, image analysis, and generation. This iterative, chatbot-driven process highlights a rapid, low-code pathway for non-experts to create and explore complex agentic systems, yielding several applications in just 24 hours.", "ai_app": true}, {"title": "Using LLM browser agents to create applications and experiments using an AI agent playground", "post_url": "https://docs.google.com/document/d/10tBnKfLvYAcvdBZjEpXaKeHiDWYm4MowA6gQ8_BSktA/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/34b78a34-bcb7-4f08-a43f-1212ef85741f", "title": "Claude Artifact"}, {"url": "https://gemini.google.com/share/62f4c63b54ad", "title": "Gemini"}, {"url": "https://claude.ai/public/artifacts/6fbc0b5b-0fc2-4b50-8e47-31974bb27571", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/0c4bddee-78bb-4f92-b6a8-de88ebe6a88d", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://chatgpt.com/share/696b480c-9c00-800e-b7e6-6d45e18b0cac", "title": "ChatGPT - Browser Automation Capabilities"}, {"url": "https://chatgpt.com/share/696b4a92-742c-800e-b58d-98289c5da48c", "title": "ChatGPT - Ant Sim Exploration by ChatGPT Operator"}, {"url": "https://chatgpt.com/share/696b511d-0c10-800e-a5b2-a7801398d48b", "title": "ChatGPT - Agent Application JSON"}, {"url": "https://chatgpt.com/share/696b5b74-eba0-800e-bccd-5d5aeab8e929", "title": "ChatGPT - Agent Application Design - can't log into Gemini"}, {"url": "https://chatgpt.com/share/696b546c-bf84-800e-b55f-93221825d11d", "title": "ChatGPT - Agent Application Design"}, {"url": "https://gemini.google.com/share/62f4c63b54ad", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=O1Gr9OMgy20", "title": "ChatGPT Operator creating writing agents v2", "video_id": "O1Gr9OMgy20"}, {"url": "https://www.youtube.com/watch?v=XfH61scGVUI", "title": "Claude on Chrome creating a writing agent application", "video_id": "XfH61scGVUI"}], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research dives into the innovative use of LLM browser agents, such as ChatGPT Operator and Claude in Chrome, within an \"AI agent playground\" to explore and interact with web applications. The project extensively tested these agents' ability to navigate and run experiments on existing web apps, most notably deploying ChatGPT Operator to thoroughly explore an ant colony simulator (a Claude Artifact). This work not only demonstrated how agents can test interfaces and execute complex tasks, but also highlighted their capacity to design and conduct their own experiments, generating valuable insights directly from web environments.", "ai_app": true}, {"title": "With Gemini I created a riddle game with visual hints", "post_url": "https://docs.google.com/document/d/15H-erJEBNYUy1ImsoCqNos9XaFOHPa9KGd69RoK3KJM/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/a309db4d4311", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/08bbdc68a07d", "title": "Gemini"}, {"url": "https://gemini.google.com/share/a309db4d4311", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "In preparation for student workshops, Ken Kahn masterfully leveraged Gemini 3 Flash to build an engaging riddle game packed with cutting-edge AI features. Through a series of iterative prompts, he developed an app that dynamically generates visual hints using Gemini's API, offers speech-to-text input for answers, and even intelligently detects paraphrases. This project brilliantly demonstrates how accessible AI tools can be used to craft interactive educational experiences, showcasing advanced capabilities like image generation and natural language understanding directly within a web app. The process highlighted Gemini's potential for creating AI-powered applications without needing complex API key management.", "ai_app": true}, {"title": "Co-creating a heart and lung web app monitor", "post_url": "https://docs.google.com/document/d/1JrBNKzyue99mX2lxU9Gc47RIEc8llISMdk5wWTmt4G4/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/9227f36539a8", "title": "Gemini"}], "chat_logs": [{"url": "https://claude.ai/share/db41699f-d246-491e-ba0c-ec528105782b", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/10737883aba8", "title": "Gemini"}, {"url": "https://gemini.google.com/share/80db333e6675", "title": "Gemini"}, {"url": "https://gemini.google.com/share/9227f36539a8", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=_hO3oiEE6Kw", "title": "Heart and breathing monitor", "video_id": "_hO3oiEE6Kw"}], "chatbots": ["Claude", "Gemini"], "description": "This research details the innovative journey of co-creating a browser-based heart and lung monitor web app directly on a smartphone. The project began by exploring a \"stethoscope\" app with Claude 4.5, which guided the use of the phone's microphone for breathing and camera for heart rate. When initial development hit a wall due to sensor permission denials, the team pivoted to Gemini 3 Pro. Leveraging Gemini's Canvas environment and API, they successfully circumvented these technical hurdles, developing a functional app capable of tracking vital signs and even receiving placement advice from Gemini itself. This fascinating exploration highlights AI's role in rapid prototyping and overcoming development challenges for practical health technology.", "ai_app": true}, {"title": "An app co-created with Gemini for creating wordless stories children can narrate", "post_url": "https://docs.google.com/document/d/1DWSK1EtnP5XHI0xpKfwwks0ZSzgE6JdxDG0RZ-dqQs4/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/a05510086e7e", "title": "Gemini"}, {"url": "https://gemini.google.com/share/5895a9a75016", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/6c88a2695551", "title": "Gemini"}, {"url": "https://claude.ai/share/afd892d6-de58-4462-85fd-ae76167c65cb", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/a0f6e1bbe461", "title": "Gemini"}, {"url": "https://gemini.google.com/share/a05510086e7e", "title": "Gemini"}, {"url": "https://gemini.google.com/share/5895a9a75016", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research details the creation and exploration of an innovative app, co-developed with Gemini, designed to generate wordless picture stories for pre-literate children. Inspired by the need for engaging educational materials, particularly for children speaking endangered languages, the app allows users to select characters, locations, and themes to instantly create unique visual narratives. This AI-powered tool aims to foster crucial oral language, narrative comprehension, and inferential thinking skills, a benefit validated by existing research on wordless books. Children can then narrate these custom, AI-generated stories, promoting expressive language and imaginative storytelling in an interactive format.", "ai_app": true}, {"title": "A generic adventure app created with Gemini", "post_url": "https://docs.google.com/document/d/1_mtH_ZIb-0eXhKUAiFrcX_hDq2cuJAyn9oNAJCwSFHg/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/2430b84b1e12", "title": "Gemini"}, {"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research details the iterative creation of a dynamic, open-ended adventure app powered by Gemini. Initially envisioning a journey to ancient Egypt during the Great Pyramid's construction, the author opted for a dedicated app running in Gemini's canvas over a simple chat for greater potential. Through a series of prompts, the app evolved, integrating features like AI-generated images, improved layout, scrollable game history, and speech input. Crucially, the project transformed from a specific narrative into a remarkably generic adventure engine, allowing players to define any time and place for their escapades. The result is a highly customizable AI storytelling tool, showcasing Gemini's advanced capabilities in interactive app development.", "ai_app": true}, {"title": "Gemini added AI help to MoPiX with little guidance", "post_url": "https://docs.google.com/document/d/13S3Q5CoZTztsPVzfQwnmZUcfGXLVhZ3KTek3S0XFKR8/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/faca4e3b6ed2", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/7dc97f7bccb5", "title": "Gemini"}, {"url": "https://gemini.google.com/share/faca4e3b6ed2", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research showcases Gemini's remarkable ability to autonomously integrate AI help into MoPiX 3, an educational programming app it previously co-created. With minimal guidance, Gemini augmented the application by adding 500 lines of code, demonstrating its capacity for significant enhancement. A compelling example arose when the researcher faced a common programming challenge: making a clock hand rotate around its end. Gemini stepped in, providing detailed trigonometric equations to precisely fix the pivot point, illustrating its potential as an intelligent, problem-solving tutor within the tools it helps build.", "ai_app": true}, {"title": "Exploring how Gemini can now do more than generate text and images", "post_url": "https://docs.google.com/document/d/1HzhX0uoXMdSks9BkNzPVvsiYn74P8myZsJiUl9b7_88/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/313cfea03e35", "title": "Gemini"}, {"url": "https://gemini.google.com/share/9faccde38e73", "title": "Gemini"}], "chat_logs": [{"url": "https://ai.google.dev/gemini-api/docs/maps-grounding", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/google-search", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/code-execution", "title": "Gemini"}, {"url": "https://gemini.google.com/share/438819fbc1e9", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/maps-grounding.", "title": "Gemini"}, {"url": "https://gemini.google.com/share/313cfea03e35", "title": "Gemini"}, {"url": "https://gemini.google.com/share/9faccde38e73", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research explores Gemini's expanded capabilities, moving beyond simple text and image generation to integrate powerful tools like Google Maps, Google Search, and code execution via its API. The author investigated if these advanced functionalities could create interactive web apps without needing separate API keys. After a preliminary \"silly app\" successfully demonstrated this tool integration, a more practical \"Eco-Journey CO2 Calculator\" was developed. This innovative app allows users to input two cities and a car type, intelligently using Maps to chart the journey and Search to calculate CO2 emissions for each leg, even factoring in regional electricity production for EVs. This showcases Gemini's potential for developing sophisticated, tool-powered applications.", "ai_app": true}, {"title": "Playing etymology and history games with chatbots", "post_url": "https://docs.google.com/document/d/1w0jLNi1Gc0vDbCYb5BosDyZZyHyUg8qR4wniqN4N930/edit?usp=sharing", "apps": [], "chat_logs": [{"url": "https://claude.ai/share/ce2e1ed0-a03f-43d3-b76e-2453058b975d", "title": "Claude Chat"}, {"url": "https://claude.ai/share/d51c7846-1c29-414d-b6c9-97dc8862346f", "title": "Claude Chat"}, {"url": "https://chatgpt.com/share/691aebf3-e8ac-800e-ab15-4b066bf4c73b", "title": "ChatGPT - Etymology game challenge"}, {"url": "https://gemini.google.com/share/40ab3491d4eb", "title": "Gemini"}, {"url": "https://claude.ai/share/15bdb443-eff3-47f4-82a9-09c511d602ad", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/87b217993b0c", "title": "Gemini"}, {"url": "https://gemini.google.com/share/0ccbeb69bb63", "title": "Gemini"}, {"url": "https://chatgpt.com/share/691aeb9b-2be4-800e-9c86-60d33cf30efc", "title": "ChatGPT - Historical game challenge"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This AI education research explores a novel approach to educational gaming: transforming chatbots into interactive game hosts, eliminating the need for dedicated apps. The author successfully played an etymology game directly within Claude, ChatGPT, and Gemini, where the AI generated multiple-choice questions about word origins and accurately tracked scores. Building on this success, the chatbots were then prompted to suggest diverse new game concepts, leading to ideas like \"First Lines,\" \"Historical 'Which Came First?',\" and \"Invention Year\" challenges. This exploration highlights the significant potential for AI to deliver engaging, adaptable learning experiences through simple chat interfaces.", "ai_app": true}, {"title": "Creating Logo programs using free-form speech", "post_url": "https://docs.google.com/document/d/1G4cWHk9WqV9fi0DRJDa_M00PsUXZeQT9PIQJAr8eFPU/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/311d0e8122d2", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/54a0e1e6fa36", "title": "Gemini"}, {"url": "https://gemini.google.com/share/311d0e8122d2", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=s47FwJRqN_E", "title": "Talk to the Logo turtle demo", "video_id": "s47FwJRqN_E"}], "chatbots": ["Gemini"], "description": "Ken Kahn's research showcases an innovative application of Gemini 2.5 Pro, creating an app that generates Logo programs directly from free-form speech. Starting as a basic turtle graphics tool, the project evolved through 79 iterative exchanges with Gemini into a full Logo interpreter. Users can simply speak commands like \"draw a red triangle,\" and the app instantly translates these into executable Logo code, complete with visual output and a chat log. This proof-of-concept demonstrates a powerful new approach to programming education, making coding more intuitive and accessible by bridging natural language with computational logic.", "ai_app": true}, {"title": "A Tarot Card app conceived and implemented by Gemini 3 Pro", "post_url": "https://docs.google.com/document/d/1HUQd8d342PBNvObqdGy531oBX5GiJvTEbtpjPl2F1vg/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/6c977df13ea2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1e9132074378", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/misc/zeitgeist-tarot-journal.html", "title": "My Zeitgeist Tarot Journal"}, {"url": "https://toontalk.github.io/AI/misc/zeitgeist-tarot-journal%20for%20ken%20kahn.html", "title": "My Zeitgeist Tarot Journal"}], "chat_logs": [{"url": "https://gemini.google.com/share/ca139d0e06b0", "title": "Gemini"}, {"url": "https://gemini.google.com/share/427f13cb9122", "title": "Gemini"}, {"url": "https://gemini.google.com/share/0d2ad088fb4b", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/tools", "title": "Gemini"}, {"url": "https://gemini.google.com/share/6c977df13ea2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1e9132074378", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research post delves into the creative frontiers of AI by showcasing a unique Tarot card app, \"The Zeitgeist Tarot,\" entirely conceived and implemented by Gemini 3 Pro. The project was designed to explore LLM creativity and test Gemini's advanced capabilities, particularly its search grounding and image generation tools. Users input a topic, and the app leverages Gemini to analyze the current \"mood\" of that subject from live web searches, summarizing it in three evocative words and crafting a short fortune. These insights then guide the AI to generate a distinct Tarot card image, offering a fascinating, real-time visual representation of the chosen zeitgeist.", "ai_app": true}, {"title": "Infinite Zoom conceived and implemented by Gemini 3 Pro", "post_url": "https://docs.google.com/document/d/1wOvzt7u2GtTCcBjyHxebRJ0n1rFsT0Ji_F9J-bMj6uY/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/de724f4f9f08", "title": "Gemini"}, {"url": "https://gemini.google.com/share/4202ed1bc341", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/d0200fc8e380", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1f821454b152", "title": "Gemini"}, {"url": "https://gemini.google.com/share/6b38bf465ff5", "title": "Gemini"}, {"url": "https://gemini.google.com/share/fa532d2310fa", "title": "Gemini"}, {"url": "https://gemini.google.com/share/de724f4f9f08", "title": "Gemini"}, {"url": "https://gemini.google.com/share/4202ed1bc341", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=0fKBhvDjuy0", "title": "Powers of Ten\u2122 (1977)", "video_id": "0fKBhvDjuy0"}], "chatbots": ["Gemini"], "description": "This AI education research post unveils \"The Synesthetic Poet,\" an innovative app developed with Gemini 3 Pro that translates written text into dynamic, generative art. Users input poems or lyrics, which Gemini analyzes for sentiment, rhythm, and imagery, then generates bespoke P5.js code to visually represent the text abstractly on screen. This project beautifully demonstrates AI's capacity to not just process information, but to craft functional code for creative expression, moving beyond mere image generation. While impressive, the author observes that the app's core interaction ultimately resembled a sophisticated wrapper for direct chatbot prompting.", "ai_app": true}, {"title": "Self-Coding Art Blob - conceived and implemented by Gemini 3 Pro", "post_url": "https://docs.google.com/document/d/1PTaZNBoGEnfOr0uiYRJZyzCW9I6kYjao25xKYn96S_0/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/57a29a50766b", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/035b24d2dc18", "title": "Gemini"}, {"url": "https://gemini.google.com/share/57a29a50766b", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=z0CQmOWPAbQ", "title": "Self-Coding Art Blob Demo", "video_id": "z0CQmOWPAbQ"}, {"url": "https://www.youtube.com/watch?v=x164VnJ7iu0", "title": "Self-Coding Art Blob - live coding demo", "video_id": "x164VnJ7iu0"}], "chatbots": ["Gemini"], "description": "This research unveils a groundbreaking \"Self-Coding Art Blob\" app, entirely conceived and implemented by Gemini 3 Pro. Users interact with a \"Living Blob\" by typing words like \"Spiky\" or \"Liquid,\" which act as \"mutagens.\" The app's innovation lies in its ability to rewrite its own P5.js `draw()` function in real-time: it sends its current code and the user's word to Gemini, which then generates new code to dynamically morph the blob's behavior. This allows for instant, AI-driven artistic transformations without page reloads, demonstrating a fascinating new frontier in AI-assisted creative coding and app development.", "ai_app": true}, {"title": "Gemini proposes and implements \u2018Magic SketchPad\u2019 that turns sketches into simple animations", "post_url": "https://docs.google.com/document/d/1mpHyQi9sSYNG2pdRXc_a2kX5C7-T_6jDkkaaKd0bM9I/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/d2736a12952a", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/videos/magic-sketch%20volano%202.html", "title": "Magic Sketch Animation"}, {"url": "https://toontalk.github.io/AI/videos/magic-sketch%20volano.html", "title": "Magic Sketch Animation"}, {"url": "https://toontalk.github.io/AI/videos/magic-sketch%20xkcd%207.html", "title": "Magic Sketch Animation"}], "chat_logs": [{"url": "https://gemini.google.com/share/b342780d8ec0", "title": "Gemini"}, {"url": "https://gemini.google.com/share/d2736a12952a", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=7SBmaM7MtXM", "title": "Magic sketchpad demo", "video_id": "7SBmaM7MtXM"}], "chatbots": ["Gemini"], "description": "This research introduces 'Magic SketchPad,' an innovative web app that transforms user sketches into simple, quirky animations using Gemini's generative AI. Users draw on a canvas, then a \"Magic Animate\" button prompts Gemini to act as a \"creative coder.\" The AI interprets the drawing, generating P5.js code that brings the sketch to life with appropriate movements\u2014imagine squiggles wriggling or circles bouncing. This project brilliantly showcases how AI can empower creative expression, turning static doodles into dynamic digital art and exploring Gemini's capabilities in real-time code generation for interactive experiences.", "ai_app": true}, {"title": "Gemini creating a Tetris-like game for foreign language practice", "post_url": "https://docs.google.com/document/d/1izodmvZO561FoXlwinD5swkknD4gnArZMhguLu8Ca-Q/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/fd53fc41-0294-4e76-8289-619c7f478f5e", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/language-tetris.html", "title": "WordFall"}], "chat_logs": [{"url": "https://g.co/gemini/share/5d10782f04ae", "title": "Gemini"}, {"url": "https://claude.ai/share/6dd30133-089e-4288-9e54-96b8f9719f9a", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/9507e825013b", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=DgQ86muejCA", "title": "WordFall demo - vocabulary practice in a tetris-like game", "video_id": "DgQ86muejCA"}], "chatbots": ["Claude", "Gemini"], "description": "This research unveils *WordFall*, an innovative foreign language practice game developed almost entirely by Gemini 2.5 Pro. Imagine a Tetris-like experience where blocks representing words in two different languages fall, only to vanish when you match synonyms across languages. Starting from a simple prompt, Gemini quickly engineered a functional web game, which was then iteratively refined to allow users to select custom categories and any two languages for practice. The project also explored the integration of Chrome's advanced LLM API, demonstrating both the power and the nuanced challenges of prompting AI for complex application development, ultimately creating a dynamic and adaptable learning tool.", "ai_app": true}, {"title": "Acquiring computational thinking skills together with a chatbot", "post_url": "https://docs.google.com/document/d/1jP3Aiama-YHflDuK_TQ_a5F-oi3lbtit4i5QO2RhSZE/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/249acb05-25ea-414c-b5ea-f3fc312d4699", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/87626a8e-f85f-41e9-b469-0a59e27643c6", "title": "Claude Artifact"}, {"url": "https://gemini.google.com/share/944dbe4acba9", "title": "Gemini"}, {"url": "https://claude.ai/public/artifacts/96d2909c-4018-496b-844c-ee4f57b4bbdb", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://gemini.google.com/share/e55f85f85184", "title": "Gemini"}, {"url": "https://gemini.google.com/share/b3cb3cffdc25", "title": "Gemini"}, {"url": "https://chatgpt.com/share/68f25e91-fa5c-800e-bdc0-eb7256612488", "title": "ChatGPT - Computational thinking advice"}, {"url": "https://claude.ai/share/04413989-43d8-4704-8eda-2a667871aa0d", "title": "Claude Chat"}, {"url": "https://claude.ai/share/9787880b-9bfa-4124-82e6-fb09a24c1195", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/944dbe4acba9", "title": "Gemini"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "\"Acquiring computational thinking skills together with a chatbot\" details an innovative exploration where the author roleplayed a high school student seeking to learn this crucial 21st-century skill. Engaging with Claude, ChatGPT, and Gemini, the research highlights Claude's particular effectiveness in guiding the learning process through encouraging questions and high-level conceptual explanations, sidestepping complex programming syntax. A fascinating outcome was the co-creation of an app specifically designed to analyze peanut butter and jelly sandwich construction algorithms in natural language. This constructionist approach showcases AI's potential to make computational thinking accessible and hands-on, even for something as everyday as a sandwich.", "ai_app": true}, {"title": "Co-creating an app for making a collage of generated images", "post_url": "https://docs.google.com/document/d/1YX2xEvLyK6aVmK40hLB8HYCrImFy2LtNBNP6kFlL688/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/f358e3d88601", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1ab55a07958f", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/aff9aaf4f733", "title": "Gemini"}, {"url": "https://gemini.google.com/share/f358e3d88601", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1ab55a07958f", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "Inspired by a 4-year-old's struggle to collage AI-generated unicorn images using cumbersome tools, this research explores co-creating a dedicated web app with Gemini. The goal was an intuitive application where users could describe, generate, and then easily arrange and resize images into a custom collage. Leveraging Gemini 2.5 Pro and Flash, a functional app was rapidly developed, with one simpler version achieved in just two AI exchanges. This innovative approach demonstrates the efficiency of AI-assisted development for creating user-friendly educational tools that empower creative expression.", "ai_app": true}, {"title": "Co-creating a multi speaker app", "post_url": "https://docs.google.com/document/d/1synmWK0U1IYdthbGREs4tD1zOekeKhD4GW8YnRXS7Lw/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/multi%20speaker.html", "title": "Multi-Speaker Text-to-Speech Converter"}], "chat_logs": [{"url": "https://claude.ai/share/5c1946fb-65fe-445a-8e71-0fb64ab05df4", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/7 2", "title": "Gemini"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "Ever wondered if AI could invent useful, believable words like Shakespeare did? This engaging research post explores just that, prompting ChatGPT, Claude, and Gemini to create ten new English words complete with definitions and sample uses. The chatbots delivered impressive results, from ChatGPT's \"glintwist\"\u2014a fleeting, shared look conveying unspoken understanding\u2014to Claude's \"afterclap\" for an awkward re-clapping moment, and Gemini's \"ambisway,\" describing the shuffle in a narrow hallway. The study further investigated if these novel creations already existed online, ultimately showcasing the remarkable linguistic creativity of today's AI.", "ai_app": true}, {"title": "Chatbots helped me explore and understand \u201cContemplative Artificial Intelligence\u201d", "post_url": "https://docs.google.com/document/d/18Cq0Ss9nlc3AhjNYWyftZMkOQUfILHZA_zf3gA7aN-8/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/3ef5934a-5424-4570-ba50-b67dec811723", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/conversations/contemplative%20allignment/what%20to%20eat%20by%20Claude.html", "title": "Contemplative AI Comparison Report"}, {"url": "https://g.co/gemini/share/68bc899e06cb", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/conversations/contemplative%20allignment/what%20to%20eat%20by%20Gemini.html", "title": "ToonTalk"}], "chat_logs": [{"url": "https://claude.ai/share/7f1592c0-8394-4e8c-94e3-bfd5e033fec1", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/a890bb260549", "title": "Gemini"}, {"url": "https://g.co/gemini/share/68bc899e06cb", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research pioneers an engaging new method for AI education, reversing traditional chatbot roles to explore \"Contemplative Artificial Intelligence.\" Instead of posing questions, the user challenged Claude and Gemini to quiz them on a complex paper proposing AI systems infused with mindfulness, emptiness, and non-duality. These principles aim to create benevolent, self-correcting AI less prone to runaway optimization or adversarial behavior. The chatbots then acted as insightful, personalized tutors, asking targeted questions and providing constructive feedback to deepen understanding. This innovative approach showcases AI's potential as an active, adaptive learning assistant for mastering intricate scientific concepts.", "ai_app": true}, {"title": "Exploring Pythagoras's Theorem with AI help", "post_url": "https://docs.google.com/document/d/1dvZqb7CmsKQdfKFB2LYCmMZnA7H0ou9gBNFUYRfsvFM/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/fec6cb3a-46ff-4fea-a2ab-fd8d6151f888", "title": "Claude Artifact"}, {"url": "https://chatgpt.com/canvas/shared/68d26f7c76cc8191ab05e6ba1f4757ea", "title": "ChatGPT - Pythagoras Intuition \u2013 Rearrangement Proof (interactive Svg)"}, {"url": "https://g.co/gemini/share/6a5efd3f80e0", "title": "Gemini"}, {"url": "https://claude.ai/public/artifacts/3d80ea34-19eb-427b-a4c0-af8b064bc042", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/1e1fec72-8066-4ff7-bada-baf0bda96db4", "title": "Claude Artifact"}, {"url": "https://g.co/gemini/share/773455ac8e46", "title": "Gemini"}, {"url": "https://g.co/gemini/share/d6dc5837b665", "title": "Gemini"}], "chat_logs": [{"url": "https://g.co/gemini/share/71cde9b73235", "title": "Gemini"}, {"url": "https://chatgpt.com/share/68ce6520-3f74-800e-b808-4543e35b8b03", "title": "ChatGPT - Pythagoras' Theorem animation"}, {"url": "https://claude.ai/share/687b1311-85a6-49b7-b287-bea3e7c77560", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/cdb911242a38", "title": "Gemini"}, {"url": "https://g.co/gemini/share/fb5951416105", "title": "Gemini"}, {"url": "https://g.co/gemini/share/f0202aae58ef", "title": "Gemini"}, {"url": "https://claude.ai/share/ca2265c6-0ed9-4b5f-af25-b8020998b4e8", "title": "Claude Chat"}, {"url": "https://chatgpt.com/share/68d51f85-97c8-800e-8709-7ca387d900ba", "title": "ChatGPT - Pythagoras' Theorem intuition"}, {"url": "https://g.co/gemini/share/8b6c344cef38", "title": "Gemini"}, {"url": "https://g.co/gemini/share/6a5efd3f80e0", "title": "Gemini"}, {"url": "https://g.co/gemini/share/773455ac8e46", "title": "Gemini"}, {"url": "https://g.co/gemini/share/d6dc5837b665", "title": "Gemini"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research post chronicles an ambitious journey to leverage AI in teaching the intuition behind Pythagoras's Theorem. Experimenting extensively with Claude, ChatGPT, and Gemini, the author aimed to transcend mere statements of the theorem, pushing AI to generate insightful explanations and interactive SVG animations. Despite initial frustrations with AI's inability to grasp geometric intuition or produce useful animations for the rearrangement proof, persistence led to focused prompting for underlying principles. The exploration ultimately resulted in the creation of several interactive SVG apps, demonstrating the evolving potential\u2014and current limitations\u2014of AI in visualizing and explaining complex mathematical concepts through dynamic, rearrangeable proofs.", "ai_app": true}, {"title": "Chatbots can build an app to \u201cvibe code\u201d micro:bits", "post_url": "https://docs.google.com/document/d/12qpCT7RP7XL-axZdmdD9IJ_JnJM-fD_t9HQg17ysfmg/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/misc/microbit-ai-chat-history-2025-09-27.html", "title": "micro:bit AI Chat History"}, {"url": "https://toontalk.github.io/AI/misc/microbit-ai-chat-history-2025-09-28.html", "title": "micro:bit AI Chat History"}, {"url": "https://toontalk.github.io/AI/apps/microbit_AI_coder.html", "title": "micro:bit MicroPython Editor"}, {"url": "https://toontalk.github.io/AI/misc/microbit-ai-chat-history-2025-09-29%20 d songs. Each persona, from the artistic Frida to the coding expert Ada, contributed to creating an engaging, funny, and educational experience, demonstrating AI's potential to produce complex, multi-modal learning tools.", "ai_app": true}, {"title": "Disappointing chats despite improvements to Gemini multi-persona app", "post_url": "https://docs.google.com/document/d/1jY82bDxWkcTwYVomz87D_3zL7c6y4xRHHc6GpvqL84A/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/conversations/falling%20objects%20text.html", "title": "My Storybook"}, {"url": "https://g.co/gemini/share/6b44e70100d5", "title": "Gemini"}], "chat_logs": [{"url": "https://chatgpt.com/share/68a035e1-c888-800e-baee-eda34bebe51c", "title": "ChatGPT - Chat ideas for students"}, {"url": "https://chatgpt.com/share/a51524d7-fc4f-4a97-90f8-c5569999c4ee?oai-dm=1", "title": "ChatGPT - Aristotle-Galileo: Heliocentric Dispute"}, {"url": "https://g.co/gemini/share/9ab92e2ac589", "title": "Gemini"}, {"url": "https://g.co/gemini/share/6b44e70100d5", "title": "Gemini"}], "videos": [], "chatbots": ["ChatGPT", "Gemini"], "description": "Ken Kahn's latest research explores the educational potential of multi-persona LLM chats, utilizing his enhanced Gemini app and My Storybook. He experimented by having elementary students co-create stories through animal personas and recreated a historical debate between Aristotle, Galileo, and Newton. While initial chat outcomes and story drafts were disappointing, Kahn significantly improved the Gemini app with refined image generation and chat tone controls. Despite these early challenges, he remains optimistic that multi-persona LLMs hold immense potential for fostering student engagement and collaborative creativity.", "ai_app": true}, {"title": "Using Claude to create Claude-powered apps", "post_url": "https://docs.google.com/document/d/1gqJB9Rn9cGnGH7bzt5i6LYTKfOgLgshqyBIj-ys2noU/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/0be5a28d-e04a-476
