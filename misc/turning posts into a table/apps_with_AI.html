/claude.ai/share/b439e236-672a-45c1-bbaf-07d38d209af6", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/e075eabf1a67", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research details the creation and exploration of an innovative Claude app designed for dynamic conversations between multiple independent AI personas, allowing users to observe and contribute. The project pushed boundaries by attempting features like rendering persona-generated HTML or SVG directly within the chat, and enabling personas to react to user-pasted images. While the core multi-persona chat application was successfully developed using the Claude API, the study revealed limitations with Claude 4 Sonnet's ability to integrate all these advanced functionalities into a single, complex application, highlighting current challenges in AI-driven app development.", "ai_app": true}, {"title": "Updating the Connection Game Maker", "post_url": "https://docs.google.com/document/d/1p-Fes0NiS1SPqriVLdyvqOg2UGQlp46MpES0_8u2gZw/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/Connections-v3.html", "title": "Connection Games Maker"}, {"url": "https://claude.ai/public/artifacts/3ea4980c-dc0a-4509-b612-282a2dbb8c9e", "title": "Claude Artifact"}, {"url": "https://g.co/gemini/share/684dca0e6b4e", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/apps/Connections-v4.html", "title": "Connection Games Maker"}], "chat_logs": [{"url": "https://gemini.google/overview/gemini-in-chrome/", "title": "Gemini"}, {"url": "https://g.co/gemini/share/7bafce4280f6", "title": "Gemini"}, {"url": "https://g.co/gemini/share/6c84fab53c96", "title": "Gemini"}, {"url": "https://claude.ai/share/7c3c1252-afc6-4731-9c5e-5197a3e0482a", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/684dca0e6b4e", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research details the fascinating evolution of an AI-powered \"Connection Game Maker,\" initially developed with ChatGPT 4 to generate NYT-style puzzles before LLMs were familiar with the game. The project significantly expands by integrating cutting-edge AI models, resulting in multiple app versions that harness Gemini Nano on Chrome, the Gemini API, and the Claude API. This exploration demonstrates seamless cross-LLM integration within web applications, showcasing how various AI capabilities can be leveraged. Further innovations include highly customizable puzzle generation prompts and the novel addition of emoji-based puzzles, highlighting the creative potential and versatility of modern AI in educational game development.", "ai_app": true}, {"title": "Weird hybrid creature guessing game co-created with Gemini", "post_url": "https://docs.google.com/document/d/1BATQpBjPsPXcsawXp2U6e6H0AyeadTI7SvIvq8WgfhQ/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/3679a7d00346", "title": "Gemini"}], "chat_logs": [{"url": "https://g.co/gemini/share/2829f84fbcd2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/7e7f6efd242a", "title": "Gemini"}, {"url": "https://gemini.google.com/share/3679a7d00346", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research post details the creation of a \"Weird hybrid creature guessing game\" co-created with Gemini, exploring the AI's surprising ability to generate interactive web apps combining image generation and chat responses. Despite initial claims of inability, the researcher successfully prompted Gemini to build a working game where players guess imaginary cross-breed animals, illustrated in a charming 19th-century naturalist style. The game incorporates features like partial guess feedback, humorous AI responses to ridiculous answers, and tracking a limited number of attempts, demonstrating an iterative co-creation process that pushes the boundaries of AI-driven app development.", "ai_app": true}, {"title": "Chatbots designing and making apps", "post_url": "https://docs.google.com/document/d/1LjmEJTblpl26paOuDLvzj24vnPOMkm2DHWHcVvvtdLo/edit?usp=sharing", "apps": [{"url": "https://chatgpt.com/canvas/shared/6880d6c0c7a8819191724a6b4a84c919", "title": "ChatGPT - Confetti Compliments App"}, {"url": "https://chatgpt.com/canvas/shared/6880cd0b0148819184b4a658330cb880", "title": "ChatGPT - Word Garden Flowers"}, {"url": "https://chatgpt.com/canvas/shared/687e1b60478081918204cfe11d392823", "title": "ChatGPT - Word Garden"}, {"url": "https://chatgpt.com/canvas/shared/6880a8aceb888191a7fe0974acc4a27d", "title": "ChatGPT - Constellation Composer"}, {"url": "https://claude.ai/public/artifacts/b911b97f-a8d9-4cd2-a775-669178d20938", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/75445d93-6270-4a6f-8288-7dcb033b8698", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/48f9c3fc-65a8-4bff-92e8-229ebb6e157f", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/68bc6716-0ad5-4040-a1ca-9a44cd67667d", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/d53bda0c-4814-4001-a41f-5b445465d40b", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/4c18f89a-1ca4-4f2b-82a6-b6b84d1be4dd", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://g.co/gemini/share/a43bcbe663cd", "title": "Gemini"}, {"url": "https://g.co/gemini/share/e693960d6349", "title": "Gemini"}, {"url": "https://g.co/gemini/share/a4d4a2724281", "title": "Gemini"}, {"url": "https://g.co/gemini/share/f323a7196c21", "title": "Gemini"}, {"url": "https://g.co/gemini/share/1467ea719a3e", "title": "Gemini"}, {"url": "https://g.co/gemini/share/1dc402be1f0e", "title": "Gemini"}, {"url": "https://g.co/gemini/share/94751555d1d2", "title": "Gemini"}, {"url": "https://chatgpt.com/share/6880d7c7-0690-800e-a9fd-0308655376d2", "title": "ChatGPT - Web app idea generation"}, {"url": "https://claude.ai/share/a5c17beb-5291-4888-a3af-6c9976693dce", "title": "Claude Chat"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This intriguing research delves into the creative and implementation capabilities of leading AI models like ChatGPT, Gemini, and Claude, by challenging them to design and build \"unusual fun web apps.\" The researcher acted as a critical editor and beta tester, guiding the AI through iterative prompts like \"improve\" or \"now for something completely different.\" This collaborative process resulted in the creation of over 16 diverse applications, showcasing the AI's surprising ingenuity. From the whimsical 'Confetti Compliments App' and 'Word Garden Flowers' to the imaginative 'Constellation Composer' and Gemini's 'Cosmic Compliments' or 'The Alchemist's Grimoire,' the project offers a compelling glimpse into AI's potential as an autonomous creative partner in software development.", "ai_app": true}, {"title": "A multi-persona app generating storybooks and comic books", "post_url": "https://docs.google.com/document/d/1BbgHIdaXvAaVd25CZCtljt6sWMMT9BRV62Rqk0MQ8G8/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/a9cb24de14cb", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/conversations/Gemini%20multi-persona/my-comic%20with%20bananas.html", "title": "ToonTalk"}, {"url": "https://toontalk.github.io/AI/conversations/Gemini%20multi-persona/my-storybook%20mondrian.html", "title": "ToonTalk"}, {"url": "https://toontalk.github.io/AI/conversations/Gemini%20multi-persona/sisi-programmer.html", "title": "ToonTalk"}], "chat_logs": [{"url": "https://g.co/gemini/share/f3876bf6a105", "title": "Gemini"}, {"url": "https://gemini.google.com/share/a9cb24de14cb", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research details the creation of a novel multi-persona app leveraging Gemini's image generation to transform chat conversations into captivating visual narratives. Inspired by classic comic chat, the author developed an application that dynamically generates storybooks and comic panels, complete with cartoon speakers and their utterances, directly from multi-agent interactions. While successfully producing various illustrated styles, from graphic novels to children's storybooks, the project highlights significant challenges in precisely controlling AI-generated text and imagery, such as unwanted embellishments and spelling errors. This pioneering work offers valuable insights into the complexities and immense potential of using LLMs for creative content generation, evolving simple chats into visually rich, accessible stories.", "ai_app": true}, {"title": "Seven personas and me talking about creating an app for learning about numbers", "post_url": "https://docs.google.com/document/d/1CWc3JFlivWFzRWdT_PDgtjzSq6mI9Dl81HcIW1bGXGs/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/numbers%20by%207%20personas.html", "title": "Number Explorer Prototype V3"}, {"url": "https://g.co/gemini/share/5f4c69badae0", "title": "Gemini"}, {"url": "https://g.co/gemini/share/39eddc1f88ed", "title": "Gemini"}], "chat_logs": [{"url": "https://g.co/gemini/share/5f4c69badae0", "title": "Gemini"}, {"url": "https://g.co/gemini/share/39eddc1f88ed", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research presents an engaging AI-driven experiment, simulating a \"dream team\" of seven diverse experts collaborating to design apps for young children to learn about numbers. AI personas, including luminaries like Seymour Papert and Jean Piaget, engaged in an extensive 162-exchange conversation, each response illustrated with generated images. This unique exploration delved into the essence of number and learning, ultimately yielding three working web app prototypes, such as the \"Number Explorer Prototype V3.\" It's a fascinating look at how AI can orchestrate expert discussions to inform innovative pedagogical tool development.", "ai_app": true}, {"title": "Playing Tic Tac Toe with a snarky AI", "post_url": "https://docs.google.com/document/d/1CzbfTZUulzUbbfnIonD2ryNUtB6VEG0KLx9vLhMEtBU/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/tic-tac-toe.html", "title": "Tic\u2011Tac\u2011Toe \u2022 AI\u00a0vs\u00a0You"}, {"url": "https://claude.ai/public/artifacts/90b9c2b8-b349-4620-ab67-4603f22ef9a8", "title": "Claude Artifact"}, {"url": "https://chatgpt.com/canvas/shared/68027e1fc8b88191879cf8fd1bd4e82b", "title": "ChatGPT - Tic Tac Toe Perfect"}], "chat_logs": [{"url": "https://chatgpt.com/share/680291e2-14e0-800e-bff5-9d2c7ac93c2a", "title": "ChatGPT - Perfect Tic-Tac-Toe AI"}, {"url": "https://gemini.google.com/share/6ccae3243bd3", "title": "Gemini"}, {"url": "https://gemini.google.com/share/764d5f007f41", "title": "Gemini"}], "videos": [{"url": "https://youtu.be/oZq9enktvyk?si=kSv-NtPscd11BgoN", "title": "Talking Tic Tac Toe", "video_id": "oZq9enktvyk"}], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research chronicles the creation of a dynamic Tic-Tac-Toe game featuring a snarky AI opponent. Beginning with ChatGPT for perfect gameplay, the project rapidly integrated Gemini to generate humorous, move-specific remarks. The experience was further elevated by enabling players to speak, with Gemini responding conversationally to both moves and dialogue. Though speech recognition faced limitations in certain AI environments, the post details the iterative development of multiple game versions, showcasing the engaging and personalized experience of playing against a truly witty AI.", "ai_app": true}, {"title": "An app for exploring creativity in chatbots", "post_url": "https://docs.google.com/document/d/1psNLuXuY3xQOVbX9coMWwNh1IB6sO2CQLwuIEB8jrIQ/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/llm-creativity-explorer.html", "title": "Gemini Response Explorer"}, {"url": "https://claude.ai/public/artifacts/4a8b1786-5063-4051-a4ea-82ea392727ee", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://claude.ai/share/e7edf33f-a25b-4000-87f0-3b9bc8fabd2f", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "This research delves into the intriguing paradox of AI creativity, where chatbots can boost individual human creativity while potentially reducing the overall diversity of content. Inspired by a Science Advances study, the author developed the \"Gemini Response Explorer\" and \"Claude Artifact\" apps to meticulously investigate this phenomenon. Running 12 experiments, the project explored how factors like chatbot \"temperature\" and specific prompts influence the uniqueness of AI-generated story summaries. Initial findings indicate that increasing the temperature parameter effectively enhances diversity, providing valuable insights into steering AI's creative output. A dedicated data visualization app further brings these compelling results to life.", "ai_app": true}, {"title": "Gemini 2.0 Flash talking to itself", "post_url": "https://docs.google.com/document/d/1dJvZxR4kpxL7bV35dvXow23i2F-caMP7YanP2gMyK40/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/gemini-flash.html", "title": "ToonTalk"}, {"url": "https://toontalk.github.io/AI/apps/soup%20game.html", "title": "Sentient Spoonful (Emoji Edition with Sound)"}], "chat_logs": [{"url": "https://chatgpt.com/share/67aee34a-7d24-800e-a93a-87c940e07285", "title": "ChatGPT - Sentient Spoonful Game Design"}], "videos": [], "chatbots": ["ChatGPT", "Gemini"], "description": "This research explores the fascinating concept of multiple Gemini 2.0 Flash AI instances \"talking to each other.\" Leveraging a generous free API tier, the author challenged one AI to create a web page facilitating these multi-instance conversations, all without server code. The experiment quickly evolved, generating diverse content from creative writing lessons and science fiction stories to whimsical applications like the \"Sentient Spoonful\" game. This innovative approach demonstrates AI's potential for self-guided creative development, where instances collaborate to build interactive experiences and even animations. It offers a unique glimpse into AI as a conversational partner in the creation process.", "ai_app": true}, {"title": "Using \u201cReasoning\u201d chatbots to improve the Connections Puzzle game generator", "post_url": "https://docs.google.com/document/d/14Yl4mC8jtiA56T3CdPOAiRIQ1V4d1a557wXYRywbNTc/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/Connections-v2/index.html", "title": "Connections Game"}], "chat_logs": [{"url": "https://chatgpt.com/share/67975b96-3f48-800e-8eb9-cc30e7e39276", "title": "ChatGPT - Word Categorization Challenge"}], "videos": [], "chatbots": ["ChatGPT"], "description": "This research unveils a novel method for refining AI prompts, specifically for a Connections Puzzle game generator. Instead of solely observing outputs, the author leveraged \"reasoning\" chatbots like ChatGPT o1 to reveal their internal thought processes and \"chain of thought.\" This deep dive uncovered critical ambiguities and misunderstandings in the original prompt, even though simpler LLMs executed it successfully. Through iterative conversations with these reasoning models, a significantly improved prompt was developed, demonstrating a powerful new strategy for debugging and enhancing AI interactions by understanding *how* models interpret instructions.", "ai_app": true}, {"title": "Chatbot-assisted co-creation of a neural net to judge confidence from text", "post_url": "https://docs.google.com/document/d/1AuhwCuprcrtREaT8zRW3RWdNSpf0ILlVHRzGBq4-I18/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/confidence/index.html", "title": "Confidence Predictor"}, {"url": "https://toontalk.github.io/AI/apps/confidence/confidence-by-o1.html", "title": "Confidence Classifier (All Updates)"}, {"url": "https://toontalk.github.io/AI/apps/confidence/confidence-by-deepseek-r1-fixed-by-claude.html", "title": "Confidence Level Predictor"}], "chat_logs": [{"url": "https://chat.openai.com/share/3767033d-7da0-47e3-9383-a5556e4dc1eb", "title": "ChatGPT - Text Confidence Predictor."}], "videos": [], "chatbots": ["Claude"], "description": "This research presents an engaging journey into the chatbot-assisted co-creation of a neural network designed to judge confidence levels from text. Beginning as a foundational Snap! model, the project evolved into web-based applications like the \"Confidence Predictor,\" built iteratively with ChatGPT. A crucial step involved using LLMs, such as Claude 3.5, to significantly enlarge the training dataset, dramatically improving the model's accuracy. This showcases the profound utility of reasoning models in developing specialized machine learning apps, providing not only direct assistance but also suggesting architectural and training enhancements for more effective and accessible AI education.", "ai_app": true}, {"title": "Experiments with an app to repeat prompts to LLMs", "post_url": "https://docs.google.com/document/d/1ckK0X4Zl6cm8PCz0_wpEpPptebpA_brAaPBTle-BfX8/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/repeated%20prompting/index.html", "title": "Repeating LLM Prompter (LanguageModel API)"}], "chat_logs": [{"url": "https://gemini.google.com/share/3013c49f7e74", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research unveils the \"Repeating LLM Prompter,\" an innovative app, largely coded by AI, designed to effortlessly explore the impact of iterative prompting on Large Language Models. The app functions with a static and a dynamic text area; the LLM processes their combined input, then replaces the dynamic section with its evolving response. A fascinating experiment demonstrates Gemini Flash 1.5 transforming \"To be, or not to be, that is the question\" over 23 iterations, refining it into a profoundly poetic and expansive cosmic meditation. This ss app to the chatbot and pastes AI responses back into the game, transforming a cumbersome manual process into an effortless, integrated interaction.", "ai_app": true}, {"title": "Dialog and OceanAI responses and generated games by Claude 3", "post_url": "https://docs.google.com/document/d/1pOF4bUHruXSYs5vknyH00zhd9sa-hxrK2sV5hFC07UY/edit?usp=sharing", "apps": [], "chat_logs": [{"url": "https://chatgpt.com/share/02a8d326-8a39-4457-9395-65841e8620d0", "title": "ChatGPT - Illustrated Story Ideas"}], "videos": [], "chatbots": ["ChatGPT", "Claude"], "description": "This research presents a fascinating exploration into how AI can democratize game creation for non-technical students, employing a novel approach. Instead of direct interaction, the study tasked Claude 3.5 Sonnet to *simulate* two middle schoolers conversing with an AI, simultaneously generating iterative versions of a web game like 'EcoQuest,' a platformer focused on environmental awareness. The compelling output is a 24-page illustrated story, featuring ChatGPT-generated visuals, that vividly demonstrates how young learners can develop apps by starting simple, iterating, and problem-solving through AI dialogue. It offers a blueprint for an accessible, conversational pathway for students to bring their creative, community-focused game ideas to life, guided entirely by artificial intelligence.", "ai_app": true}];

        function deduplicateLinks(links) {
            const seen = new Set();
            return links.filter(link => {
                if (seen.has(link.url)) return false;
                seen.add(link.url);
                return true;
            });
        }

        function renderPosts() {
            const tbody = document.getElementById('postsTable');
            tbody.innerHTML = postsData.map((post, index) => {
                const chatbotBadges = post.chatbots.map(bot =>
                    `<span class="chatbot-badge chatbot-${bot.toLowerCase()}">${bot}</span>`
                ).join('');

                const allLinks = deduplicateLinks([
                    ...post.apps.map(app => ({ url: app.url, title: app.title, type: 'app' })),
                    ...post.chat_logs.map(chat => ({ url: chat.url, title: chat.title, type: 'chat' })),
                    ...post.videos.map(video => ({ url: video.url, title: video.title, type: 'video' }))
                ]);

                const linksHtml = allLinks.length > 0
                    ? allLinks.map(link => `<a href="${link.url}" target="_blank" class="badge badge-${link.type}">${link.title}</a>`).join('')
                    : '<span style="color: #999; font-style: italic;">No links</span>';

                return `
                    <tr>
                        <td>
                            <div class="post-title">
                                <a href="${post.post_url}" target="_blank">${post.title}</a>
                                <button class="info-btn" onclick="showDescription(${index})">i</button>
                            </div>
                        </td>
                        <td>${chatbotBadges || '<span style="color: #999;">None</span>'}</td>
                        <td>${linksHtml}</td>
                    </tr>
                `;
            }).join('');
        }

        const modal = document.getElementById('modal');
        const closeBtn = document.querySelector('.close');

        function showDescription(index) {
            const post = postsData[index];
            document.getElementById('modalTitle').textContent = post.title;
            const description = post.description || 'No description available.';
            const htmlContent = marked.parse(description);
            document.getElementById('modalBody').innerHTML = htmlContent;
            modal.style.display = 'block';
        }

        closeBtn.onclick = function() { modal.style.display = 'none'; }
        window.onclick = function(event) { if (event.target == modal) modal.style.display = 'none'; }

        renderPosts();
    </script>
</body>
</html>
