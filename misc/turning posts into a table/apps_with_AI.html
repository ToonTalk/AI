al evolution lab proved unsatisfactory, Claude Opus 4.7 swiftly proposed and built a simpler version, evolving tiny Logo programs. Claude Opus 4.8 then impressively refined this \"Biomorphs-lineage\" app, guiding its focus to visible generations, mutations, and human-driven \"artificial selection.\" Children engaging with apps like \"Specimens \u2014 A Field Guide to Evolved Drawings\" simply click on evolving images, providing an intuitive, interactive journey into the core mechanics of evolution."}, {"title": "Under my guidance Claude made a web app for anyone to explore reinforcement learning", "post_url": "https://docs.google.com/document/d/1AuVzYWBl607tpXvCq6M-QNKCMbzoGhGN9WltEw5H5NQ/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/a0117131-9b74-41ae-b450-a5876215aa61", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/reinforcement_learning_playground.html", "title": "The Learning Machine \u2014 Reinforcement Learning Playground"}, {"url": "https://claude.ai/public/artifacts/a0117131-9b74-41ae-b450-a5876215aa61", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/reinforcement_learning_playground.html", "title": "The Learning Machine \u2014 Reinforcement Learning Playground"}], "chat_logs": [{"url": "https://claude.ai/share/670b0e71-643c-4d54-b1d6-344dfc5cbea0", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/fef817e8ffe7", "title": "Gemini"}, {"url": "https://claude.ai/share/670b0e71-643c-4d54-b1d6-344dfc5cbea0", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/fef817e8ffe7", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This fascinating research details how, under human guidance, the AI chatbot Claude Opus 4.8 developed \"The Learning Machine,\" an innovative web app designed to demystify reinforcement learning (RL). Aimed at anyone, especially middle and high school children, the app allows users to explore how AI learns to master games like Tic-tac-toe and Connect Four through interactive self-play. The project uniquely demonstrates AI's capacity to not only grasp complex concepts but also to autonomously create sophisticated educational tools, even integrating features like an \"Ask Claude\" function for user queries. It's a compelling example of AI building accessible platforms to teach about AI itself."}, {"title": "A multi-agent app to evolve turtle graphics programs co-created with Gemini", "post_url": "https://docs.google.com/document/d/1ulliMQ1VPaTMGQcigS2WpqiYxVKIXhxyhxlyubzoohA/edit?usp=sharing", "apps": [], "chat_logs": [], "videos": [], "chatbots": ["Gemini"], "description": "This research post details an innovative exploration into AI education: the conceptualization of a multi-agent app co-created with Gemini. The proposed application is designed to evolve turtle graphics programs, showcasing a novel approach to using AI in generative design and learning environments. This project uniquely highlights the potential of human-AI collaboration, where Gemini assists in shaping the multi-agent system's architecture and functionality. The work offers compelling insights into future pedagogical innovations, even as it outlines the initial stages of building complex educational tools."}, {"title": "A Sequel by Claude to \u201cA multi-agent app to evolve turtle graphics programs co-created with Gemini\u201d", "post_url": "https://docs.google.com/document/d/1WDxgXhIcihifkU0ZoE2KEJjfpiuUkl7mc2bQyld50bc/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/turtle%20program%20evolutions.html", "title": "Logo turtle program evolutions"}, {"url": "https://toontalk.github.io/AI/apps/logo-evolution-lab.html", "title": "Logo Evolution Lab"}, {"url": "https://toontalk.github.io/AI/apps/logo-evolution-lab.html", "title": "Logo Evolution Lab"}, {"url": "https://claude.ai/public/artifacts/cfecf783-fa20-4e00-87ff-f901a858a7ba", "title": "Claude Artifact"}, {"url": "https:// /gemini-3-1-flash-tts/", "title": "Gemini"}, {"url": "https://chatgpt.com/share/69e7a1f9-5e50-838c-a48b-9af77d81ced9", "title": "ChatGPT - Canvas React Fix"}, {"url": "https://gemini.google.com/share/fc15ee4b3456", "title": "Gemini"}], "videos": [], "chatbots": ["ChatGPT", "Gemini"], "description": "This research post chronicles the intriguing journey of creating a talking unicorn app for a child named Sisi, leveraging Gemini's AI Studio. While initial development was remarkably smooth, incorporating expressive AI speech with emotional tags and even word highlighting for early readers, the real challenge emerged during the sharing phase. The author encountered a \"nightmare\" of React compilation and deployment issues, struggling with API key management and persistent bugs even after simplifying the app to a single HTML file. This highlights a critical lesson: while AI tools can make app creation intuitive, the complexities of deployment and user-friendly sharing remain a significant hurdle in AI education and development."}, {"title": "An app for running and analyzing Logo turtle program AI-assisted evolution experiments", "post_url": "https://docs.google.com/document/d/1gjJFFj42vtFrYi7Ao-pEOdTZ6Gu_CPTyLlMnkKPc3Cc/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/e5cf2d14-ece8-4c08-9799-c1f965d2cca8", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/logo-evolution-lab-experiment.html", "title": "Logo Evolution Lab \u2014 Experiment Edition"}, {"url": "https://toontalk.github.io/misc/Logo%20experiments/best_logo_experiments_gallery.html", "title": "Best experiments by subfolder (19 entries)"}, {"url": "https://claude.ai/public/artifacts/e5cf2d14-ece8-4c08-9799-c1f965d2cca8", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/logo-evolution-lab-experiment.html", "title": "Logo Evolution Lab \u2014 Experiment Edition"}, {"url": "https://toontalk.github.io/misc/Logo%20experiments/best_logo_experiments_ ": "https://gemini.google.com/share/f7667f92b05c", "title": "Gemini"}, {"url": "https://chatgpt.com/share/69a83ef4-c120-800e-bde3-b1eab0f1f35b", "title": "ChatGPT - AI-powered Web Game"}, {"url": "https://claude.ai/share/5cebf203-a7fb-4856-a416-2ccb6518244d", "title": "Claude Chat"}, {"url": "https://claude.ai/share/cfb3b19b-d5f2-407d-a808-62d68c524586", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/c31018302f64", "title": "Gemini"}, {"url": "https://gemini.google.com/share/64c05cdd327c", "title": "Gemini"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research explores the fascinating challenge of whether Large Language Models (LLMs) can be truly creative in designing fun, novel web games. Initially, LLMs produced unique game concepts, but these often lacked genuine player enjoyment. To overcome this, the researcher iteratively co-created a detailed prompt with AI, evolving it to prioritize both novelty and player-centric fun. The refined prompt now guides LLMs to consider user age and interests, incorporating essential \"fun-engineering\" principles like feedback loops, difficulty curves, and moment-to-moment enjoyment. This process, using tools like Gemini and Claude Artifact, aims to enable LLMs to craft genuinely engaging and delightful gaming experiences."}, {"title": "A unicorn\u2019s adventures with fairies, a mermaid, and an initially very friendly shark", "post_url": "https://docs.google.com/document/d/1NBTa7iql6lasJI8leuRauSMME_lPfY_KyOAa7Mc0E88/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/misc/sisi%20unicorn%20adventure.html", "title": "Chronicles: unicorn fantasy world"}, {"url": "https://toontalk.github.io/misc/sisi%20unicorn%20adventure.html", "title": "Chronicles: unicorn fantasy world"}, {"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}, {"url": "https://toontalk.github.io/misc/sisi%20unicorn%20adventure.html", "title": "Chronicles: unicorn fantasy wo he Deliberator through iterative problem-solving cycles. This fascinating project demonstrates how AI can model complex human thought processes, offering a unique platform to explore the computational nature of emotions and their role in sophisticated problem-solving."}, {"title": "Agents or Personas - 3 case studies", "post_url": "https://docs.google.com/document/d/1te1_4kKer3l8cK457L1OvEvFbvQ5G7LNjAY_4AR9m0Q/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/c0d465e7-9abb-426a-b283-66119db283e9", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20v2%20emotion-machine-2026-02-13.html", "title": "Emotion Machine \u2014 How can we redesign K-12 so students use AI wisely to unders"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20emotion-machine-2026-02-13.html", "title": "Emotion Machine \u2014 How can we redesign K-12 so students use AI wisely to unders"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20emotion-machine-2026-02-13.html", "title": "Emotion Machine \u2014 How can we redesign K-12 so students use AI wisely to unders"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20v3%20emotion-machine-2026-02-13.html", "title": "Emotion Machine \u2014 How can we redesign K-12 so students use AI wisely to unders"}, {"url": "https://claude.ai/public/artifacts/c0d465e7-9abb-426a-b283-66119db283e9", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20v2%20emotion-machine-2026-02-13.html", "title": "Emotion Machine \u2014 How can we redesign K-12 so students use AI wisely to unders"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20emotion-machine-2026-02-13.html", "title": "Emotion Machine \u2014 How can we redesign K-12 so students use AI wisely to unders"}, {"url": "https://toontalk.github.io/AI/misc/k12%20by%20opus%204.6%20emotion-machine-2026-02-13.html", "title": "Emotion Machi share/46f7537d-b6d2-4d14-b23b-f21ca4e8a177", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/9c8b409a1407", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research details the co-creation of an AI image generation \"telephone\" game with Gemini, replicating an experiment where an initial image is repeatedly described by AI, and a new image is generated solely from that description. The \"SemanticDrift\" app was built using Gemini's cost-free API to observe how visual information evolves and \"drifts\" through these iterative transformations. While exploring Gemini's capabilities for this unique visual chain, the development process encountered a fascinating \"break\" where Gemini unexpectedly overwrote the entire project and lost its conversational history, highlighting the unpredictable nature of AI co-creation."}, {"title": "Making an app with Claude and Gemini for creating an agentic AI web app", "post_url": "https://docs.google.com/document/d/1WjC7pjD9rxvgv86ICrzFL7GHfJyprHzv-Ueboh1lwF8/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/0c4bddee-78bb-4f92-b6a8-de88ebe6a88d", "title": "Claude Artifact"}, {"url": "https://gemini.google.com/share/e41cf5e8735c", "title": "Gemini"}, {"url": "https://claude.ai/public/artifacts/0c4bddee-78bb-4f92-b6a8-de88ebe6a88d", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://claude.ai/share/c24c9f81-57c6-4f24-9502-587cedeeaf73", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/62f4c63b54ad", "title": "Gemini"}, {"url": "https://claude.ai/share/c24c9f81-57c6-4f24-9502-587cedeeaf73", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/efda4c63f1ee", "title": "Gemini"}, {"url": "https://gemini.google.com/share/02e3d88cd1b0", "title": "Gemini"}, {"url": "https://gemini.google.com/share/45ef1be89041", "title": "Gemini"}, {"url": "https://claude.ai/share/c24c9f81-57c6-4f24-9502-587cedeeaf73", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/62f4c63b54ad", "title": "Gemini"}, {"url": "https://claude.ai/share/c24c9f81-57c6-4f24-9502-587cedeeaf73", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/efda4c63f1ee", "title": "Gemini"}, {"url": "https://gemini.google.com/share/02e3d88cd1b0", "title": "Gemini"}, {"url": "https://gemini.google.com/share/45ef1be89041", "title": "Gemini"}, {"url": "https://gemini.google.com/share/e41cf5e8735c", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research explores a fascinating new frontier: empowering beginners to create sophisticated agentic AI web apps using only AI assistants. The author leveraged Claude and Gemini to co-develop a platform where users can easily define, prompt, and orchestrate multiple AI agents. This innovative app allows agents to collaborate, forwarding responses manually or automatically, and even incorporates unique Gemini features like web search and image analysis. The project demonstrates the potential of AI-assisted development to democratize complex AI system creation, despite encountering a challenging bug that even Gemini couldn't resolve."}, {"title": "Using LLM browser agents to create applications and experiments using an AI agent playground", "post_url": "https://docs.google.com/document/d/10tBnKfLvYAcvdBZjEpXaKeHiDWYm4MowA6gQ8_BSktA/edit?usp=sharing", "apps": [{"url": "https://claude.ai/public/artifacts/34b78a34-bcb7-4f08-a43f-1212ef85741f", "title": "Claude Artifact"}, {"url": "https://gemini.google.com/share/62f4c63b54ad", "title": "Gemini"}, {"url": "https://claude.ai/public/artifacts/6fbc0b5b-0fc2-4b50-8e47-31974bb27571", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/34b78a34-bcb7-4f08-a43f-1212ef85741f", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/34b78a34-bcb7-4f08-a43f-1212ef85741f", "title": "Claude Artifact"}, {"url": "https://claude.ai/public/artifacts/0c4bddee-78b UI"}, {"url": "https://www.youtube.com/watch?v=O1Gr9OMgy20", "title": "ChatGPT Operator creating writing agents v2", "video_id": "O1Gr9OMgy20"}, {"url": "https://www.youtube.com/watch?v=O1Gr9OMgy20", "title": "ChatGPT Operator creating writing agents v2", "video_id": "O1Gr9OMgy20"}, {"url": "https://www.youtube.com/watch?v=XfH61scGVUI", "title": "Claude on Chrome creating a writing agent application", "video_id": "XfH61scGVUI"}], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research unveils the advanced capabilities of LLM browser agents, like ChatGPT Operator and Claude in Chrome, demonstrating their prowess in autonomously interacting with web applications. The study details how these agents navigate user interfaces, create experiments, and even assist in designing new applications within an AI agent playground. A compelling example showcases an agent expertly exploring a \"Claude Artifact\" ant colony simulator, running experiments, and analyzing the generated data for scientific insights. This work highlights the immense potential for AI agents to revolutionize application development and scientific exploration through direct web interaction."}, {"title": "With Gemini I created a riddle game with visual hints", "post_url": "https://docs.google.com/document/d/15H-erJEBNYUy1ImsoCqNos9XaFOHPa9KGd69RoK3KJM/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/a309db4d4311", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/08bbdc68a07d", "title": "Gemini"}, {"url": "https://gemini.google.com/share/08bbdc68a07d", "title": "Gemini"}, {"url": "https://gemini.google.com/share/a309db4d4311", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "Ken Kahn leveraged Gemini to create an engaging riddle game, designed to inspire students in upcoming workshops in Assam, India. This interactive app, built incrementally with Gemini 3 Flash, dynamically generates visual hints, offers three difficulty levels, and incorporates speech input and output. Crucially, the game utilizes Gemini's AI for sophisticated paraphrase detection, accepting diverse answers. The project successfully demonstrated how accessible AI app development can be, showcasing powerful features like image generation, natural language processing, and voice interaction all within a single platform."}, {"title": "Co-creating a heart and lung web app monitor", "post_url": "https://docs.google.com/document/d/1JrBNKzyue99mX2lxU9Gc47RIEc8llISMdk5wWTmt4G4/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/9227f36539a8", "title": "Gemini"}], "chat_logs": [{"url": "https://claude.ai/share/db41699f-d246-491e-ba0c-ec528105782b", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/10737883aba8", "title": "Gemini"}, {"url": "https://gemini.google.com/share/80db333e6675", "title": "Gemini"}, {"url": "https://claude.ai/share/db41699f-d246-491e-ba0c-ec528105782b", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/10737883aba8", "title": "Gemini"}, {"url": "https://gemini.google.com/share/80db333e6675", "title": "Gemini"}, {"url": "https://gemini.google.com/share/9227f36539a8", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=_hO3oiEE6Kw", "title": "Heart and breathing monitor", "video_id": "_hO3oiEE6Kw"}, {"url": "https://www.youtube.com/watch?v=_hO3oiEE6Kw", "title": "Heart and breathing monitor", "video_id": "_hO3oiEE6Kw"}], "chatbots": ["Claude", "Gemini"], "description": "This research post chronicles the intriguing co-creation of a \"heart and lung web app monitor,\" transforming a smartphone into a digital stethoscope. Initially collaborating with Claude, the project tackled challenges like sensor access and optimal methods for detecting breaths and heartbeats. When security permissions stalled progress, the researcher pivoted to Gemini, successfully developing a browser-based web app that leverages the phone's microphone and camera. This innovative monitor demonstrates AI's capacity to overcome technical hurdles, bringing ambitious health-monitoring concepts to life through iterative, intelligent co-creation."}, {"title": "An app co-created with Gemini for creating wordless stories children can narrate", "post_url": "https://docs.google.com/document/d/1DWSK1EtnP5XHI0xpKfwwks0ZSzgE6JdxDG0RZ-dqQs4/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/a05510086e7e", "title": "Gemini"}, {"url": "https://gemini.google.com/share/5895a9a75016", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/6c88a2695551", "title": "Gemini"}, {"url": "https://claude.ai/share/afd892d6-de58-4462-85fd-ae76167c65cb", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/a0f6e1bbe461", "title": "Gemini"}, {"url": "https://gemini.google.com/share/6c88a2695551", "title": "Gemini"}, {"url": "https://gemini.google.com/share/a05510086e7e", "title": "Gemini"}, {"url": "https://claude.ai/share/afd892d6-de58-4462-85fd-ae76167c65cb", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/a0f6e1bbe461", "title": "Gemini"}, {"url": "https://gemini.google.com/share/5895a9a75016", "title": "Gemini"}], "videos": [], "chatbots": ["Claude", "Gemini"], "description": "This research unveils an innovative web app, co-created with Gemini, designed to generate personalized wordless stories for pre-literate children. Inspired by discussions on supporting endangered languages, the app allows users to select icons for characters, locations, and themes, producing unique visual narratives. This interactive approach encourages children to narrate the stories themselves, fostering vital oral language skills, narrative comprehension, and inferential thinking\u2014benefits strongly validated by AI-assisted research. The project compellingly demonstrates AI's potential to create customizable, engaging educational tools that empower early childhood development, especially across diverse linguistic backgrounds."}, {"title": "A generic adventure app created with Gemini", "post_url": "https://docs.google.com/document/d/1_mtH_ZIb-0eXhKUAiFrcX_hDq2cuJAyn9oNAJCwSFHg/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/2430b84b1e12", "title": "Gemini"}, {"url": "https://gemini.google.com/share/2430b84b1e12", "title": "Gemini"}, {"url": "https://gemini.google.com/share/fb92968ec227", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research post details the fascinating journey of transforming a specific ancient Egypt adventure concept into a generalized, AI-powered app using Gemini. Starting with an initial query for a text and image adventure set at the Giza pyramids, the author iteratively prompted Gemini to build and refine a web app, rather than relying solely on chat. The most compelling development saw the app evolve from a fixed scenario to a versatile platform where players can define *any* time and place for their adventures. Through meticulous prompting, features like dynamic image generation, UI improvements, and speech-to-text were integrated, demonstrating the profound potential of iterative AI development for creating highly customizable interactive experiences."}, {"title": "Gemini added AI help to MoPiX with little guidance", "post_url": "https://docs.google.com/document/d/13S3Q5CoZTztsPVzfQwnmZUcfGXLVhZ3KTek3S0XFKR8/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/faca4e3b6ed2", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/7dc97f7bccb5", "title": "Gemini"}, {"url": "https://gemini.google.com/share/faca4e3b6ed2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/7dc97f7bccb5", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research post details an experiment where Gemini, with minimal human guidance, integrated an AI helper directly into MoPiX 3\u2014a programming app it co-developed previously. Gemini remarkably added 500 new lines of code to achieve this. The resulting AI assistant showcased advanced problem-solving, exemplified when it autonomously provided detailed trigonometric equations to correct a common rotation pivot point issue for a clock hand, even suggesting adjustments for speed and direction. This demonstrates Gemini's impressive ability to not only build but also enhance applications with sophisticated, context-aware programming assistance."}, {"title": "Exploring how Gemini can now do more than generate text and images", "post_url": "https://docs.google.com/document/d/1HzhX0uoXMdSks9BkNzPVvsiYn74P8myZsJiUl9b7_88/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/313cfea03e35", "title": "Gemini"}, {"url": "https://gemini.google.com/share/9faccde38e73", "title": "Gemini"}], "chat_logs": [{"url": "https://ai.google.dev/gemini-api/docs/maps-grounding", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/google-search", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/code-execution", "title": "Gemini"}, {"url": "https://gemini.google.com/share/438819fbc1e9", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/maps-grounding", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/google-search", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/code-execution", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/maps-grounding.", "title": "Gemini"}, {"url": "https://gemini.google.com/share/313cfea03e35", "title": "Gemini"}, {"url": "https://gemini.google.com/share/9faccde38e73", "title": "Gemini"}, {"url": "https://gemini.google.com/share/438819fbc1e9", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research dives into Gemini's expanded capabilities, demonstrating how it now integrates powerful tools beyond mere text and image generation. The author explored its new ability to leverage Google Maps, Google Search, and code execution. Initially, a \"fun, quirky web app\" was prompted to prove Gemini could create tool-based applications. This led to the development of a practical \"Eco-Journey CO2 Calculator,\" which intelligently uses Maps to plot routes and Search to calculate CO2 emissions for various car types, even considering regional electricity production, showcasing Gemini's potential for sophisticated, data-driven applications."}, {"title": "Playing etymology and history games with chatbots", "post_url": "https://docs.google.com/document/d/1w0jLNi1Gc0vDbCYb5BosDyZZyHyUg8qR4wniqN4N930/edit?usp=sharing", "apps": [], "chat_logs": [{"url": "https://claude.ai/share/ce2e1ed0-a03f-43d3-b76e-2453058b975d", "title": "Claude Chat"}, {"url": "https://claude.ai/share/d51c7846-1c29-414d-b6c9-97dc8862346f", "title": "Claude Chat"}, {"url": "https://chatgpt.com/share/691aebf3-e8ac-800e-ab15-4b066bf4c73b", "title": "ChatGPT - Etymology game challenge"}, {"url": "https://gemini.google.com/share/40ab3491d4eb", "title": "Gemini"}, {"url": "https://claude.ai/share/15bdb443-eff3-47f4-82a9-09c511d602ad", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/87b217993b0c", "title": "Gemini"}, {"url": "https://gemini.google.com/share/0ccbeb69bb63", "title": "Gemini"}, {"url": "https://chatgpt.com/share/691aeb9b-2be4-800e-9c86-60d33cf30efc", "title": "ChatGPT - Historical game challenge"}, {"url": "https://claude.ai/share/ce2e1ed0-a03f-43d3-b76e-2453058b975d", "title": "Claude Chat"}, {"url": "https://claude.ai/share/d51c7846-1c29-414d-b6c9-97dc8862346f", "title": "Claude Chat"}, {"url": "https://chatgpt.com/share/691aebf3-e8ac-800e-ab15-4b066bf4c73b", "title": "ChatGPT - Etymology game challenge"}, {"url": "https://gemini.google.com/share/40ab3491d4eb", "title": "Gemini"}, {"url": "https://claude.ai/share/15bdb443-eff3-47f4-82a9-09c511d602ad", "title": "Claude Chat"}, {"url": "https://gemini.google.com/share/87b217993b0c", "title": "Gemini"}, {"url": "https://gemini.google.com/share/0ccbeb69bb63", "title": "Gemini"}, {"url": "https://chatgpt.com/share/691aeb9b-2be4-800e-9c86-60d33cf30efc", "title": "ChatGPT - Historical game challenge"}], "videos": [], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research unveils an innovative approach to AI education: transforming chatbots directly into interactive learning games, bypassing the need for separate apps. The study began by challenging various chatbots (Claude, ChatGPT, Gemini) to play an 'etymology game,' where they generated multiple-choice questions for user-provided words and accurately kept score. While some models exhibited processing delays, others proved remarkably fast and adept, demonstrating the viability of this direct-to-chat gaming concept. Building on this success, the research further explored similar educational games, with Claude itself suggesting engaging alternatives like 'First Lines,' 'Historical \"Which Came First?\"', and 'Invention Year' games, showcasing the vast potential for dynamic, on-the-fly learning experiences within existing chat interfaces."}, {"title": "Creating Logo programs using free-form speech", "post_url": "https://docs.google.com/document/d/1G4cWHk9WqV9fi0DRJDa_M00PsUXZeQT9PIQJAr8eFPU/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/311d0e8122d2", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/54a0e1e6fa36", "title": "Gemini"}, {"url": "https://gemini.google.com/share/311d0e8122d2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/54a0e1e6fa36", "title": "Gemini"}], "videos": [{"url": "https://www.youtube.com/watch?v=s47FwJRqN_E", "title": "Talk to the Logo turtle demo", "video_id": "s47FwJRqN_E"}, {"url": "https://www.youtube.com/watch?v=s47FwJRqN_E", "title": "Talk to the Logo turtle demo", "video_id": "s47FwJRqN_E"}], "chatbots": ["Gemini"], "description": "Ken Kahn's research introduces an innovative app, developed rapidly with Gemini 2.5 Pro, that allows users to create Logo programs using free-form speech. This proof-of-concept project began by generating simple turtle graphics from spoken commands, quickly evolving into a full Logo interpreter. Users can now articulate requests like \"draw a red triangle,\" and the app translates these into executable Logo code. This exploration highlights the power of large language models for iterative development and offers a compelling new approach to making programming education and visual coding remarkably intuitive and accessible."}, {"title": "A Tarot Card app conceived and implemented by Gemini 3 Pro", "post_url": "https://docs.google.com/document/d/1HUQd8d342PBNvObqdGy531oBX5GiJvTEbtpjPl2F1vg/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/6c977df13ea2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1e9132074378", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/misc/zeitgeist-tarot-journal.html", "title": "My Zeitgeist Tarot Journal"}, {"url": "https://toontalk.github.io/AI/misc/zeitgeist-tarot-journal%20for%20ken%20kahn.html", "title": "My Zeitgeist Tarot Journal"}, {"url": "https://toontalk.github.io/AI/misc/zeitgeist-tarot-journal.html", "title": "My Zeitgeist Tarot Journal"}, {"url": "https://toontalk.github.io/AI/misc/zeitgeist-tarot-journal%20for%20ken%20kahn.html", "title": "My Zeitgeist Tarot Journal"}], "chat_logs": [{"url": "https://gemini.google.com/share/ca139d0e06b0", "title": "Gemini"}, {"url": "https://gemini.google.com/share/427f13cb9122", "title": "Gemini"}, {"url": "https://gemini.google.com/share/0d2ad088fb4b", "title": "Gemini"}, {"url": "https://gemini.google.com/share/ca139d0e06b0", "title": "Gemini"}, {"url": "https://ai.google.dev/gemini-api/docs/tools", "title": "Gemini"}, {"url": "https://gemini.google.com/share/6c977df13ea2", "title": "Gemini"}, {"url": "https://gemini.google.com/share/427f13cb9122", "title": "Ge ough accessible, interactive learning experiences."}, {"title": "Co-creating an app for making a collage of generated images", "post_url": "https://docs.google.com/document/d/1YX2xEvLyK6aVmK40hLB8HYCrImFy2LtNBNP6kFlL688/edit?usp=sharing", "apps": [{"url": "https://gemini.google.com/share/f358e3d88601", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1ab55a07958f", "title": "Gemini"}], "chat_logs": [{"url": "https://gemini.google.com/share/aff9aaf4f733", "title": "Gemini"}, {"url": "https://gemini.google.com/share/f358e3d88601", "title": "Gemini"}, {"url": "https://gemini.google.com/share/1ab55a07958f", "title": "Gemini"}, {"url": "https://gemini.google.com/share/aff9aaf4f733", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "Inspired by a 4-year-old's desire to create collages from AI-generated unicorn images, this research details the co-creation of a dedicated web app using Gemini. The project successfully leveraged Gemini 2.5 Pro and Flash to rapidly develop an intuitive application where users can describe, arrange, and resize generated images. Remarkably, a functional version was built in just two exchanges, showcasing the efficiency of AI-powered app development. This exploration highlights AI's potential for tailored educational tools, even while revealing limitations like microphone access restrictions in Gemini-hosted canvases."}, {"title": "Co-creating a multi speaker app", "post_url": "https://docs.google.com/document/d/1synmWK0U1IYdthbGREs4tD1zOekeKhD4GW8YnRXS7Lw/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/multi%20speaker.html", "title": "Multi-Speaker Text-to-Speech Converter"}, {"url": "https://toontalk.github.io/AI/apps/multi%20speaker.html", "title": "Multi-Speaker Text-to-Speech Converter"}], "chat_logs": [{"url": "https://claude.ai/share/5c1946fb-65fe-445a-8e71-0fb64ab05df4", "title": "Claude Chat"}, {"url": "https://g.co/gemini/share/77dfffb689e2", "title": "Gemini"}, {"url": "http "This research unveils a novel multi-persona app, powered by Gemini, designed to transform chat conversations into engaging storybooks and comic books. Inspired by classic comic chat, the project aimed to visualize multi-agent dialogues using Gemini's robust image generation capabilities. While successfully porting and enhancing a multi-persona chat system, the team encountered fascinating challenges in generating clean comic panels, battling persistent issues like AI embellishment, extraneous text, and spelling errors. Iterating from comic book to graphic novel and finally children's storybook styles, the work highlights the complexities and creative potential of using LLMs to craft dynamic, visually rich narratives directly from interactive dialogues."}, {"title": "Seven personas and me talking about creating an app for learning about numbers", "post_url": "https://docs.google.com/document/d/1CWc3JFlivWFzRWdT_PDgtjzSq6mI9Dl81HcIW1bGXGs/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/numbers%20by%207%20personas.html", "title": "Number Explorer Prototype V3"}, {"url": "https://g.co/gemini/share/5f4c69badae0", "title": "Gemini"}, {"url": "https://g.co/gemini/share/39eddc1f88ed", "title": "Gemini"}, {"url": "https://toontalk.github.io/AI/apps/numbers%20by%207%20personas.html", "title": "Number Explorer Prototype V3"}], "chat_logs": [{"url": "https://g.co/gemini/share/5f4c69badae0", "title": "Gemini"}, {"url": "https://g.co/gemini/share/39eddc1f88ed", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research post details an innovative exploration into AI-driven educational design, where seven distinct AI personas, including luminaries like Seymour Papert and Jean Piaget, were tasked with collaboratively creating apps for teaching young children about numbers. Through 162 simulated exchanges powered by Gemini, these virtual experts debated pedagogical theories and programming strategies. The project culminated in the development of three functional \"Number Explorer Prototype V3\" web apps, showcasing how an imagined \"dream team\" of historical intellects might approach modern educational technology. This unique experiment offers a rich simulated journey into the co-creation of learning tools."}, {"title": "Playing Tic Tac Toe with a snarky AI", "post_url": "https://docs.google.com/document/d/1CzbfTZUulzUbbfnIonD2ryNUtB6VEG0KLx9vLhMEtBU/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/tic-tac-toe.html", "title": "Tic\u2011Tac\u2011Toe \u2022 AI\u00a0vs\u00a0You"}, {"url": "https://claude.ai/public/artifacts/90b9c2b8-b349-4620-ab67-4603f22ef9a8", "title": "Claude Artifact"}, {"url": "https://chatgpt.com/canvas/shared/68027e1fc8b88191879cf8fd1bd4e82b", "title": "ChatGPT - Tic Tac Toe Perfect"}, {"url": "https://toontalk.github.io/AI/apps/tic-tac-toe.html", "title": "Tic\u2011Tac\u2011Toe \u2022 AI\u00a0vs\u00a0You"}, {"url": "https://claude.ai/public/artifacts/90b9c2b8-b349-4620-ab67-4603f22ef9a8", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://chatgpt.com/share/680291e2-14e0-800e-bff5-9d2c7ac93c2a", "title": "ChatGPT - Perfect Tic-Tac-Toe AI"}, {"url": "https://gemini.google.com/share/6ccae3243bd3", "title": "Gemini"}, {"url": "https://gemini.google.com/share/764d5f007f41", "title": "Gemini"}, {"url": "https://chatgpt.com/share/680291e2-14e0-800e-bff5-9d2c7ac93c2a", "title": "ChatGPT - Perfect Tic-Tac-Toe AI"}, {"url": "https://gemini.google.com/share/6ccae3243bd3", "title": "Gemini"}, {"url": "https://gemini.google.com/share/764d5f007f41", "title": "Gemini"}], "videos": [{"url": "https://youtu.be/oZq9enktvyk?si=kSv-NtPscd11BgoN", "title": "Talking Tic Tac Toe", "video_id": "oZq9enktvyk"}, {"url": "https://youtu.be/oZq9enktvyk?si=kSv-NtPscd11BgoN", "title": "Talking Tic Tac Toe", "video_id": "oZq9enktvyk"}], "chatbots": ["ChatGPT", "Claude", "Gemini"], "description": "This research chronicles the development of an engaging Tic-Tac-Toe game where the AI opponent truly comes alive. Initially crafted for perfect play with ChatGPT, the project significantly evolved by integrating Gemini. This AI now not only makes perfect moves but also delivers snarky remarks and responds conversationally to player speech. The author meticulously refined this voice-interactive experience through numerous iterations, creating a fascinating demonstration of advanced AI interaction design, complete with versions playable across various platforms like Gemini canvases and Claude artifacts."}, {"title": "An app for exploring creativity in chatbots", "post_url": "https://docs.google.com/document/d/1psNLuXuY3xQOVbX9coMWwNh1IB6sO2CQLwuIEB8jrIQ/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/llm-creativity-explorer.html", "title": "Gemini Response Explorer"}, {"url": "https://claude.ai/public/artifacts/4a8b1786-5063-4051-a4ea-82ea392727ee", "title": "Claude Artifact"}, {"url": "https://toontalk.github.io/AI/apps/llm-creativity-explorer.html", "title": "Gemini Response Explorer"}, {"url": "https://claude.ai/public/artifacts/4a8b1786-5063-4051-a4ea-82ea392727ee", "title": "Claude Artifact"}], "chat_logs": [{"url": "https://claude.ai/share/e7edf33f-a25b-4000-87f0-3b9bc8fabd2f", "title": "Claude Chat"}, {"url": "https://claude.ai/share/e7edf33f-a25b-4000-87f0-3b9bc8fabd2f", "title": "Claude Chat"}], "videos": [], "chatbots": ["Claude"], "description": "Inspired by research revealing AI's dual impact on creativity\u2014boosting individual output but potentially reducing collective diversity\u2014this project introduces the Gemini Response Explorer and Claude Artifact apps. These specialized tools were developed to deeply investigate chatbot creativity, running 12 experiments based on original prompts, such as generating adventure story summaries. The research meticulously explored how varying 'temperature' settings directly influence the diversity of LLM responses, and whether explicit prompts like \"Be creative\" could further enhance uniqueness. This hands-on investigation offers critical insights into fine-tuning AI to foster genuinely diverse and original creative content."}, {"title": "Gemini 2.0 Flash talking to itself", "post_url": "https://docs.google.com/document/d/1dJvZxR4kpxL7bV35dvXow23i2F-caMP7YanP2gMyK40/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/gemini-flash.html", "title": "ToonTalk"}, {"url": "https://toontalk.github.io/AI/apps/soup%20game.html", "title": "Sentient Spoonful (Emoji Edition with Sound)"}, {"url": "https://toontalk.github.io/AI/apps/gemini-flash.html", "title": "ToonTalk"}, {"url": "https://toontalk.github.io/AI/apps/soup%20game.html", "title": "Sentient Spoonful (Emoji Edition with Sound)"}], "chat_logs": [{"url": "https://chatgpt.com/share/67aee34a-7d24-800e-a93a-87c940e07285", "title": "ChatGPT - Sentient Spoonful Game Design"}, {"url": "https://chatgpt.com/share/67aee34a-7d24-800e-a93a-87c940e07285", "title": "ChatGPT - Sentient Spoonful Game Design"}], "videos": [], "chatbots": ["ChatGPT", "Gemini"], "description": "Leveraging Google's Gemini 2.0 Flash API, Ken Kahn embarked on a fascinating exploration: enabling multiple AI instances to 'talk' to each other. He developed a dynamic web application that allows users to initiate and observe these inter-AI conversations, which evolved to support graphics and animations. This innovative setup led to the creation of whimsical apps like 'Sentient Spoonful (Emoji Edition with Sound)' and even a collaborative 'soup game,' designed by an 'Expert programmer' AI and an 'Out-of-the-box thinker' AI. The research vividly demonstrates how AI models, when prompted to interact, can generate novel ideas and creative applications."}, {"title": "Using \u201cReasoning\u201d chatbots to improve the Connections Puzzle game generator", "post_url": "https://docs.google.com/document/d/14Yl4mC8jtiA56T3CdPOAiRIQ1V4d1a557wXYRywbNTc/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/Connections-v2/index.html", "title": "Connections Game"}, {"url": "https://toontalk.github.io/AI/apps/Connections-v2/index.html", "title": "Connections Game"}], "chat_logs": [{"url": "https://chatgpt.com/share/67975b96-3f48-800e-8eb9-cc30e7e39276", "title": "ChatGPT - Word Categorization Challenge"}, {"url": "https://chatgpt.com/share/67975b96-3f48-800e-8eb9-cc30e7e39276", "title": "ChatGPT - Word Categorization Challenge"}], "videos": [], "chatbots": ["ChatGPT"], "description": "This research unveils a novel method for refining AI prompts by tapping into the \"reasoning\" capabilities of advanced chatbots like ChatGPT o1 and DeepSeek R1. Instead of just observing the output for a Connections Puzzle game generator, the author analyzed the models' internal chain of thought, revealing hidden misunderstandings and ambiguities in the original prompt. This unique approach allowed for targeted refinement through iterative conversations, ultimately producing a significantly improved prompt for generating complex word puzzles. The project highlights a powerful new strategy for AI developers: leveraging a model's \"thinking\" process to enhance prompt quality and application performance."}, {"title": "Chatbot-assisted co-creation of a neural net to judge confidence from text", "post_url": "https://docs.google.com/document/d/1AuhwCuprcrtREaT8zRW3RWdNSpf0ILlVHRzGBq4-I18/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/confidence/index.html", "title": "Confidence Predictor"}, {"url": "https://toontalk.github.io/AI/apps/confidence/confidence-by-o1.html", "title": "Confidence Classifier (All Updates)"}, {"url": "https://toontalk.github.io/AI/apps/confidence/confidence-by-deepseek-r1-fixed-by-claude.html", "title": "Confidence Level Predictor"}, {"url": "https://toontalk.github.io/AI/apps/confidence/index.html", "title": "Confidence Predictor"}, {"url": "https://toontalk.github.io/AI/apps/confidence/confidence-by-o1.html", "title": "Confidence Classifier (All Updates)"}, {"url": "https://toontalk.github.io/AI/apps/confidence/confidence-by-deepseek-r1-fixed-by-claude.html", "title": "Confidence Level Predictor"}], "chat_logs": [{"url": "https://chat.openai.com/share/3767033d-7da0-47e3-9383-a5556e4dc1eb", "title": "ChatGPT - Text Confidence Predictor."}, {"url": "https://chat.openai.com/share/3767033d-7da0-47e3-9383-a5556e4dc1eb", "title": "ChatGPT - Text Confidence Predictor."}], "videos": [], "chatbots": ["Claude"], "description": "This research details the fascinating journey of chatbot-assisted co-creation in developing a neural network capable of judging confidence from text. Beginning with a Snap! model, the project rapidly evolved, using ChatGPT to co-create a web-based version and later employing Claude 3.5 to dramatically enlarge the training dataset. This iterative process, which also explored recreating the app with other LLMs, significantly improved model accuracy. The study powerfully demonstrates the profound utility of large language models in developing machine learning applications, highlighting their ability to offer valuable suggestions for architecture and training, ultimately resulting in practical tools like the \"Confidence Predictor.\""}, {"title": "Experiments with an app to repeat prompts to LLMs", "post_url": "https://docs.google.com/document/d/1ckK0X4Zl6cm8PCz0_wpEpPptebpA_brAaPBTle-BfX8/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/repeated%20prompting/index.html", "title": "Repeating LLM Prompter (LanguageModel API)"}, {"url": "https://toontalk.github.io/AI/apps/repeated%20prompting/index.html", "title": "Repeating LLM Prompter (LanguageModel API)"}], "chat_logs": [{"url": "https://gemini.google.com/share/3013c49f7e74", "title": "Gemini"}, {"url": "https://gemini.google.com/share/3013c49f7e74", "title": "Gemini"}], "videos": [], "chatbots": ["Gemini"], "description": "This research unveils the \"Repeating LLM Prompter,\" an innovative app designed to easily experiment with iterative prompting of Large Language Models. Co-created with AI, the app feeds an LLM a static prompt combined with its previous response, continuously refining the dynamic text over multiple iterations. Fascinating results, like Gemini Flash 1.5's transformation of \"To be, or not to be?\" into a profound, cosmic reflection over 23 rounds, demonstrate LLMs' surprising capacity to deepen and elaborate on a theme through repeated engagement. This novel approach offers a unique lens into exploring AI's creative and expansive potential."}, {"title": "ChatGPT 4o creates a Chrome extension to find the contextual meaning of words on web pages", "post_url": "https://docs.google.com/document/d/1TRMN1pNX0xfbK0MVagNxdKb066_pKV2hn2N9lec2Rb4/edit?usp=sharing", "apps": [], "chat_logs": [], "videos": [], "chatbots": ["ChatGPT"], "description": "This research highlights ChatGPT 4o's remarkable ability to autonomously develop a functional Chrome extension from concept to deployment. Guided by simple prompts and new API documentation, the AI generated every line of code for a tool that identifies the contextual meaning of selected words on any webpage. Intended to run locally with Gemini Nano, this extension impressively distinguishes between multiple word meanings, accurately explaining \"dubbed\" within its specific sentence. What began as a 30-minute prototype evolved into a polished, context-aware application in just two hours, showcasing the immense potential for LLMs to rapidly create practical software solutions."}, {"title": "Playing chess by flipping between a ChatGPT tab and a chess app", "post_url": "https://docs.google.com/document/d/1B21M_gw_lUJ8dZ0nK74oK0ikJV0KXnc9PiGyRlK4u1E/edit?usp=sharing", "apps": [{"url": "https://toontalk.github.io/AI/apps/chess%20by%204o/index.html", "title": "Chess Game"}, {"url": "https://toontalk.github.io/AI/apps/chess%20by%204o/index.html", "title": "Chess Game"}, {"url": "https://toontalk.github.io/AI/apps/chess%20by%204o/index.html", "title": "Chess Game"}, {"url": "https://toontalk.github.io/AI/apps/chess%20by%204o/index.html", "title": "Chess Game"}], "chat_logs": [], "videos": [], "chatbots": ["ChatGPT"], "description": "This research explores an ingenious solution to playing chess with AI, moving beyond tedious manual copy-pasting. Initially, a custom web-based chess app was easily created using ChatGPT 4o, allowing users to intuitively drag pieces and view standard notation. The true innovation, however, lies in a Chrome extension developed with Claude 3.5, which completely automates the game flow. This extension seamlessly copies user moves from the chess tab to ChatGPT and pastes AI responses back into the chess app, even submitting them. The result is a fully automated, fluid chess experience, showcasing AI's power to streamline complex human-computer interactions."}, {"title": "Dialog and OceanAI responses and generated games by Claude 3", "post_url": "https://docs.google.com/document/d/1pOF4bUHruXSYs5vknyH00zhd9sa-hxrK2sV5hFC07UY/edit?usp=sharing", "apps": [], "chat_logs": [{"url": "https://chatgpt.com/share/02a8d326-8a39-4457-9395-65841e8620d0", "title": "ChatGPT - Illustrated Story Ideas"}, {"url": "https://chatgpt.com/share/02a8d326-8a39-4457-9395-65841e8620d0", "title": "ChatGPT - Illustrated Story Ideas"}], "videos": [], "chatbots": ["ChatGPT", "Claude"], "description": "This research explores a unique AI education experiment where Claude 3.5 Sonnet played a dual role: simulating middle school students and acting as their app development chatbot. The AI generated a 24-page illustrated story depicting students Zoe and Alex creating \"EcoQuest,\" a simple web game promoting environmental awareness. The narrative showcases an iterative development process\u2014starting simple, testing versions, reporting issues, and suggesting improvements\u2014all through conversational prompts. This innovative setup demonstrates how non-technical learners can develop functional applications by engaging deeply with AI, with ChatGPT 4o providing initial game ideas and story illustrations. It offers a compelling vision for AI's potential in fostering creative, project-based learning."}];

        function deduplicateLinks(links) {
            const seen = new Set();
            return links.filter(link => {
                if (seen.has(link.url)) return false;
                seen.add(link.url);
                return true;
            });
        }

        function renderPosts() {
            const tbody = document.getElementById('postsTable');
            tbody.innerHTML = postsData.map((post, index) => {
                const chatbotBadges = post.chatbots.map(bot =>
                    `<span class="chatbot-badge chatbot-${bot.toLowerCase()}">${bot}</span>`
                ).join('');

                const allLinks = deduplicateLinks([
                    ...post.apps.map(app => ({ url: app.url, title: app.title, type: 'app' })),
                    ...post.chat_logs.map(chat => ({ url: chat.url, title: chat.title, type: 'chat' })),
                    ...post.videos.map(video => ({ url: video.url, title: video.title, type: 'video' }))
                ]);

                const linksHtml = allLinks.length > 0
                    ? allLinks.map(link => `<a href="${link.url}" target="_blank" class="badge badge-${link.type}">${link.title}</a>`).join('')
                    : '<span style="color: #999; font-style: italic;">No links</span>';

                return `
                    <tr>
                        <td>
                            <div class="post-title">
                                <a href="${post.post_url}" target="_blank">${post.title}</a>
                                <button class="info-btn" onclick="showDescription(${index})">i</button>
                            </div>
                        </td>
                        <td>${chatbotBadges || '<span style="color: #999;">None</span>'}</td>
                        <td>${linksHtml}</td>
                    </tr>
                `;
            }).join('');
        }

        const modal = document.getElementById('modal');
        const closeBtn = document.querySelector('.close');

        function showDescription(index) {
            const post = postsData[index];
            document.getElementById('modalTitle').textContent = post.title;
            const description = post.description || 'No description available.';
            const htmlContent = marked.parse(description);
            document.getElementById('modalBody').innerHTML = htmlContent;
            modal.style.display = 'block';
        }

        closeBtn.onclick = function() { modal.style.display = 'none'; }
        window.onclick = function(event) { if (event.target == modal) modal.style.display = 'none'; }

        renderPosts();
    </script>
</body>
